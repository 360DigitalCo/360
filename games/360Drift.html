<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>360 Drift</title>
<link rel="icon" href="../favicon-32x32.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace}
#wrap{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw)}
canvas{width:100%;height:100%;display:block}

/* ── HUD ── */
#hud{position:absolute;inset:0;pointer-events:none}

/* top-left: lap + time */
#hud-tl{position:absolute;top:12px;left:14px;display:flex;flex-direction:column;gap:5px}
/* top-right: players online */
#hud-tr{position:absolute;top:12px;right:14px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
/* bottom-right: speedometer canvas */
#hud-br{position:absolute;bottom:12px;right:14px}
/* bottom-left: nitro + drift bars */
#hud-bl{position:absolute;bottom:102px;left:14px;display:flex;flex-direction:column;gap:6px}
/* centre announce */
#ann{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);font-size:18px;color:#fff;letter-spacing:.3em;text-align:center;pointer-events:none;opacity:0;text-shadow:0 2px 20px #0008;transition:opacity .3s;font-weight:900}
#ann.on{opacity:1}
/* minimap */
#minimap{position:absolute;bottom:12px;left:14px;pointer-events:none;opacity:.5}

.chip{background:#000000aa;border:1px solid #ffffff1a;border-radius:5px;padding:5px 10px;backdrop-filter:blur(8px);color:#dde;font-size:10px;letter-spacing:.06em;line-height:1.6}
.chip .val{color:#fff;font-size:15px;font-weight:900;letter-spacing:.04em;display:block;line-height:1.2}
.chip .lbl{font-size:9px;opacity:.55;text-transform:uppercase;letter-spacing:.1em}

.bar-row{display:flex;align-items:center;gap:7px}
.bar-lbl{font-size:9px;color:#ffffff66;text-transform:uppercase;letter-spacing:.08em;width:34px;text-align:right}
.bar-bg{width:90px;height:5px;background:#ffffff18;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .1s linear}
#nb{background:linear-gradient(90deg,#e06000,#ff2200)}
#db{background:linear-gradient(90deg,#bbb,#fff)}

.online-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#44ff88;margin-right:5px;vertical-align:middle}

/* ── OVERLAYS ── */
.ov{position:absolute;inset:0;background:#000000d0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;backdrop-filter:blur(10px)}
#fin{display:none}
.ov h1{font-size:32px;color:#fff;letter-spacing:.2em;font-weight:900}
.ov .sub{font-size:10px;color:#667;letter-spacing:.18em;margin-top:-8px}
.ov p{font-size:11px;color:#778;max-width:320px;text-align:center;line-height:1.9}
.name-row{display:flex;gap:8px;align-items:center;margin-top:2px}
.name-input{background:#ffffff0e;border:1px solid #ffffff33;color:#fff;padding:8px 12px;border-radius:5px;font-size:12px;font-family:inherit;width:180px;text-align:center;outline:none}
.name-input:focus{border-color:#ffffff66}
.btn{background:#ffffff12;border:1px solid #ffffff2a;color:#fff;padding:9px 24px;border-radius:5px;cursor:pointer;font-size:12px;letter-spacing:.1em;font-weight:700;pointer-events:auto;font-family:inherit}
.btn:hover{background:#ffffff22}
.btn.p{background:#cc2200cc;border-color:#ff4422aa}
.btn.p:hover{background:#dd3311}
.bigtime{font-size:32px;color:#fff;font-weight:900;letter-spacing:.06em}
.rec{font-size:11px;color:#ffcc44;letter-spacing:.1em;margin-top:-6px}
.lb{width:260px;max-height:130px;overflow:hidden}
.lb-row{display:flex;justify-content:space-between;font-size:10px;color:#aab;padding:3px 0;border-bottom:1px solid #ffffff0d}
.lb-row:first-child{color:#ffcc44}
.lb-row b{color:#fff}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud">
  <div id="hud-tl">
    <div class="chip"><span class="lbl">Lap</span><span class="val" id="hl">1 / 3</span></div>
    <div class="chip"><span class="lbl">Time</span><span class="val" id="ht">00:00.000</span></div>
    <div class="chip"><span class="lbl">Best</span><span class="val" id="hb">--:--.---</span></div>
  </div>
  <div id="hud-tr">
    <div class="chip" id="online-chip"><span class="lbl"><span class="online-dot"></span>Online</span><span class="val" id="honline">1</span></div>
    <div class="chip" id="pos-chip" style="display:none"><span class="lbl">Position</span><span class="val" id="hpos">P1</span></div>
  </div>
  <div id="hud-bl">
    <div class="bar-row"><span class="bar-lbl">Nitro</span><div class="bar-bg"><div class="bar-fill" id="nb" style="width:100%"></div></div></div>
    <div class="bar-row"><span class="bar-lbl">Drift</span><div class="bar-bg"><div class="bar-fill" id="db" style="width:0%"></div></div></div>
  </div>
  <div id="hud-br"><canvas id="sc" width="110" height="110"></canvas></div>
  <canvas id="minimap" width="80" height="80" style="position:absolute;bottom:12px;left:14px;border-radius:50%;border:1px solid #ffffff18;background:#00000077;backdrop-filter:blur(4px)"></canvas>
</div>
<div id="ann"></div>

<!-- Start -->
<div class="ov" id="st">
  <h1>360 DRIFT</h1>
  <div class="sub">MULTIPLAYER CIRCUIT RACING</div>
  <p>3 laps on the Hakone Circuit. Race live against other players — ghost cars show their position in real time.</p>
  <div class="name-row">
    <input class="name-input" id="pname" placeholder="Your name" maxlength="14" value="Driver">
    <button class="btn p" id="bst">▶ RACE</button>
  </div>
  <div style="margin-top:4px;font-size:10px;color:#556;letter-spacing:.06em">W/S = throttle · A/D = steer · SPACE = nitro · R = reset</div>
  <div class="lb" id="lb-start"></div>
</div>

<!-- Finish -->
<div class="ov" id="fin">
  <h1>FINISH</h1>
  <div class="bigtime" id="ft">00:00.000</div>
  <div class="rec" id="fr"></div>
  <div style="display:flex;gap:10px;margin-top:8px">
    <button class="btn p" id="bag">RACE AGAIN</button>
    <button class="btn" id="bmn">MENU</button>
  </div>
  <div class="lb" id="lb-finish" style="margin-top:8px"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';

/* ── Supabase config ── */
const SB_URL='https://xcseqgpbwexfqbssfszq.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhjc2VxZ3Bid2V4ZnFic3Nmc3pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NTQ0NDEsImV4cCI6MjEwNTMzMDQ0MX0.rypJW0eVU15JG-N7Iwrr6U-ELtrIC_gm_xQdQpoeiH8';
const SB={
  async query(sql){
    const r=await fetch(`${SB_URL}/rest/v1/rpc/query`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:JSON.stringify({query:sql})}).catch(()=>null);
    return r?.ok?r.json():null;
  },
  async upsert(row){
    return fetch(`${SB_URL}/rest/v1/drift_players?on_conflict=id`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(row),
    }).catch(()=>null);
  },
  async select(){
    const r=await fetch(`${SB_URL}/rest/v1/drift_players?select=*`,{
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
    }).catch(()=>null);
    return r?.ok?r.json():[];
  },
  async delete(id){
    return fetch(`${SB_URL}/rest/v1/drift_players?id=eq.${id}`,{
      method:'DELETE',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
    }).catch(()=>null);
  },
};

/* ── player ID ── */
const MY_ID=localStorage.getItem('drift-pid')||(()=>{const id=Math.random().toString(36).slice(2,10);localStorage.setItem('drift-pid',id);return id;})();

/* ── renderer ── */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
function resize(){
  const w=canvas.parentElement.clientWidth,h=canvas.parentElement.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x93afc0,45,150);
scene.background=new THREE.Color(0x93afc0);
const camera=new THREE.PerspectiveCamera(72,16/9,0.05,200);
const cockpitGroup=new THREE.Group();
camera.add(cockpitGroup);
scene.add(camera);

/* ── RNG ── */
function mkRng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/0x100000000};}

/* ══════════════════════════════════════════
   TRACK — wider, longer Hakone-style circuit
   with more varied corners
   ══════════════════════════════════════════ */
const RAW=[
  [  0,-44],[  0,-34],[  0,-22],[  0,-10],
  [  7,  2],[ 16, 10],[ 26, 14],[ 36, 12],
  [ 44,  5],[ 48, -4],[ 46,-14],[ 38,-20],
  [ 27,-23],[ 16,-21],[  9,-14],[  8, -4],
  [  6,  8],[  2, 20],[ -6, 30],[-16, 36],
  [-26, 38],[-38, 36],[-48, 28],[-54, 16],
  [-58,  2],[-58,-12],[-54,-24],[-44,-32],
  [-32,-38],[-18,-42],[ -8,-44],[  0,-44],
].map(([x,z])=>new THREE.Vector3(x,0,z));

const spline=new THREE.CatmullRomCurve3(RAW,true,'catmullrom',0.4);
const TSEGS=360;
const TPTS=spline.getPoints(TSEGS);
const TW=4.5;

function tTan(i){
  const a=TPTS[(i+1)%TSEGS],b=TPTS[(i-1+TSEGS)%TSEGS];
  return new THREE.Vector3(a.x-b.x,0,a.z-b.z).normalize();
}
function nearTP(x,z){
  let bi=0,bd=Infinity;
  for(let i=0;i<TSEGS;i++){
    const p=TPTS[i],d=(p.x-x)*(p.x-x)+(p.z-z)*(p.z-z);
    if(d<bd){bd=d;bi=i;}
  }
  return{p:TPTS[bi],i:bi,d:Math.sqrt(bd)};
}

/* ── BUILD ROAD ── */
function buildRoad(){
  /* asphalt */
  const rv=[],ri=[];
  for(let i=0;i<=TSEGS;i++){
    const ii=i%TSEGS,p=TPTS[ii],t=tTan(ii);
    const rx=-t.z,rz=t.x;
    rv.push(p.x-rx*TW,0,p.z-rz*TW, p.x+rx*TW,0,p.z+rz*TW);
    if(i<TSEGS){const b=i*2;ri.push(b,b+2,b+1,b+1,b+2,b+3);}
  }
  const rg=new THREE.BufferGeometry();
  rg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(rv),3));
  rg.setIndex(ri); rg.computeVertexNormals();
  scene.add(new THREE.Mesh(rg,new THREE.MeshLambertMaterial({color:0x252525})));

  /* white edge lines */
  [-1,1].forEach(side=>{
    const lv=[],li=[];
    for(let i=0;i<=TSEGS;i++){
      const ii=i%TSEGS,p=TPTS[ii],t=tTan(ii);
      const rx=-t.z,rz=t.x;
      lv.push(p.x+rx*(TW-.2)*side,.01,p.z+rz*(TW-.2)*side, p.x+rx*TW*side,.01,p.z+rz*TW*side);
      if(i<TSEGS){const b=i*2;li.push(b,b+2,b+1,b+1,b+2,b+3);}
    }
    const lg=new THREE.BufferGeometry();
    lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(lv),3));
    lg.setIndex(li); lg.computeVertexNormals();
    scene.add(new THREE.Mesh(lg,new THREE.MeshLambertMaterial({color:0xfafafa})));
  });

  /* kerbs */
  [-1,1].forEach(side=>{
    for(let i=0;i<TSEGS;i+=2){
      const p=TPTS[i],t=tTan(i);
      const rx=-t.z,rz=t.x;
      const ox=p.x+rx*(TW+.55)*side, oz=p.z+rz*(TW+.55)*side;
      const km=new THREE.Mesh(new THREE.BoxGeometry(.9,.04,.75),
        new THREE.MeshLambertMaterial({color:Math.floor(i/2)%2===0?0xcc1122:0xf8f8f8}));
      km.position.set(ox,.02,oz);
      km.rotation.y=Math.atan2(t.x,t.z);
      scene.add(km);
    }
  });

  /* centre dashes */
  for(let i=0;i<TSEGS;i+=6){
    const p=TPTS[i],t=tTan(i);
    const dm=new THREE.Mesh(new THREE.BoxGeometry(.12,.015,.85),
      new THREE.MeshLambertMaterial({color:0xeeee33}));
    dm.position.set(p.x,.01,p.z);
    dm.rotation.y=Math.atan2(t.x,t.z);
    scene.add(dm);
  }

  /* run-off tarmac at hairpins */
  [.12,.55].forEach(frac=>{
    const ci=Math.floor(frac*TSEGS);
    const av=[],ai=[];
    for(let k=-10;k<=10;k++){
      const idx=(ci+k+TSEGS)%TSEGS,ip=TPTS[idx],it=tTan(idx);
      const irx=-it.z,irz=it.x,ew=TW+3;
      av.push(ip.x-irx*ew,0,ip.z-irz*ew, ip.x+irx*ew,0,ip.z+irz*ew);
      if(k<10){const b=(k+10)*2;ai.push(b,b+2,b+1,b+1,b+2,b+3);}
    }
    const ag=new THREE.BufferGeometry();
    ag.setAttribute('position',new THREE.BufferAttribute(new Float32Array(av),3));
    ag.setIndex(ai); ag.computeVertexNormals();
    scene.add(new THREE.Mesh(ag,new THREE.MeshLambertMaterial({color:0x333333})));
  });

  /* ground */
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(700,700),
    new THREE.MeshLambertMaterial({color:0x3a6b2a}));
  gnd.rotation.x=-Math.PI/2; gnd.position.y=-.08;
  scene.add(gnd);

  /* start/finish gantry */
  const p0=TPTS[0],t0=tTan(0),r0x=-t0.z,r0z=t0.x;
  const gMat=new THREE.MeshLambertMaterial({color:0xddd});
  [-1,1].forEach(side=>{
    const post=new THREE.Mesh(new THREE.BoxGeometry(.3,5.5,.3),gMat);
    post.position.set(p0.x+r0x*(TW+.6)*side,2.75,p0.z+r0z*(TW+.6)*side);
    scene.add(post);
  });
  const beam=new THREE.Mesh(new THREE.BoxGeometry((TW+.6)*2+.3,.28,.38),gMat);
  beam.position.set(p0.x,5.5,p0.z);
  beam.rotation.y=Math.atan2(r0x,r0z);
  scene.add(beam);
  for(let fi=0;fi<10;fi++){
    const fc=new THREE.Mesh(new THREE.BoxGeometry(1.1,.24,.38),
      new THREE.MeshLambertMaterial({color:fi%2?0x111:0xfff}));
    fc.position.set(p0.x+r0x*(fi-4.5)*1.05,5.5,p0.z+r0z*(fi-4.5)*1.05);
    fc.rotation.y=Math.atan2(r0x,r0z);
    scene.add(fc);
  }

  /* corner boards */
  [.12,.35,.58,.80].forEach((frac,ci)=>{
    const idx=Math.floor(frac*TSEGS),p=TPTS[idx],t=tTan(idx);
    const rx=-t.z,rz=t.x;
    [-1,1].forEach(side=>{
      const post=new THREE.Mesh(new THREE.BoxGeometry(.08,1.4,.08),
        new THREE.MeshLambertMaterial({color:0x888}));
      post.position.set(p.x+rx*(TW+1.1)*side,.7,p.z+rz*(TW+1.1)*side);
      scene.add(post);
      const board=new THREE.Mesh(new THREE.BoxGeometry(.8,.55,.05),
        new THREE.MeshLambertMaterial({color:ci%2?0x0033bb:0xbb3300}));
      board.position.set(p.x+rx*(TW+1.1)*side,1.4,p.z+rz*(TW+1.1)*side);
      board.rotation.y=Math.atan2(rx*side,rz*side);
      scene.add(board);
    });
  });
}

/* ── ENVIRONMENT ── */
function buildEnv(){
  const rng=mkRng(0xabcd1234);
  const treeMats=[0x2d6e1a,0x3a8022,0x224d12,0x1e5c10].map(c=>new THREE.MeshLambertMaterial({color:c}));
  const trunkMat=new THREE.MeshLambertMaterial({color:0x6b4423});
  const coneGeos=[new THREE.ConeGeometry(1.3,3,7),new THREE.ConeGeometry(1.6,3.5,6),new THREE.ConeGeometry(1,2.4,5)];
  const trunkGeo=new THREE.CylinderGeometry(.18,.24,1.3,5);

  for(let i=0;i<220;i++){
    const t=i/220,ii=Math.floor(t*TSEGS);
    const p=TPTS[ii],tan=tTan(ii);
    const rx=-tan.z,rz=tan.x,side=i%2?1:-1;
    const dist=TW+2.2+rng()*14;
    const bx=p.x+rx*dist*side,bz=p.z+rz*dist*side;
    const h=1.5+rng()*2.4;
    const trunk=new THREE.Mesh(trunkGeo,trunkMat); trunk.position.set(bx,.65,bz); scene.add(trunk);
    const cone=new THREE.Mesh(coneGeos[Math.floor(rng()*3)],treeMats[Math.floor(rng()*4)]);
    cone.scale.set(.7+rng()*.7,.7+rng()*.8,.7+rng()*.7);
    cone.position.set(bx,1.3+h*.5,bz); scene.add(cone);
    if(rng()<.5){
      const c2=new THREE.Mesh(coneGeos[Math.floor(rng()*3)],treeMats[Math.floor(rng()*4)]);
      c2.scale.set(.5+rng()*.5,.5+rng()*.6,.5+rng()*.5);
      c2.position.set(bx,2+h*.5,bz); scene.add(c2);
    }
  }

  /* tyre barriers */
  const tyreMats=[0x111,0xcc1111,0xfafafa].map(c=>new THREE.MeshLambertMaterial({color:c}));
  const tyreGeo=new THREE.CylinderGeometry(.38,.38,.38,8);
  [.08,.18,.54,.64].forEach(frac=>{
    const ci=Math.floor(frac*TSEGS);
    for(let k=-7;k<=7;k++){
      const idx=(ci+k+TSEGS)%TSEGS,p=TPTS[idx],t=tTan(idx);
      const rx=-t.z,rz=t.x;
      [-1,1].forEach((side,si)=>{
        for(let row=0;row<3;row++){
          const tm=new THREE.Mesh(tyreGeo,tyreMats[(k+row+si)%3]);
          tm.position.set(p.x+rx*(TW+.6)*side,.19+row*.38,p.z+rz*(TW+.6)*side);
          scene.add(tm);
        }
      });
    }
  });

  /* armco */
  const armcoMat=new THREE.MeshLambertMaterial({color:0xc0c0c0});
  for(let i=0;i<TSEGS;i+=3){
    const p=TPTS[i],t=tTan(i);
    const rx=-t.z,rz=t.x;
    const nxt=TPTS[(i+3)%TSEGS];
    const sl=Math.hypot(nxt.x-p.x,nxt.z-p.z);
    [-1,1].forEach(side=>{
      const bar=new THREE.Mesh(new THREE.BoxGeometry(sl+.05,.22,.09),armcoMat);
      bar.position.set(p.x+rx*(TW+1.1)*side,.45,p.z+rz*(TW+1.1)*side);
      bar.rotation.y=Math.atan2(t.x,t.z);
      scene.add(bar);
      if(i%9===0){
        const post=new THREE.Mesh(new THREE.BoxGeometry(.09,.9,.09),armcoMat);
        post.position.set(p.x+rx*(TW+1.15)*side,.45,p.z+rz*(TW+1.15)*side);
        scene.add(post);
      }
    });
  }

  /* grandstand */
  const gsI=Math.floor(TSEGS*.06),gsP=TPTS[gsI],gsT=tTan(gsI);
  const gsRx=-gsT.z,gsRz=gsT.x;
  const gsMats=[new THREE.MeshLambertMaterial({color:0x1a3a6a}),new THREE.MeshLambertMaterial({color:0x0e2448})];
  const roofMat=new THREE.MeshLambertMaterial({color:0x999});
  const seatCols=[0xdd2222,0x2244cc,0xeee,0x22aa44,0xffcc00];
  [-1,1].forEach(side=>{
    const cx=gsP.x+gsRx*(TW+7)*side,cz=gsP.z+gsRz*(TW+7)*side;
    for(let row=0;row<6;row++){
      const sw=new THREE.Mesh(new THREE.BoxGeometry(16,.35+row*.28,1.4),gsMats[row%2]);
      sw.position.set(cx+gsT.x*row*.65,.2+row*.55,cz+gsT.z*row*.65);
      sw.rotation.y=Math.atan2(gsT.x,gsT.z);
      scene.add(sw);
      for(let ci=0;ci<32;ci++){
        const seat=new THREE.Mesh(new THREE.BoxGeometry(.35,.4,.35),
          new THREE.MeshLambertMaterial({color:seatCols[(ci+row)%5]}));
        seat.position.set(cx+gsT.x*row*.65+gsRx*(ci-15.5)*.46,.52+row*.55,
          cz+gsT.z*row*.65+gsRz*(ci-15.5)*.46);
        scene.add(seat);
      }
    }
    const roof=new THREE.Mesh(new THREE.BoxGeometry(18,.22,3.5),roofMat);
    roof.position.set(cx+gsT.x*2.5,3.5,cz+gsT.z*2.5);
    roof.rotation.y=Math.atan2(gsT.x,gsT.z);
    scene.add(roof);
    for(let ri=-3;ri<=3;ri++){
      const rp=new THREE.Mesh(new THREE.BoxGeometry(.16,1.8,.16),roofMat);
      rp.position.set(cx+gsT.x*2.5+gsRx*ri*2.8*side,2.65,cz+gsT.z*2.5+gsRz*ri*2.8*side);
      scene.add(rp);
    }
  });

  /* pit wall */
  const pitI=Math.floor(TSEGS*.02);
  for(let k=0;k<14;k++){
    const idx=(pitI+k*2)%TSEGS,pp=TPTS[idx],pt=tTan(idx);
    const prx=-pt.z,prz=pt.x;
    const wall=new THREE.Mesh(new THREE.BoxGeometry(2.4,.95,.2),
      new THREE.MeshLambertMaterial({color:k%3===0?0xcc2200:0xddd}));
    wall.position.set(pp.x+prx*(TW+.95),.475,pp.z+prz*(TW+.95));
    wall.rotation.y=Math.atan2(pt.x,pt.z);
    scene.add(wall);
  }

  /* hills */
  const hillMat=new THREE.MeshLambertMaterial({color:0x3a5c28});
  [[-90,0,-70],[100,0,-55],[-65,0,90],[90,0,75],[-110,0,15],[110,0,25],[0,0,110]].forEach(([hx,,hz],hi)=>{
    const h=10+hi*3.5;
    const hill=new THREE.Mesh(new THREE.ConeGeometry(14+hi*2.5,h,8),hillMat);
    hill.position.set(hx,h/2,hz); scene.add(hill);
  });

  /* marshal posts */
  [.25,.5,.75].forEach(frac=>{
    const idx=Math.floor(frac*TSEGS),p=TPTS[idx],t=tTan(idx);
    const rx=-t.z,rz=t.x;
    const post=new THREE.Mesh(new THREE.BoxGeometry(.08,2,.08),
      new THREE.MeshLambertMaterial({color:0xddd}));
    post.position.set(p.x+rx*(TW+1.5),1,p.z+rz*(TW+1.5));
    scene.add(post);
    const flag=new THREE.Mesh(new THREE.BoxGeometry(.9,.5,.04),
      new THREE.MeshLambertMaterial({color:frac<.3?0x22aa44:frac<.6?0xffcc00:0xff2200}));
    flag.position.set(p.x+rx*(TW+1.95),2.05,p.z+rz*(TW+1.95));
    flag.rotation.y=Math.atan2(rx,rz);
    scene.add(flag);
  });
}

const PMAX=300;
const pBuf=new THREE.BufferGeometry();
const pPos=new Float32Array(PMAX*3),pCol=new Float32Array(PMAX*3);
pBuf.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pBuf.setAttribute('color',new THREE.BufferAttribute(pCol,3));
scene.add(new THREE.Points(pBuf,new THREE.PointsMaterial({size:.55,vertexColors:true,transparent:true,opacity:.65,sizeAttenuation:true,depthWrite:false})));
const PS=[];
function spawnSmoke(x,z,fx,fz){
  if(PS.length>=PMAX)return;
  const g=.5+Math.random()*.4;
  PS.push({x:x-fx*1.1+(Math.random()-.5)*.5,y:.12,z:z-fz*1.1+(Math.random()-.5)*.5,
    vx:(Math.random()-.5)*.9,vy:.35+Math.random()*.5,vz:(Math.random()-.5)*.9,life:1,r:g,g,b:g});
}
function spawnExhaust(x,z,fx,fz){
  if(PS.length>=PMAX)return;
  PS.push({x:x-fx*2+(Math.random()-.5)*.2,y:.3,z:z-fz*2+(Math.random()-.5)*.2,
    vx:-fx*.5+(Math.random()-.5)*.3,vy:.1+Math.random()*.2,vz:-fz*.5+(Math.random()-.5)*.3,
    life:1,r:.4,g:.4,b:.4});
}
function tickP(dt){
  for(let i=PS.length-1;i>=0;i--){
    const p=PS[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    p.vy-=.8*dt;p.life-=dt*1.9;
    if(p.life<=0)PS.splice(i,1);
  }
  const n=Math.min(PS.length,PMAX);
  for(let i=0;i<n;i++){
    const p=PS[i];
    pPos[i*3]=p.x;pPos[i*3+1]=p.y;pPos[i*3+2]=p.z;
    const a=p.life*.55;
    pCol[i*3]=p.r*a;pCol[i*3+1]=p.g*a;pCol[i*3+2]=p.b*a;
  }
  for(let i=n;i<PMAX;i++){pPos[i*3]=0;pPos[i*3+1]=-999;pPos[i*3+2]=0;}
  pBuf.attributes.position.needsUpdate=true;
  pBuf.attributes.color.needsUpdate=true;
}

  return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(z).padStart(3,'0')}`;

/* ── PHYSICS ── */
function tickCar(dt){
  const boosting=keys.has(' ')&&nitro>0;
  const thrK=(keys.has('w')||keys.has('arrowup'))?1:(keys.has('s')||keys.has('arrowdown'))?-.4:0;
  const steerK=(keys.has('d')||keys.has('arrowright'))?1:(keys.has('a')||keys.has('arrowleft'))?-1:0;

  if(boosting) nitro=Math.max(0,nitro-dt*18);
  else if(nitro<100) nitro=Math.min(100,nitro+dt*10);

  const fwdX=Math.sin(car.ang),fwdZ=Math.cos(car.ang);
  const sideX=-fwdZ,sideZ=fwdX;
  const spd=Math.hypot(car.vx,car.vz);
  const fwdSpd=car.vx*fwdX+car.vz*fwdZ;

  const topSpd=boosting?52:38;
  const thrust=16*(1-Math.max(0,fwdSpd)/topSpd)*Math.max(0,thrK)+(thrK<0?7*thrK:0);
  car.vx+=fwdX*thrust*dt;
  car.vz+=fwdZ*thrust*dt;

  // steering: ang increases = CCW = left, D=right → subtract
  const spdN=Math.min(1,spd/20);
  const steerRate=steerK*3.0*(spdN/(.5+spdN*.5))*dt;
  if(fwdSpd>.3) car.ang-=steerRate;
  else if(fwdSpd<-.2) car.ang+=steerRate;
  steerAngle+=(steerK*.5-steerAngle)*.15;

  const latV=car.vx*sideX+car.vz*sideZ;
  car.lat=latV/Math.max(1,spd);
  const grip=boosting?2.2:Math.max(2.2,8.5-spd*.1);
  car.vx-=sideX*latV*Math.min(1,grip*dt);
  car.vz-=sideZ*latV*Math.min(1,grip*dt);

  const df=Math.pow(thrK?.97:.90,dt*60);
  car.vx*=df; car.vz*=df;
  car.x+=car.vx*dt; car.z+=car.vz*dt;

  const nr=nearTP(car.x,car.z);
  const off=Math.max(0,nr.d-TW*.95);
  if(off>.05){
    const nd=nr.d||1;
    const dx=(nr.p.x-car.x)/nd,dz=(nr.p.z-car.z)/nd;
    const pen=Math.min(1,off/TW);
    car.vx*=Math.pow(.06,dt*pen); car.vz*=Math.pow(.06,dt*pen);
    car.x+=dx*off*.7; car.z+=dz*off*.7;
  }

  const fwdX2=Math.sin(car.ang),fwdZ2=Math.cos(car.ang);
  const drifting=Math.abs(car.lat)>.2&&spd>8;
  driftAcc=drifting?Math.min(1,driftAcc+dt*2):Math.max(0,driftAcc-dt*1.2);
  if(drifting&&Math.random()<.5) spawnSmoke(car.x,car.z,fwdX2,fwdZ2);
  if(thrK>0&&Math.random()<.3) spawnExhaust(car.x,car.z,fwdX2,fwdZ2);
  if(boosting&&Math.random()<.6) spawnSmoke(car.x,car.z,fwdX2,fwdZ2);

  const idx=nr.i;
  if(cp>TSEGS*.87&&idx<TSEGS*.08){
    lap++;cp=idx;
    if(lap>3){
      running=false;
      document.getElementById('ft').textContent=fmt(elapsed);
      const rec=!best||elapsed<best;
      if(rec){best=elapsed;localStorage.setItem('drift-rc-best',String(best));}
      document.getElementById('fr').textContent=rec?'★ TRACK RECORD ★':'';
      document.getElementById('hb').textContent=fmt(best);
      document.getElementById('fin').style.display='flex';
      loadLeaderboard('lb-finish');
      SB.delete(MY_ID);
      return;
    }
    say(`LAP  ${lap}`,1400);
  }else if(idx>cp) cp=idx;
  elapsed+=dt*1000;
}

/* ── CAMERA ── */
function tickCamera(){
  const fwdX=Math.sin(car.ang),fwdZ=Math.cos(car.ang);
  const spd=Math.hypot(car.vx,car.vz);
  const eyeX=car.x+fwdX*.1-car.lat*.18,eyeZ=car.z+fwdZ*.1;
  const lr=Math.min(1,dt_last*14);
  camPX+=(eyeX-camPX)*lr; camPZ+=(eyeZ-camPZ)*lr;
  camera.position.set(camPX,.72,camPZ);
  camera.lookAt(car.x+fwdX*(4+spd*.12),.35,car.z+fwdZ*(4+spd*.12));
  camera.fov=68+spd*.12; camera.updateProjectionMatrix();
  if(steerMesh) steerMesh.rotation.z=-steerAngle*.8;
  document.getElementById('swneedle')&&(document.getElementById('swneedle').style.transform=`translateX(-50%) rotate(${steerAngle*80}deg)`);
}

/* ── GHOST LABEL PROJECTION ── */
function updateGhostLabels(){
  const W=canvas.parentElement.clientWidth,H=canvas.parentElement.clientHeight;
  Object.entries(ghosts).forEach(([id,{group,nameDiv}])=>{
    const pos=new THREE.Vector3();
    group.getWorldPosition(pos);

  });
}

/* ── SPEEDOMETER ── */
const sc=document.getElementById('sc');
const sCtx=sc.getContext('2d');
function drawSpeedo(kmh){
  const cx=55,cy=60,r=44;
  sCtx.clearRect(0,0,110,110);
  // bg arc
  sCtx.beginPath(); sCtx.arc(cx,cy,r,Math.PI*.75,Math.PI*2.25);
  sCtx.strokeStyle='rgba(255,255,255,.1)'; sCtx.lineWidth=7; sCtx.stroke();
  // fill arc
  const pct=Math.min(1,kmh/280);
  const col=kmh>220?'#ff3300':kmh>160?'#ffaa00':'#ffffff';
  sCtx.beginPath(); sCtx.arc(cx,cy,r,Math.PI*.75,Math.PI*.75+Math.PI*1.5*pct);
  sCtx.strokeStyle=col; sCtx.lineWidth=7; sCtx.stroke();
  // tick marks
  for(let t=0;t<=12;t++){
    const a=Math.PI*.75+Math.PI*1.5*(t/12);
    const ir=r-8,or2=r-3;
    sCtx.beginPath();
    sCtx.moveTo(cx+Math.cos(a)*ir,cy+Math.sin(a)*ir);
    sCtx.lineTo(cx+Math.cos(a)*or2,cy+Math.sin(a)*or2);
    sCtx.strokeStyle='rgba(255,255,255,.3)'; sCtx.lineWidth=1; sCtx.stroke();
  }
  // number
  sCtx.fillStyle='#fff'; sCtx.font='bold 19px ui-monospace,monospace';
  sCtx.textAlign='center'; sCtx.fillText(Math.round(kmh),cx,cy+7);
  sCtx.font='8px ui-monospace,monospace'; sCtx.fillStyle='rgba(255,255,255,.5)';
  sCtx.fillText('km/h',cx,cy+19);
  // RPM-style inner arc (proxy: drift)
  sCtx.beginPath(); sCtx.arc(cx,cy,r-14,Math.PI*.75,Math.PI*.75+Math.PI*1.5*driftAcc);
  sCtx.strokeStyle=`rgba(255,40,0,${.3+driftAcc*.5})`; sCtx.lineWidth=4; sCtx.stroke();
}

/* ── MINIMAP ── */
const mm=document.getElementById('minimap');
const mCtx=mm.getContext('2d');
function drawMinimap(others){
  mCtx.clearRect(0,0,80,80);
  const cx=40,cy=40,scale=0.62;
  // track
  mCtx.strokeStyle='rgba(255,255,255,.25)'; mCtx.lineWidth=5; mCtx.beginPath();
  TPTS.forEach((p,i)=>{
    const sx=cx+p.x*scale,sy=cy+p.z*scale;
    i===0?mCtx.moveTo(sx,sy):mCtx.lineTo(sx,sy);
  });
  mCtx.closePath(); mCtx.stroke();
  // other players
  others.forEach(p=>{
    mCtx.fillStyle='rgba(80,160,255,.9)';
    mCtx.beginPath(); mCtx.arc(cx+p.x*scale,cy+p.z*scale,3.5,0,Math.PI*2); mCtx.fill();
  });
  // self
  mCtx.fillStyle='#ff2200';
  mCtx.beginPath(); mCtx.arc(cx+car.x*scale,cy+car.z*scale,5,0,Math.PI*2); mCtx.fill();
}

/* ── CAR MESH ── */
function tickCarMesh(){
  carGroup.position.set(car.x,0,car.z);
  carGroup.rotation.y=car.ang;
  const fwdX=Math.sin(car.ang),fwdZ=Math.cos(car.ang);

  carWheels.forEach((w,i)=>{

    if(i<2){const tgt=-steerAngle*.5;w.rotation.y+=(tgt-w.rotation.y)*.2;}

/* ── MULTIPLAYER ── */
let netTimer=0;
async function netTick(dt){
  netTimer+=dt;
  if(netTimer<.1) return; // push at ~10Hz
  netTimer=0;
  if(running){
    const nr=nearTP(car.x,car.z);
    await SB.upsert({
      id:MY_ID,name:myName,
      x:Math.round(car.x*10)/10,z:Math.round(car.z*10)/10,
      ang:Math.round(car.ang*100)/100,
      spd:Math.round(Math.hypot(car.vx,car.vz)*10)/10,
      lap,
      updated_at:new Date().toISOString(),
    });
  }
  // fetch all players
  const rows=await SB.select();
  if(!rows) return;
  const activeIds=new Set();
  otherPlayers=[];
  rows.forEach(p=>{
    if(p.id===MY_ID) return;
    activeIds.add(p.id);
    const g=getGhost(p.id);
    updateGhostLabel(p.id,p.name||p.id);
    g.group.position.set(p.x,0,p.z);
    g.group.rotation.y=p.ang;
    const nr=nearTP(p.x,p.z);
    otherPlayers.push({x:p.x,z:p.z,lap:p.lap,prog:nr.i});
  });
  // clean up gone players
  Object.keys(ghosts).forEach(id=>{if(!activeIds.has(id))removeGhost(id);});
  document.getElementById('honline').textContent=rows.length;
}

/* ── LEADERBOARD (best times) ── */
async function loadLeaderboard(targetId){
  // use localStorage bests from all sessions stored under known key pattern
  // We store best times in supabase as part of the drift_players rows — use lap=0 as a convention for records
  const el=document.getElementById(targetId);
  if(!el) return;
  el.innerHTML='<div class="lb-row" style="opacity:.4;font-size:9px">Loading leaderboard...</div>';
  // fetch best times: we store them as separate upserts with lap=0 as a record marker
  const r=await fetch(`${SB_URL}/rest/v1/drift_bests?select=name,time_ms&order=time_ms.asc&limit=5`,{
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
  }).catch(()=>null);
  if(!r||!r.ok){el.innerHTML='';return;}
  const rows=await r.json().catch(()=>[]);
  if(!rows.length){el.innerHTML='';return;}
  el.innerHTML=rows.map((row,i)=>`
    <div class="lb-row">
      <span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':` ${i+1}.`} <b>${row.name||'—'}</b></span>
      <span>${fmt(row.time_ms)}</span>
    </div>`).join('');
}

/* ── BUILD ── */
buildRoad();
buildEnv();
buildCar();
buildCockpit();
resize();

// create drift_bests table (best lap times leaderboard) — attempt silently
fetch(`${SB_URL}/rest/v1/drift_bests?limit=1`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
  .then(r=>{if(r.status===404||r.status===400){/* table doesn't exist yet, skip */}});

// snap camera
{const p0=TPTS[0],t0=tTan(0),ang=Math.atan2(t0.x,t0.z);
 const fx=Math.sin(ang),fz=Math.cos(ang);
 camPX=p0.x;camPZ=p0.z;
 camera.position.set(p0.x,.72,p0.z);
 camera.lookAt(p0.x+fx*5,.35,p0.z+fz*5);}

/* ── LOOP ── */
function loop(now){
  requestAnimationFrame(loop);
  dt_last=Math.min(.05,(now-lt)/1000);
  lt=now;
  if(running){
    tickCar(dt_last);
    tickCarMesh();
    tickCamera();
    tickP(dt_last);
    tickHud();
    netTick(dt_last);
    updateGhostLabels();
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);

/* ── INPUT ── */
addEventListener('keydown',e=>{
  keys.add(e.key.toLowerCase());
  if(e.key.toLowerCase()==='r'&&running)reset();
  e.preventDefault();
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

/* ── UI ── */
document.getElementById('hb').textContent=best?fmt(best):'--:--.---';
document.getElementById('bst').onclick=()=>{
  myName=document.getElementById('pname').value.trim()||'Driver';
  reset();
};
document.getElementById('bag').onclick=()=>{
  myName=document.getElementById('pname').value.trim()||'Driver';
  reset();
};
document.getElementById('bmn').onclick=()=>{
  document.getElementById('fin').style.display='none';
  document.getElementById('st').style.display='flex';
  loadLeaderboard('lb-start');
  SB.delete(MY_ID);
};
loadLeaderboard('lb-start');

// cleanup on tab close
addEventListener('beforeunload',()=>SB.delete(MY_ID));

})();
</script>
