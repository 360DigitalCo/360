<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>360 Drift</title>
<link rel="icon" href="../favicon-32x32.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050810;font-family:monospace}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#game-wrapper{position:relative;width:960px;max-width:100vw;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
#game{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;padding:7px 10px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-family:monospace}
#hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#hud-bot{display:flex;justify-content:space-between;align-items:flex-end}
.pill{background:#111528cc;border:1px solid #ffffff22;border-radius:999px;padding:3px 9px;display:inline-flex;align-items:center;gap:5px;color:#d6e0ff}
.pill b{color:#6af7ff}
.bar{position:relative;width:80px;height:5px;border-radius:999px;background:#ffffff11;overflow:hidden}
.bar-fill{position:absolute;inset:0;width:0%;border-radius:inherit;background:linear-gradient(90deg,#9d7cff,#6af7ff)}
#drift-bar-fill{background:linear-gradient(90deg,#ff6ad5,#ffd23f)}
#nitro-bar-fill{background:linear-gradient(90deg,#6af7ff,#9d7cff)}

/* big center announce */
#announce{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:13px;font-family:monospace;color:#ffd23f;letter-spacing:4px;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:0 0 16px #ffd23f88}
#announce.show{opacity:1}

/* overlays */
.overlay{position:absolute;inset:0;background:#050810ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-family:monospace}
.overlay h1{font-size:20px;color:#6af7ff;letter-spacing:4px}
.overlay h2{font-size:14px;color:#ff6ad5;letter-spacing:3px}
.overlay p{font-size:10px;color:#8892bb;max-width:320px;text-align:center;line-height:1.7}
.btn{background:#0b1530;color:#6af7ff;border:1px solid #6af7ff44;padding:7px 22px;border-radius:4px;cursor:pointer;font-family:monospace;font-size:11px;letter-spacing:1px;pointer-events:auto}
.btn:hover{border-color:#6af7ff;background:#112040}
.btn.primary{border-color:#9d7cff;color:#9d7cff}
.btn.primary:hover{background:#1a1040}
#finish{display:none}
.finish-time{font-size:22px;color:#fff;letter-spacing:2px;margin:4px 0}
.sub-note{font-size:10px;color:#ffd23f}
@media(max-width:700px){#game-wrapper{border-radius:0}#hud{font-size:9px}}
</style>
</head>
<body>
<div id="wrap">
<div id="game-wrapper">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="hud-top">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <div class="pill">LAP <b id="h-lap">1/3</b></div>
        <div class="pill">POS <b id="h-pos">1ST</b></div>
        <div class="pill">SPD <b id="h-spd">0</b> <span style="opacity:.5;font-size:9px">KM/H</span></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <div class="pill">TIME <b id="h-time">00:00.000</b></div>
        <div class="pill" style="flex-direction:column;align-items:flex-start;gap:2px;padding:4px 9px">
          <span style="opacity:.45;font-size:8px;letter-spacing:.1em">NITRO</span>
          <div class="bar"><div class="bar-fill" id="nitro-bar-fill"></div></div>
        </div>
        <div class="pill" style="flex-direction:column;align-items:flex-start;gap:2px;padding:4px 9px">
          <span style="opacity:.45;font-size:8px;letter-spacing:.1em">DRIFT</span>
          <div class="bar"><div class="bar-fill" id="drift-bar-fill"></div></div>
        </div>
      </div>
    </div>
    <div id="hud-bot">
      <div class="pill" style="opacity:.6">WASD / ARROWS · SPACE NITRO · R RESET</div>
      <div class="pill">BEST <b id="h-best">--:--.---</b></div>
    </div>
  </div>
  <div id="announce"></div>
  <div class="overlay" id="start">
    <h1>360 DRIFT</h1>
    <div style="color:#ff6ad5;font-size:9px;letter-spacing:3px">THREE.JS ARCADE RACING</div>
    <p>Hit corners hard. Squeeze nitro on straights. Chain drift angles for bonus time.</p>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn primary" id="btn-start">▶ START RACE</button>
      <button class="btn" id="btn-best">BEST: <span id="start-best">--</span></button>
    </div>
  </div>
  <div class="overlay" id="finish">
    <h2>FINISH LINE</h2>
    <div class="finish-time" id="fin-time">00:00.000</div>
    <div class="sub-note" id="fin-note"></div>
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn primary" id="btn-again">↩ RACE AGAIN</button>
      <button class="btn" id="btn-menu">MENU</button>
    </div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{'use strict';

/* ── pixel canvas resolution ── */
const VW=320,VH=180;

const canvas=document.getElementById('game');
canvas.width=VW; canvas.height=VH;

/* ── Three.js renderer into the pixel canvas ── */
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});
renderer.setSize(VW,VH,false);
renderer.shadowMap.enabled=false;
renderer.setClearColor(0x050810);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x050810,18,55);

const camera=new THREE.PerspectiveCamera(60,VW/VH,0.1,120);

/* ── palette ── */
const C={
  road:0x111c2a,
  roadLine:0x2a3f58,
  curb:0xff6ad5,
  grass:0x0a1508,
  building:0x0c1420,
  buildingWin:0x1e3a55,
  car:0x6af7ff,
  carBody2:0x2a6888,
  wheel:0x0d1a28,
  nitro:0x9d7cff,
  driftSmoke:0xff6ad5,
};

/* ── track definition: list of [x,z] control points for a lemniscate-ish circuit ── */
function buildTrackSpline(){
  // hand-tuned figure-8 style with hairpins and long straights
  const raw=[
    [ 0,   0],
    [ 8,  -4],
    [14,  -10],
    [16,  -17],
    [12,  -23],
    [ 4,  -26],
    [-4,  -26],
    [-12, -23],
    [-16, -17],
    [-14, -10],
    [-8,  -4],
    [ 0,   0],   // crossover
    [ 8,   4],
    [14,  10],
    [16,  17],
    [12,  23],
    [ 4,  26],
    [-4,  26],
    [-12, 23],
    [-16, 17],
    [-14, 10],
    [-8,   4],
    [ 0,   0],
  ];
  const pts=raw.map(([x,z])=>new THREE.Vector2(x,z));
  // CatmullRom through them
  const v3=raw.map(([x,z])=>new THREE.Vector3(x,0,z));
  v3.push(v3[1].clone()); // close properly
  const curve=new THREE.CatmullRomCurve3(v3,true,'catmullrom',0.5);
  return curve;
}

const trackCurve=buildTrackSpline();
const TRACK_SEGS=240;
const TRACK_W=4.2;  // half-width

/* ── sample track points ── */
const trackPts=trackCurve.getPoints(TRACK_SEGS);

/* ── build road mesh ── */
function buildRoad(){
  const shape=new THREE.Shape();
  shape.moveTo(-TRACK_W,0);
  shape.lineTo( TRACK_W,0);

  const extSettings={
    steps:TRACK_SEGS,
    bevelEnabled:false,
    extrudePath:trackCurve,
  };
  // We build road as a ribbon manually for pixel-perfect flat look
  const verts=[],uvs=[],indices=[];
  const N=TRACK_SEGS;
  for(let i=0;i<=N;i++){
    const t=i/N;
    const pt=trackCurve.getPoint(t);
    const tan=trackCurve.getTangent(t);
    const right=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    const L=pt.clone().addScaledVector(right,-TRACK_W);
    const R=pt.clone().addScaledVector(right, TRACK_W);
    verts.push(L.x,0,L.z, R.x,0,R.z);
    uvs.push(0,t, 1,t);
    if(i<N){
      const b=i*2;
      indices.push(b,b+2,b+1, b+1,b+2,b+3);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
  geo.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(uvs),2));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mat=new THREE.MeshLambertMaterial({color:C.road});
  const mesh=new THREE.Mesh(geo,mat);
  scene.add(mesh);

  // curb (outer edge highlight)
  const curbW=0.28;
  [-(TRACK_W),(TRACK_W-curbW)].forEach((ofs,si)=>{
    const cv=[],ci=[];
    for(let i=0;i<=N;i++){
      const t=i/N;
      const pt=trackCurve.getPoint(t);
      const tan=trackCurve.getTangent(t);
      const right=new THREE.Vector3(-tan.z,0,tan.x).normalize();
      const L=pt.clone().addScaledVector(right,ofs);
      const R=pt.clone().addScaledVector(right,ofs+curbW);
      cv.push(L.x,0.01,L.z, R.x,0.01,R.z);
      if(i<N){const b=i*2;ci.push(b,b+2,b+1,b+1,b+2,b+3);}
    }
    const cg=new THREE.BufferGeometry();
    cg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(cv),3));
    cg.setIndex(ci);
    cg.computeVertexNormals();
    // alternate red/white sections
    const segPerStripe=12;
    // simple solid color
    const cm=new THREE.MeshLambertMaterial({color:si===0?0xff4488:0xffffff});
    scene.add(new THREE.Mesh(cg,cm));
  });

  // center dashes
  const dashMat=new THREE.MeshLambertMaterial({color:C.roadLine});
  for(let i=0;i<N;i+=4){
    const t=i/N;
    const pt=trackCurve.getPoint(t);
    const tan=trackCurve.getTangent(t);
    const right=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    const dashGeo=new THREE.PlaneGeometry(0.12,0.8);
    const dashMesh=new THREE.Mesh(dashGeo,dashMat);
    dashMesh.rotation.x=-Math.PI/2;
    dashMesh.position.set(pt.x,0.02,pt.z);
    // orient along track
    const fwd=new THREE.Vector3(tan.x,0,tan.z);
    dashMesh.rotation.z=Math.atan2(fwd.x,fwd.z);
    scene.add(dashMesh);
  }
}

/* ── environment: grass plane + blocky pixel buildings ── */
function buildEnv(){
  // flat grass
  const groundGeo=new THREE.PlaneGeometry(200,200);
  const groundMat=new THREE.MeshLambertMaterial({color:C.grass});
  const ground=new THREE.Mesh(groundGeo,groundMat);
  ground.rotation.x=-Math.PI/2;
  ground.position.y=-0.02;
  scene.add(ground);

  // pixel buildings — simple box clusters along track perimeter
  const rng=mulberry32(0xdeadbeef);
  const bMat=new THREE.MeshLambertMaterial({color:C.building});
  const wMat=new THREE.MeshLambertMaterial({color:C.buildingWin});
  const accents=[0xff6ad5,0x6af7ff,0x9d7cff,0xffd23f];

  for(let i=0;i<60;i++){
    const t=i/60;
    const pt=trackCurve.getPoint(t);
    const tan=trackCurve.getTangent(t);
    const right=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    // place buildings on both sides
    [-1,1].forEach(side=>{
      const dist=TRACK_W+2.5+rng()*4;
      const pos=pt.clone().addScaledVector(right,side*dist);
      const w=1+rng()*2.2;
      const h=1.5+rng()*5;
      const d=1+rng()*2.2;
      const bGeo=new THREE.BoxGeometry(w,h,d);
      const b=new THREE.Mesh(bGeo,bMat);
      b.position.set(pos.x,h/2,pos.z);
      scene.add(b);
      // windows
      const wRows=Math.floor(h/1.1);
      const wCols=Math.max(1,Math.floor(w/.9));
      for(let wr=0;wr<wRows;wr++)for(let wc=0;wc<wCols;wc++){
        if(rng()<.35)continue;
        const wg=new THREE.PlaneGeometry(0.28,0.22);
        const wm=new THREE.Mesh(wg,rng()<.08?new THREE.MeshLambertMaterial({color:accents[Math.floor(rng()*accents.length)],emissive:accents[Math.floor(rng()*accents.length)],emissiveIntensity:.8}):wMat);
        const wx=pos.x+right.z*(d/2+0.01)*side;
        const wz=pos.z-right.x*(d/2+0.01)*side;
        wm.position.set(wx+(wc-(wCols-1)/2)*.65,0.6+wr*1.0,wz);
        wm.lookAt(wm.position.x-right.z*side,wm.position.y,wm.position.z+right.x*side);
        scene.add(wm);
      }
    });
  }
}

/* ── car mesh: chunky pixel-art voxel style ── */
let carMesh,wheelMeshes=[],carBodyMesh;
function buildCar(){
  const group=new THREE.Group();

  // body — wide flat box
  const bodyGeo=new THREE.BoxGeometry(1.4,0.38,2.6);
  const bodyMat=new THREE.MeshLambertMaterial({color:C.car});
  carBodyMesh=new THREE.Mesh(bodyGeo,bodyMat);
  carBodyMesh.position.y=0.32;
  group.add(carBodyMesh);

  // cockpit
  const cabGeo=new THREE.BoxGeometry(0.8,0.3,1.1);
  const cabMat=new THREE.MeshLambertMaterial({color:C.carBody2});
  const cab=new THREE.Mesh(cabGeo,cabMat);
  cab.position.set(0,0.56,-0.1);
  group.add(cab);

  // windshield (bright)
  const wsGeo=new THREE.BoxGeometry(0.75,0.22,0.08);
  const wsMat=new THREE.MeshLambertMaterial({color:0xb7e8ff,emissive:0x4488aa,emissiveIntensity:.5});
  const ws=new THREE.Mesh(wsGeo,wsMat);
  ws.position.set(0,0.56,0.42);
  group.add(ws);

  // rear lights
  const rlGeo=new THREE.BoxGeometry(1.3,0.12,0.08);
  const rlMat=new THREE.MeshLambertMaterial({color:0xff3050,emissive:0xff2040,emissiveIntensity:1.2});
  const rl=new THREE.Mesh(rlGeo,rlMat);
  rl.position.set(0,0.3,-1.3);
  group.add(rl);

  // wheels — cylinders rotated 90°
  const wGeo=new THREE.CylinderGeometry(0.28,0.28,0.22,8);
  const wMat=new THREE.MeshLambertMaterial({color:C.wheel});
  const hubGeo=new THREE.CylinderGeometry(0.12,0.12,0.24,6);
  const hubMat=new THREE.MeshLambertMaterial({color:0x1a3a55});
  const wheelPos=[
    [ 0.78, 0.22,  0.95],
    [-0.78, 0.22,  0.95],
    [ 0.78, 0.22, -0.95],
    [-0.78, 0.22, -0.95],
  ];
  wheelMeshes=[];
  wheelPos.forEach(p=>{
    const wg=new THREE.Group();
    const wm=new THREE.Mesh(wGeo,wMat);
    wm.rotation.z=Math.PI/2;
    wg.add(wm);
    const hub=new THREE.Mesh(hubGeo,hubMat);
    hub.rotation.z=Math.PI/2;
    wg.add(hub);
    wg.position.set(...p);
    group.add(wg);
    wheelMeshes.push(wg);
  });

  scene.add(group);
  carMesh=group;
}

/* ── particle pool ── */
const MAX_PARTICLES=180;
const pGeoBuf=new THREE.BufferGeometry();
const pPositions=new Float32Array(MAX_PARTICLES*3);
const pColors=new Float32Array(MAX_PARTICLES*3);
pGeoBuf.setAttribute('position',new THREE.BufferAttribute(pPositions,3));
pGeoBuf.setAttribute('color',new THREE.BufferAttribute(pColors,3));
const pMat=new THREE.PointsMaterial({size:0.18,vertexColors:true,transparent:true,opacity:.85,sizeAttenuation:true});
const pMesh=new THREE.Points(pGeoBuf,pMat);
scene.add(pMesh);

const particles=[];
function spawnParticle(x,y,z,col,speed){
  if(particles.length>=MAX_PARTICLES)return;
  const a=Math.random()*Math.PI*2;
  particles.push({
    x,y,z,
    vx:(Math.random()-.5)*speed,vy:Math.random()*.8*speed,vz:(Math.random()-.5)*speed,
    life:1,col:new THREE.Color(col),
  });
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    p.vy-=2*dt;
    p.life-=dt*2.2;
    if(p.life<=0||p.y<-0.5)particles.splice(i,1);
  }
  const n=Math.min(particles.length,MAX_PARTICLES);
  for(let i=0;i<n;i++){
    const p=particles[i];
    pPositions[i*3]=p.x;pPositions[i*3+1]=p.y;pPositions[i*3+2]=p.z;
    pColors[i*3]=p.col.r*p.life;pColors[i*3+1]=p.col.g*p.life;pColors[i*3+2]=p.col.b*p.life;
  }
  // zero out unused slots
  for(let i=n;i<MAX_PARTICLES;i++){pPositions[i*3]=0;pPositions[i*3+1]=-999;pPositions[i*3+2]=0;}
  pGeoBuf.attributes.position.needsUpdate=true;
  pGeoBuf.attributes.color.needsUpdate=true;
}

/* ── lights ── */
scene.add(new THREE.AmbientLight(0x1a2444,2.2));
const dirLight=new THREE.DirectionalLight(0x6af7ff,1.4);
dirLight.position.set(5,12,8);
scene.add(dirLight);
const fillLight=new THREE.DirectionalLight(0xff6ad5,0.5);
fillLight.position.set(-8,4,-6);
scene.add(fillLight);

/* ── track nearest-point lookup ── */
function nearestTrackPoint(x,z){
  let bestI=0,bestD=Infinity;
  for(let i=0;i<trackPts.length;i++){
    const p=trackPts[i];
    const d=(p.x-x)*(p.x-x)+(p.z-z)*(p.z-z);
    if(d<bestD){bestD=d;bestI=i;}
  }
  return{p:trackPts[bestI],i:bestI,d:Math.sqrt(bestD)};
}

/* ── car physics state ── */
let car={x:0,y:0,z:0,ang:0,vx:0,vz:0,latSlip:0};
let nitro=100,boost=0,elapsed=0,lap=1,checkpoint=0,running=false,last=0;
let best=Number(localStorage.getItem('360-drift-best')||0);
const keys=new Set();
let driftAccum=0;  // accumulated drift for bar

/* ── util ── */
function mulberry32(seed){
  return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
}
function fmt(ms){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,z=Math.floor(ms%1000);return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(z).padStart(3,'0')}`;}
function announce(txt,dur=1800){const el=document.getElementById('announce');el.textContent=txt;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}

/* ── reset ── */
function reset(){
  // start at track point 0
  const p0=trackCurve.getPoint(0);
  const tan0=trackCurve.getTangent(0);
  car.x=p0.x; car.y=0; car.z=p0.z;
  car.ang=Math.atan2(tan0.x,tan0.z);
  car.vx=0; car.vz=0; car.latSlip=0;
  nitro=100; boost=0; elapsed=0; lap=1; checkpoint=0; driftAccum=0;
  particles.length=0;
  running=true;
  last=performance.now();
  document.getElementById('start').style.display='none';
  document.getElementById('finish').style.display='none';
  announce('LAP 1',1400);
}

/* ── physics update ── */
function updateCar(dt){
  const accel=(keys.has('w')||keys.has('arrowup'))?1:(keys.has('s')||keys.has('arrowdown'))?-0.55:0;
  const steerIn=(keys.has('d')||keys.has('arrowright'))?1:(keys.has('a')||keys.has('arrowleft'))?-1:0;
  const boosting=keys.has(' ')&&nitro>0;

  if(boosting){boost=1;nitro=Math.max(0,nitro-dt*18);}
  else{boost=0;if(nitro<100)nitro=Math.min(100,nitro+dt*7);}

  // world-space speed
  const spd=Math.hypot(car.vx,car.vz);
  const fwdX=Math.sin(car.ang),fwdZ=Math.cos(car.ang);
  const sideX=-fwdZ,sideZ=fwdX;

  // thrust
  const thrust=(4800+(boosting?3200:0))*accel;
  car.vx+=fwdX*thrust*dt;
  car.vz+=fwdZ*thrust*dt;

  // steering — faster at speed, loose at high speed for drift feel
  const spdFactor=Math.min(1,spd/8);
  const grip=Math.max(0.06,1-spd*0.042);
  const turnRate=steerIn*Math.sign((car.vx*fwdX+car.vz*fwdZ)||1)*3.5*spdFactor*dt;
  car.ang+=turnRate;

  // lateral slip
  const latV=car.vx*sideX+car.vz*sideZ;
  car.latSlip=latV/Math.max(1,spd);

  // lateral grip — reduced when boosting for drift
  const latDamp=boosting?1.4:2.8+grip*3.2;
  const lf=Math.min(1,latDamp*dt);
  car.vx-=sideX*latV*lf;
  car.vz-=sideZ*latV*lf;

  // drag + decel when not throttling
  const drag=1.9+spd*0.012;
  const damp=1/(1+drag*dt);
  car.vx*=damp; car.vz*=damp;
  if(accel===0){car.vx*=Math.pow(0.72,dt);car.vz*=Math.pow(0.72,dt);}

  car.x+=car.vx*dt;
  car.z+=car.vz*dt;

  // off-road push back
  const nr=nearestTrackPoint(car.x,car.z);
  const offDist=Math.max(0,nr.d-TRACK_W);
  if(offDist>0.1){
    const toRX=(nr.p.x-car.x)/nr.d, toRZ=(nr.p.z-car.z)/nr.d;
    const pen=offDist/TRACK_W;
    car.vx*=Math.pow(0.04,dt*pen);
    car.vz*=Math.pow(0.04,dt*pen);
    car.x+=toRX*offDist*0.55;
    car.z+=toRZ*offDist*0.55;
  }

  // drift particles
  const isDrifting=Math.abs(car.latSlip)>0.22&&spd>5;
  driftAccum=isDrifting?Math.min(1,driftAccum+dt*1.2):Math.max(0,driftAccum-dt*0.8);
  if(isDrifting&&Math.random()<.5){
    const wx=car.x-fwdX*1.1, wz=car.z-fwdZ*1.1;
    spawnParticle(wx,0.05,wz,boosting?0x9d7cff:0xff6ad5,1.8);
    if(Math.random()<.4)spawnParticle(wx+sideX*.7,0.05,wz+sideZ*.7,0x6af7ff,1.2);
  }
  if(boosting&&Math.random()<.6)spawnParticle(car.x-fwdX*1.4,0.15,car.z-fwdZ*1.4,0x9d7cff,2.5);

  // lap counting
  const idx=nr.i;
  const lapFrac=TRACK_SEGS*.88;
  if(checkpoint>lapFrac&&idx<TRACK_SEGS*.08){
    lap++;checkpoint=idx;
    if(lap>3){
      running=false;
      const finalMs=elapsed;
      document.getElementById('fin-time').textContent=fmt(finalMs);
      const isRecord=!best||finalMs<best;
      if(isRecord){best=finalMs;localStorage.setItem('360-drift-best',String(best));}
      document.getElementById('fin-note').textContent=isRecord?'NEW TRACK RECORD 🏆':'';
      document.getElementById('h-best').textContent=best?fmt(best):'--';
      document.getElementById('finish').style.display='flex';
      return;
    }
    announce(`LAP ${lap}`,1400);
  }else if(idx>checkpoint)checkpoint=idx;

  elapsed+=dt*1000;
}

/* ── mesh update ── */
function updateCarMesh(){
  carMesh.position.set(car.x,0,car.z);

  // smooth heading
  carMesh.rotation.y=car.ang;

  // body roll with drift
  if(carBodyMesh)carBodyMesh.rotation.z=car.latSlip*.22;

  // wheel spin
  const spd=Math.hypot(car.vx,car.vz);
  const fwdX=Math.sin(car.ang),fwdZ=Math.cos(car.ang);
  const fwdSpd=car.vx*fwdX+car.vz*fwdZ;
  wheelMeshes.forEach((w,i)=>{
    w.rotation.x-=fwdSpd*0.6;
    // front wheels steer
    if(i<2){
      const steer=(keys.has('d')||keys.has('arrowright'))?0.4:(keys.has('a')||keys.has('arrowleft'))?-0.4:0;
      w.rotation.y=steer;
    }
  });
}

/* ── camera ── */
let camYaw=0, camPitch=0;
function updateCamera(){
  // chase cam — follows behind and above car, drifts with latSlip
  const fwdX=Math.sin(car.ang),fwdZ=Math.cos(car.ang);
  const spd=Math.hypot(car.vx,car.vz);
  const camDist=5.5+spd*0.04;
  const camH=2.2+spd*0.02;
  const driftShift=car.latSlip*1.4;

  const tx=car.x-fwdX*camDist+Math.cos(car.ang)*driftShift;
  const tz=car.z-fwdZ*camDist+Math.sin(-car.ang)*driftShift;

  camera.position.x+=(tx-camera.position.x)*0.12;
  camera.position.y+=(camH-camera.position.y)*0.10;
  camera.position.z+=(tz-camera.position.z)*0.12;

  const lookX=car.x+fwdX*2;
  const lookZ=car.z+fwdZ*2;
  camera.lookAt(lookX,0.3,lookZ);
}

/* ── HUD update ── */
function updateHud(){
  document.getElementById('h-lap').textContent=`${Math.min(lap,3)}/3`;
  document.getElementById('h-spd').textContent=Math.round(Math.hypot(car.vx,car.vz)*22);
  document.getElementById('h-time').textContent=fmt(elapsed);
  document.getElementById('nitro-bar-fill').style.width=nitro+'%';
  document.getElementById('drift-bar-fill').style.width=(driftAccum*100)+'%';
  document.getElementById('h-best').textContent=best?fmt(best):'--';
}

/* ── init scene ── */
buildRoad();
buildEnv();
buildCar();

// place car at track start initially
{const p0=trackCurve.getPoint(0);carMesh.position.set(p0.x,0,p0.z);}

/* ── main loop ── */
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.033,(now-last)/1000);
  last=now;
  if(running){
    updateCar(dt);
    updateCarMesh();
    updateCamera();
    updateParticles(dt);
    updateHud();
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);

/* ── inputs ── */
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key==='r'&&running)reset();e.preventDefault();});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

/* ── start screen ── */
document.getElementById('start-best').textContent=best?fmt(best):'--';
document.getElementById('btn-start').onclick=reset;
document.getElementById('btn-again').onclick=reset;
document.getElementById('btn-menu').onclick=()=>{document.getElementById('finish').style.display='none';document.getElementById('start').style.display='flex';};

})();
</script>
