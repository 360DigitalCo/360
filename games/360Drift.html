<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>360 Drift</title>
<link rel="icon" href="../favicon-32x32.png">
<style>
:root{--bg:#07090d;--panel:#10141d;--line:#273040;--text:#f4f7fb;--muted:#8691a4;--accent:#58b7ff;--accent2:#9d7cff;--danger:#ff5964}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}#wrap{position:relative;width:100vw;height:100vh}canvas{display:block;width:100%;height:100%;background:#0b1017}.hud{position:absolute;inset:18px 18px auto;display:flex;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.card{background:#0c1119d9;border:1px solid #ffffff18;backdrop-filter:blur(12px);border-radius:14px;padding:10px 14px;min-width:100px;box-shadow:0 10px 30px #0008}.k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.v{font-weight:800;font-size:18px;margin-top:2px}.bar{height:6px;background:#ffffff13;border-radius:999px;overflow:hidden;margin-top:8px;width:150px}.bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#05070bd9;backdrop-filter:blur(8px)}.panel{width:min(620px,92vw);padding:34px;border:1px solid #ffffff18;background:#0d1119ee;border-radius:22px;box-shadow:0 30px 100px #000b}.eyebrow{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.18em}.title{font-size:clamp(44px,8vw,82px);line-height:.9;margin:10px 0 16px;font-weight:900;letter-spacing:-.055em}.sub{color:#aeb8c8;line-height:1.6;max-width:560px}.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}button{border:1px solid #ffffff22;background:#ffffff08;color:#fff;border-radius:11px;padding:11px 17px;font-weight:800;cursor:pointer}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#081019;border:0}.help{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#0c1119cc;border:1px solid #ffffff16;padding:8px 12px;border-radius:999px;color:#aab4c3;font-size:12px;white-space:nowrap}.finish{color:#dfe7f3;font-size:14px;line-height:1.5}.finish strong{font-size:30px;color:#fff;display:block;margin-top:3px}@media(max-width:700px){.hud{inset:10px}.card{min-width:0;padding:8px 10px}.help{bottom:10px;font-size:10px}.panel{padding:24px}}
</style>
</head><body><div id="wrap"><canvas id="game"></canvas><div class="hud"><div class="cluster"><div class="card"><div class="k">Lap</div><div class="v" id="lap">1 / 3</div></div><div class="card"><div class="k">Position</div><div class="v" id="pos">1st</div></div><div class="card"><div class="k">Speed</div><div class="v" id="speed">0 km/h</div></div></div><div class="cluster"><div class="card"><div class="k">Time</div><div class="v" id="time">00:00.000</div></div><div class="card"><div class="k">Nitro</div><div class="bar"><i id="nitro"></i></div></div></div></div><div class="help">WASD / arrows drive · Space nitro · R reset</div><div class="overlay" id="start"><div class="panel"><div class="eyebrow">360 Games · Arcade Racing</div><div class="title">360 DRIFT</div><div class="sub">Thread a neon circuit at speed. Brake into corners, hold a drift, and bank clean exits for a faster lap.</div><div class="actions"><button class="primary" id="play">START RACE</button><button id="bestBtn">BEST: <span id="best">—</span></button></div></div></div><div class="overlay" id="finish" style="display:none"><div class="panel"><div class="eyebrow">Race complete</div><div class="title" style="font-size:clamp(42px,7vw,66px)">CLEAN RUN.</div><div class="finish">Final time<strong id="final">00:00.000</strong><span id="record"></span></div><div class="actions"><button class="primary" id="again">RACE AGAIN</button><button id="menu">MENU</button></div></div></div></div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),lapEl=document.getElementById('lap'),posEl=document.getElementById('pos'),spdEl=document.getElementById('speed'),timeEl=document.getElementById('time'),nitroEl=document.getElementById('nitro'),start=document.getElementById('start'),finish=document.getElementById('finish'),bestEl=document.getElementById('best'),finalEl=document.getElementById('final'),record=document.getElementById('record');let W=0,H=0,dpr=1,running=false,last=0,elapsed=0,lap=1,best=Number(localStorage.getItem('360-drift-best')||0),keys=new Set(),car,t=0,nitro=100,boost=0,checkpoint=0;
const track=[];for(let i=0;i<120;i++){const a=i/120*Math.PI*2;track.push({x:Math.cos(a)*0.34,y:Math.sin(a)*0.27});}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){t=0;elapsed=0;lap=1;checkpoint=0;nitro=100;boost=0;car={px:.34,py:0,ang:Math.PI/2,vx:0,vy:0,drift:0};last=performance.now();running=true;start.style.display='none';finish.style.display='none';requestAnimationFrame(loop)}
function fmt(ms){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,z=Math.floor(ms%1000);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(z).padStart(3,'0')}`}
function roadPoint(tt){const a=((tt%1)+1)%1*Math.PI*2;return{x:Math.cos(a)*.34,y:Math.sin(a)*.27}}
function nearestRoad(px,py){let bestI=0,bestD=Infinity;for(let i=0;i<track.length;i++){const p=track[i],dx=px-p.x,dy=py-p.y,d=dx*dx+dy*dy;if(d<bestD){bestD=d;bestI=i}}return{p:track[bestI],i:bestI,d:Math.sqrt(bestD)}}
function draw(){const sx=Math.min(W/1.65,H/1.45);x.fillStyle='#0a0f16';x.fillRect(0,0,W,H);x.save();x.translate(W/2,H/2);x.scale(sx,sx);x.lineJoin='round';x.lineCap='round';x.beginPath();track.forEach((p,i)=>{const X=p.x,Y=p.y;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.closePath();x.lineWidth=.145;x.strokeStyle='#030508';x.stroke();x.lineWidth=.115;x.strokeStyle='#2d3542';x.stroke();x.lineWidth=.007;x.strokeStyle='#e7edf533';x.setLineDash([.025,.03]);x.stroke();x.setLineDash([]);x.beginPath();track.forEach((p,i)=>{const X=p.x,Y=p.y;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.closePath();x.lineWidth=.004;x.strokeStyle='#58b7ff44';x.stroke();
// scenery
for(let i=0;i<42;i++){const p=roadPoint(i/42+.03),r=.03+.015*Math.sin(i*3);x.fillStyle=i%2?'#13202b':'#172433';x.beginPath();x.arc(p.x*1.17,p.y*1.17,r,0,Math.PI*2);x.fill()}
const np=nearestRoad(car.px,car.py);const ang=Math.atan2(np.p.y-car.py,np.p.x-car.px);x.save();x.translate(car.px,car.py);x.rotate(car.ang);x.shadowBlur=.03; x.shadowColor='#58b7ff';x.fillStyle='#58b7ff';x.beginPath();x.roundRect(-.035,-.018,.07,.036,.008);x.fill();x.fillStyle='#b7e3ff';x.fillRect(.005,-.01,.018,.02);x.restore();x.restore()}
function update(dt){const s=nearestRoad(car.px,car.py);let throttle=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0);let steer=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);if(keys.has(' ')&&nitro>0){boost=1;nitro=Math.max(0,nitro-dt*28)}else boost=0;if(!keys.has(' ')&&nitro<100)nitro=Math.min(100,nitro+dt*6);const max=.36+boost*.17;car.vx+=Math.cos(car.ang)*throttle*dt*(.55+boost*.4);car.vy+=Math.sin(car.ang)*throttle*dt*(.55+boost*.4);const speed=Math.hypot(car.vx,car.vy);const turn=(.75+Math.min(speed/max,1))*steer*dt*2.6;car.ang+=turn;const forward=car.vx*Math.cos(car.ang)+car.vy*Math.sin(car.ang);const side=-car.vx*Math.sin(car.ang)+car.vy*Math.cos(car.ang);car.vx=Math.cos(car.ang)*forward+(-Math.sin(car.ang)*side*.82);car.vy=Math.sin(car.ang)*forward+(Math.cos(car.ang)*side*.82);car.vx*=Math.pow(.14,dt);car.vy*=Math.pow(.14,dt);if(throttle===0){car.vx*=Math.pow(.3,dt);car.vy*=Math.pow(.3,dt)}car.px+=car.vx*dt;car.py+=car.vy*dt;const onRoad=s.d<.065;if(!onRoad){car.vx*=Math.pow(.01,dt);car.vy*=Math.pow(.01,dt);car.px+=(s.p.x-car.px)*dt*1.7;car.py+=(s.p.y-car.py)*dt*1.7}const n=nearestRoad(car.px,car.py);const idx=n.i; if(checkpoint>105&&idx<12){lap++;checkpoint=idx;if(lap>3){running=false;const final=elapsed;finalEl.textContent=fmt(final);if(!best||final<best){best=final;localStorage.setItem('360-drift-best',String(best));record.textContent=' New track record.'}else record.textContent='';finish.style.display='grid';}}else checkpoint=idx>checkpoint?idx:checkpoint;elapsed+=dt*1000;lapEl.textContent=`${Math.min(lap,3)} / 3`;spdEl.textContent=`${Math.round(Math.hypot(car.vx,car.vy)*460)} km/h`;nitroEl.style.width=`${nitro}%`;timeEl.textContent=fmt(elapsed);posEl.textContent='1st'}
function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key==='r'){reset()}e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.getElementById('play').onclick=reset;document.getElementById('again').onclick=reset;document.getElementById('menu').onclick=()=>{finish.style.display='none';start.style.display='grid'};bestEl.textContent=best?fmt(best):'—';})();
</script></body></html>
