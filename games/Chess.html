<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#312e2b;--panel:#262522;--btn:#3d3a37;--ink:#e8e6e3;--mute:#a09d99;--lt:#eeeed2;--dk:#769656;--green:#81b64c;--w:#fffdf6;--b:#1d1a18;--s:min(calc(94vw - 30px),calc(100vh - 170px),600px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;padding:14px 8px}
.wrap{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.left{display:flex;flex-direction:column;gap:6px;width:calc(var(--s) + 28px)}
.bw{display:flex;gap:8px}
#evb{width:20px;height:var(--s);background:#403d39;border-radius:4px;position:relative;overflow:hidden;flex:none}
#evw{position:absolute;left:0;right:0;background:#f4f4f4;transition:height .4s}
#evt{position:absolute;left:0;right:0;text-align:center;font:700 10px/1 'Segoe UI',Arial,sans-serif}
.side{width:min(94vw,320px);background:var(--panel);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
#status{font-size:18px;font-weight:600;min-height:24px}
#board{width:var(--s);height:var(--s);display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:4px solid #000;border-radius:5px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.sq{position:relative;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.lt{background:var(--lt)}.dk{background:var(--dk)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(255,255,51,.42)}
.sq.hint{box-shadow:inset 0 0 0 100px rgba(40,130,220,.5)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(255,255,51,.6)}
.sq.chk{box-shadow:inset 0 0 0 100px rgba(235,60,50,.65)}
.sq.mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.15)}
.sq.cap::after{content:"";position:absolute;inset:0;border-radius:50%;border:7px solid rgba(0,0,0,.15)}
.co{position:absolute;font:700 clamp(9px,1.9vw,13px) "Segoe UI",Arial,sans-serif;font-style:normal;pointer-events:none}
.lt .co{color:var(--dk)}.dk .co{color:var(--lt)}
.pc{display:block;white-space:nowrap;font-size:calc(var(--s)/8*.8);line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
.pc,.cp{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols",serif}
.pc.w,.cp.w{color:var(--w);text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000}
.pc.b,.cp.b{color:var(--b);text-shadow:0 0 1px rgba(255,255,255,.45)}
.cp{font-size:20px;line-height:1}
.pl{display:flex;align-items:center;gap:10px;min-height:44px;padding-left:28px}
.pl b{font-size:15px;display:block}
.av{width:40px;height:40px;border-radius:4px;background:var(--btn);display:flex;align-items:center;justify-content:center;flex:none}
.av .cp{font-size:30px}
.cr{min-height:22px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cr em{font-style:normal;font-weight:700;font-size:13px;color:var(--mute)}
#promo{display:flex;align-items:center;gap:8px;background:var(--panel);padding:6px 10px;border-radius:6px}
#promo[hidden]{display:none}
#promo::before{content:"Promote to:"}
#promo .cp{font-size:34px}
#mv{background:var(--bg);border-radius:6px;padding:10px;font-size:15px;line-height:1.7;min-height:120px;max-height:300px;overflow-y:auto}
#mv b{color:var(--mute);font-weight:600;margin-left:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,select{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:6px;border:0;border-bottom:3px solid rgba(0,0,0,.35);background:var(--btn);color:var(--ink);cursor:pointer}
button:hover{filter:brightness(1.15)}
#nw{background:var(--green);color:#fff;border-bottom-color:#45753c}
select{flex:1;min-width:0;border-bottom-width:0;padding:9px 10px}
button:focus-visible,select:focus-visible{outline:3px solid var(--green)}
#dev{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--btn);padding-top:12px}
#dev[hidden]{display:none}
#dev input{background:var(--bg);color:var(--ink);border:1px solid var(--btn);border-radius:6px;padding:7px;font:12px ui-monospace,Consolas,monospace}
#rin{width:110px;background:var(--bg);color:var(--ink);border:1px solid var(--btn);border-radius:6px;padding:7px;font:inherit}
.row[hidden]{display:none}
#quip{font-style:italic;color:#9be37a;font-size:15px;line-height:1.4;background:var(--bg);border-radius:6px;padding:8px 10px}
#quip[hidden]{display:none}
#nj{width:84px;text-transform:uppercase;background:var(--bg);color:var(--ink);border:1px solid var(--btn);border-radius:6px;padding:7px;font:inherit}
#ni{font-size:13px;color:var(--mute);min-height:18px}
button[hidden]{display:none}
button:disabled,input:disabled{opacity:.5;cursor:default}
#fen{width:100%}#pd{width:60px}
#dev pre{margin:0;font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--mute);white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:8px;border-radius:6px;max-height:200px;overflow-y:auto}
</style></head><body>
<div class="wrap">
<div class="left">
<div id="promo" hidden></div>
<div class="pl"><div class="av" id="avt"></div><div><b id="nt"></b><div class="cr" id="ct"></div></div></div>
<div class="bw"><div id="evb" title="Evaluation"><div id="evw"></div><span id="evt"></span></div><div id="board"></div></div>
<div class="pl"><div class="av" id="avb"></div><div><b id="nb"></b><div class="cr" id="cb"></div></div></div>
</div>
<div class="side">
<div id="status"></div>
<div id="quip" hidden></div>
<div id="mv" aria-label="Moves"></div>
<div class="row"><button id="nw">New game</button><button id="un">Undo</button><button id="hn">Hint</button><button id="fl">Flip</button><button id="rs">Resign</button><button id="cp">Copy moves</button><button id="sn">Sound: on</button></div>
<div class="row"><select id="mode" aria-label="Mode"><option value="ai">vs computer</option><option value="2p">Two players</option></select>
<select id="side" aria-label="Your color"><option value="w">Play White</option><option value="b">Play Black</option></select>
<select id="lvl" aria-label="Strength"></select></div>
<div class="row"><select id="sty" aria-label="Play like"></select></div>
<div class="row"><button id="nc" disabled>Create online game</button><input id="nj" maxlength="5" placeholder="Code" aria-label="Game code" disabled><button id="nl" disabled>Join</button><button id="nx" hidden>Leave</button></div>
<div id="ni"></div>
<div id="dev" hidden>
<input id="fen" spellcheck="false" aria-label="FEN">
<div class="row"><button id="lf">Load FEN</button><button id="cf">Copy FEN</button><button id="pf">Perft</button><input id="pd" type="number" min="1" max="4" value="3" aria-label="Perft depth"></div>
<div class="row"><button id="fa">Force AI move</button><button id="rm">Random move</button><button id="cj">Copy state JSON</button><button id="rr">Reset rating</button><button id="wn">Win game</button><button id="au">Auto-play: off</button><button id="al">Alien: off</button></div>
<div class="row"><input id="rin" type="number" min="100" max="1000000" step="1" aria-label="Your rating"><button id="rok">Set rating</button></div>
<pre id="di"></pre><pre id="dg"></pre></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const G={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'},V={P:100,N:320,B:330,R:500,Q:900,K:0};
const col=p=>p===p.toUpperCase()?'w':'b',opp=t=>t==='w'?'b':'w';
const D=[[0,1],[0,-1],[1,0],[-1,0]],Dg=[[1,1],[1,-1],[-1,1],[-1,-1]],N=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
function att(bd,sq,by){const r=sq>>3,c=sq&7;
 const at=(a,b)=>a>=0&&a<8&&b>=0&&b<8?bd[a*8+b]:'';
 const m=(p,t)=>p&&col(p)===by&&p.toUpperCase()===t;
 for(const[a,b]of N)if(m(at(r+a,c+b),'N'))return 1;
 for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if((a||b)&&m(at(r+a,c+b),'K'))return 1;
 const pr=by==='w'?r+1:r-1;
 if(m(at(pr,c-1),'P')||m(at(pr,c+1),'P'))return 1;
 for(const[a,b,ts]of[...D.map(d=>[...d,'RQ']),...Dg.map(d=>[...d,'BQ'])]){let rr=r+a,cc=c+b;
  while(rr>=0&&rr<8&&cc>=0&&cc<8){const p=bd[rr*8+cc];if(p){if(col(p)===by&&ts.includes(p.toUpperCase()))return 1;break}rr+=a;cc+=b}}
 return 0}
function gen(bd,side,cr,ep){const out=[],o=opp(side);
 for(let i=0;i<64;i++){const p=bd[i];if(!p||col(p)!==side)continue;const t=p.toUpperCase(),r=i>>3,c=i&7;
  const add=(to,x={})=>out.push({f:i,t:to,...x});
  if(t==='P'){const d=side==='w'?-1:1,st=side==='w'?6:1,pr=side==='w'?0:7;
   const push=(to,x)=>{if((to>>3)===pr)for(const q of'QRBN')add(to,{pr:q,...x});else add(to,x)};
   const r1=r+d;
   if(r1>=0&&r1<8){if(!bd[r1*8+c]){push(r1*8+c);if(r===st&&!bd[(r+2*d)*8+c])add((r+2*d)*8+c,{dp:1})}
    for(const dc of[-1,1]){const cc=c+dc;if(cc<0||cc>7)continue;const to=r1*8+cc;
     if(bd[to]&&col(bd[to])!==side)push(to);else if(to===ep)add(to,{ep:1})}}}
  else if(t==='N'||t==='K'){const L=t==='N'?N:[...D,...Dg];
   for(const[a,b]of L){const rr=r+a,cc=c+b;if(rr<0||rr>7||cc<0||cc>7)continue;const to=rr*8+cc;if(!bd[to]||col(bd[to])!==side)add(to)}
   if(t==='K'){const h=side==='w'?7:0;
    if(i===h*8+4&&!att(bd,i,o)){
     if(cr[side==='w'?'K':'k']&&!bd[h*8+5]&&!bd[h*8+6]&&bd[h*8+7]&&!att(bd,h*8+5,o)&&!att(bd,h*8+6,o))add(h*8+6,{cs:1});
     if(cr[side==='w'?'Q':'q']&&!bd[h*8+3]&&!bd[h*8+2]&&!bd[h*8+1]&&bd[h*8]&&!att(bd,h*8+3,o)&&!att(bd,h*8+2,o))add(h*8+2,{cs:2})}}}
  else{const L=t==='R'?D:t==='B'?Dg:[...D,...Dg];
   for(const[a,b]of L){let rr=r+a,cc=c+b;while(rr>=0&&rr<8&&cc>=0&&cc<8){const to=rr*8+cc;
    if(!bd[to])add(to);else{if(col(bd[to])!==side)add(to);break}rr+=a;cc+=b}}}}
 return out}
function ap(bd,m){const n=bd.slice(),p=n[m.f];n[m.t]=m.pr?(col(p)==='w'?m.pr:m.pr.toLowerCase()):p;n[m.f]='';
 if(m.ep)n[m.t+(col(p)==='w'?8:-8)]='';
 if(m.cs===1){n[m.t-1]=n[m.t+1];n[m.t+1]=''}
 if(m.cs===2){n[m.t+1]=n[m.t-2];n[m.t-2]=''}
 return n}
const kingIn=s=>att(s.b,s.b.indexOf(s.t==='w'?'K':'k'),opp(s.t));
function lg(s){return gen(s.b,s.t,s.cr,s.ep).filter(m=>{const n=ap(s.b,m);return!att(n,n.indexOf(s.t==='w'?'K':'k'),opp(s.t))})}
function nx(s,m){const p=s.b[m.f],cr={...s.cr};
 if(p.toUpperCase()==='K'){if(s.t==='w')cr.K=cr.Q=0;else cr.k=cr.q=0}
 for(const q of[m.f,m.t]){if(q===0)cr.q=0;if(q===7)cr.k=0;if(q===56)cr.Q=0;if(q===63)cr.K=0}
 const rs=p.toUpperCase()==='P'||s.b[m.t]||m.ep;
 return{b:ap(s.b,m),t:opp(s.t),cr,ep:m.dp?(m.f+m.t)/2:-1,hm:rs?0:s.hm+1,fm:s.fm+(s.t==='b'?1:0)}}
function ev(bd){let s=0;const wk=bd.indexOf('K'),bk=bd.indexOf('k');for(let i=0;i<64;i++){const p=bd[i];if(!p)continue;const t=p.toUpperCase(),w=col(p)==='w',r=i>>3,c=i&7;
 let v=V[t];const cen=(3.5-Math.abs(c-3.5))+(3.5-Math.abs(r-3.5));
 if(t==='N'||t==='B')v+=cen*6*STY.c;else if(t==='P')v+=((w?6-r:r-1)*5+cen*2)*STY.p;
 else if(t==='K'){const ar=w?r-1:r+1;let sh=0;if(ar>=0&&ar<8)for(let x=c-1;x<=c+1;x++)if(x>=0&&x<8&&bd[ar*8+x]===(w?'P':'p'))sh++;v+=(sh*12+((w?r===7:r===0)?10:0))*STY.k}
 if(t!=='K'&&t!=='P'){const ek=w?bk:wk;v+=(7-Math.max(Math.abs(r-(ek>>3)),Math.abs(c-(ek&7))))*3*STY.a}
 s+=w?v:-v}return XE?s+xe(bd):s}
function srch(s,d,a,b){nodes++;const ms=lg(s);
 if(!ms.length)return kingIn(s)?(s.t==='w'?-1e5-d:1e5+d):0;
 if(!d)return ev(s.b);
 ms.sort((x,y)=>(s.b[y.t]?V[s.b[y.t].toUpperCase()]:0)-(s.b[x.t]?V[s.b[x.t].toUpperCase()]:0));
 if(s.t==='w'){let best=-1e9;for(const m of ms){best=Math.max(best,srch(nx(s,m),d-1,a,b));a=Math.max(a,best);if(a>=b)break}return best}
 let best=1e9;for(const m of ms){best=Math.min(best,srch(nx(s,m),d-1,a,b));b=Math.min(b,best);if(a>=b)break}return best}
let nodes=0,stat=null;function san(s,m){const p=s.b[m.f],t=p.toUpperCase(),sq=i=>'abcdefgh'[i&7]+(8-(i>>3));let x;
 if(m.cs)x=m.cs===1?'O-O':'O-O-O';
 else{const cap=s.b[m.t]||m.ep;x=t==='P'?(cap?sq(m.f)[0]+'x':''):t;
  if(t!=='P'){const o=lg(s).filter(q=>q!==m&&q.t===m.t&&s.b[q.f]===p);
   if(o.length)x+=o.some(q=>(q.f&7)===(m.f&7))?(o.some(q=>(q.f>>3)===(m.f>>3))?sq(m.f):sq(m.f)[1]):sq(m.f)[0];
   if(cap)x+='x'}
  x+=sq(m.t)+(m.pr?'='+m.pr:'')}
 const n=nx(s,m);return x+(kingIn(n)?(lg(n).length?'+':'#'):'')}
let S,hist,sans,sel,moves,last,over,busy,hint,res,fl=false,snd=1;
const ai=()=>$('mode').value==='ai',H=()=>$('side').value;
const aiTurn=()=>ai()&&S.t!==H()&&!over;
const flipped=()=>((ai()&&H()==='b')||(net&&net.color==='b'))!==fl;
const key=s=>s.b.map(x=>x||'.').join('')+s.t+Object.values(s.cr).join('')+s.ep;
function init(){const bk='RNBQKBNR',b=Array(64).fill('');
 for(let i=0;i<8;i++){b[i]=bk[i].toLowerCase();b[8+i]='p';b[48+i]='P';b[56+i]=bk[i]}
 S={b,t:'w',cr:{K:1,Q:1,k:1,q:1},ep:-1,hm:0,fm:1};hist=[];sans=[];ucis=[];sel=null;last=null;hint=null;res='';rw=false;over=false;busy=false;fl=false;tainted=false;rv=null;
 $('promo').hidden=true;update();maybeAI()}
function maybeAI(){if(aiTurn()&&!busy){busy=true;$('status').textContent=botName()+' is thinking…';setTimeout(aiMove,250)}
 else if(auto&&ai()&&!over&&!busy&&S.t===H()){busy=true;$('status').textContent='Auto-pilot is thinking…';setTimeout(autoMove,400)}}
function update(){moves=lg(S);const chk=kingIn(S);over=!moves.length;let msg;
 if(res){over=true;msg=res}
 else if(over)msg=chk?`Checkmate — ${S.t==='w'?'Black':'White'} wins`:'Stalemate — draw';
 else{const ps=S.b.filter(x=>x&&x.toUpperCase()!=='K');
  const dr=S.hm>=100?'50-move rule':hist.concat(S).filter(x=>key(x)===key(S)).length>=3?'threefold repetition':(!ps.length||(ps.length===1&&/[nb]/i.test(ps[0])))?'insufficient material':'';
  if(dr){over=true;msg='Draw — '+dr}else msg=`${S.t==='w'?'White':'Black'} to move${chk?' — check!':''}`}
 const sc=!over?null:res?(rw?1:0):!moves.length&&chk?(S.t===H()?0:1):.5;$('status').textContent=(net?`Game ${net.code} · `:'')+msg+rate(sc);
 let h='';sans.forEach((s,i)=>{h+=(i%2?'':`<b>${i/2+1}.</b> `)+s+' '});$('mv').innerHTML=h;$('mv').scrollTop=1e5;
 evv=calcEval();draw(chk);devInfo()}
function draw(chk){const el=$('board');el.innerHTML='';const fp=flipped();
 for(let k=0;k<64;k++){const i=fp?63-k:k,r=i>>3,c=i&7,p=S.b[i],d=document.createElement('div');
  d.className='sq '+((r+c)%2?'dk':'lt');
  if(last&&(last.f===i||last.t===i))d.classList.add('last');
  if(hint&&(hint.f===i||hint.t===i))d.classList.add('hint');
  if(sel===i)d.classList.add('sel');
  if(chk&&p&&p.toUpperCase()==='K'&&col(p)===S.t)d.classList.add('chk');
  if(sel!==null&&moves.some(m=>m.f===sel&&m.t===i))d.classList.add(p?'cap':'mv');
  if(p){const sp=document.createElement('span');sp.className='pc '+col(p);sp.textContent=G[p.toUpperCase()]+'\uFE0E';d.append(sp)}
  if((k>>3)===7){const e=document.createElement('i');e.className='co';e.style.cssText='right:3px;bottom:1px';e.textContent='abcdefgh'[c];d.append(e)}
  if((k&7)===0){const e=document.createElement('i');e.className='co';e.style.cssText='left:3px;top:1px';e.textContent=8-r;d.append(e)}
  d.onclick=()=>click(i);el.append(d)}
 el.querySelectorAll('.pc').forEach(ctr);capt();showBar()}
const cx=document.createElement('canvas').getContext('2d');
function ctr(sp){const cs=getComputedStyle(sp),px=parseFloat(cs.fontSize);cx.font=cs.fontSize+' '+cs.fontFamily;
 const m=cx.measureText(sp.textContent),fa=m.fontBoundingBoxAscent,fd=m.fontBoundingBoxDescent;
 const base=(px-(fa+fd))/2+fa,cy=base-(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;
 const dy=px/2-cy,dx=m.width/2-(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2;
 if(isFinite(dx)&&isFinite(dy))sp.style.transform=`translate(${dx}px,${dy}px)`}
window.onresize=()=>draw(kingIn(S));
function capt(){const n={},I={P:8,N:2,B:2,R:2,Q:1},L={w:'',b:''};let m=0;
 for(const p of S.b)if(p){n[p]=(n[p]||0)+1;m+=col(p)==='w'?V[p.toUpperCase()]:-V[p.toUpperCase()]}
 for(const t of'QRBNP')for(const c of'wb'){const x=I[t]-(n[c==='w'?t:t.toLowerCase()]||0);
  if(x>0)L[c]+=`<span class="cp ${c}">${(G[t]+'\uFE0E').repeat(x)}</span>`}
 const bc=flipped()?'b':'w',tc=opp(bc),a=m?`<em>+${Math.max(1,Math.round(Math.abs(m)/100))}</em>`:'';
 $('cb').innerHTML=L[tc]+((bc==='w')===(m>0)?a:'');$('ct').innerHTML=L[bc]+((bc==='w')===(m<0)?a:'');
 const nm=c=>net?(c===net.color?'You':(net.color?'Opponent':(c==='w'?'White':'Black'))+(net.opp?' ● online':' ○ offline')):ai()?(c===H()?'You ('+R+')':botLabel()):(c==='w'?'White':'Black');
 $('nt').textContent=nm(tc);$('nb').textContent=nm(bc);
 $('avt').innerHTML=`<span class="cp ${tc}">♚\uFE0E</span>`;$('avb').innerHTML=`<span class="cp ${bc}">♚\uFE0E</span>`}
function beep(cap){if(!snd)return;try{const a=beep.c||(beep.c=new AudioContext()),o=a.createOscillator(),g=a.createGain();
 o.type='triangle';o.frequency.value=cap?200:320;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);
 o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function click(i){$('promo').hidden=true;if(over||busy||(ai()&&S.t!==H())||(net&&S.t!==net.color))return;
 const ms=moves.filter(m=>m.f===sel&&m.t===i);
 if(ms.length>1&&ms[0].pr){promo(ms);return}
 if(ms.length){play(ms[0]);return}

 else if(res)v=rw?(ai()?(H()==='w'?1e4:-1e4):(S.t==='w'?1e4:-1e4)):ai()?(H()==='w'?-1e4:1e4):(S.t==='w'?-1e4:1e4);
 else if(!moves.length)v=kingIn(S)?(S.t==='w'?-1e4:1e4):0;
 else if(over)v=0;
 else{const keep=STY,kx=XE;STY=STYLES[0];XE=true;try{v=(S.t==='w'?1:-1)*nq(S,-1e9,1e9)}finally{STY=keep;XE=kx}v=Math.max(-3000,Math.min(3000,v))}
 return v}
function showBar(){const big=Math.abs(evv)>=1e4,fp=flipped(),w=$('evw'),t=$('evt');
 const p=big?(evv>0?100:0):Math.max(3,Math.min(97,100/(1+Math.exp(-evv/200))));
 w.style.height=p+'%';w.style.top=fp?'0':'auto';w.style.bottom=fp?'auto':'0';
 const win=evv>=0;
 t.textContent=big?(evv>0?'1-0':'0-1'):over?'½':(win?'+':'−')+(Math.abs(evv)/100).toFixed(1);
 const atBottom=win===!fp;t.style.top=atBottom?'auto':'3px';t.style.bottom=atBottom?'3px':'auto';t.style.color=win?'#262522':'#fff'}
