function hostFlags(){for(const [,e] of S.ents){if(!e.alive)continue;const mine=S.flags[e.team],en=S.flags[1-e.team];
  if(en.st!=='carry'&&Math.hypot(en.x-e.x,en.z-e.z)<2&&Math.abs(en.y-e.y)<4){en.st='carry';en.carrier=e.id;feed(e.name+' took the '+TN8[en.t]+' flag!');flagSend()}
  if(mine.st==='drop'&&Math.hypot(mine.x-e.x,mine.z-e.z)<2&&Math.abs(mine.y-e.y)<4){mine.st='home';const h=homeP(mine.t);mine.x=h[0];mine.y=h[1];mine.z=h[2];feed(e.name+' returned the flag');flagSend()}
  if(en.carrier===e.id&&mine.st==='home'&&Math.hypot(mine.x-e.x,mine.z-e.z)<5){S.score[e.team]++;en.st='home';en.carrier='';const h=homeP(en.t);en.x=h[0];en.y=h[1];en.z=h[2];feed(TN8[e.team]+' SCORES!');flagSend();if(S.score[e.team]>=S.cap){Net.send('over',{w:e.team});endGame(e.team)}}}
  for(const f of S.flags)if(f.st==='carry'){const c=S.ents.get(f.carrier);if(c){f.x=c.x;f.y=c.y;f.z=c.z}}}
function endGame(w){if(S.over)return;S.over=true;S.state='over';$('over').style.display='flex';$('overt').textContent=ME&&ME.team===w?'VICTORY!':TN8[w]+' TEAM WINS';$('overt').style.color='#'+TC8[w].toString(16).padStart(6,'0');document.exitPointerLock&&document.exitPointerLock();beep(ME&&ME.team===w?880:200,.8)}
Net.on('over',d=>endGame(d.w));
function phys(e,wx,wz,dt){if(e.y<Y-8){die(e,'',true);return}const sp=Math.hypot(wx,wz);mcStep(e,dt,sp?wx/sp:0,sp?wz/sp:0,false,false,false,sp);clampA(e);if(e.reg>0)e.reg-=dt;else if(e.hp<20)e.hp=Math.min(20,e.hp+dt*.5)}
function botStep(b,dt){if(!b.alive){b.rt-=dt;if(b.rt<=0)respawn(b);return}if(b.prot>0)b.prot-=dt;b.cd-=dt;b.think-=dt;
  if(b.think<=0){b.think=.4;let best=null,bd=1e9;for(const [,e] of S.ents){if(e.team===b.team||!e.alive)continue;const d=Math.hypot(e.x-b.x,e.z-b.z);if(d<bd){bd=d;best=e}}b.tgt=best;b.bd=bd;
    const en=S.flags[1-b.team],mine=S.flags[b.team],num=+b.id.slice(1);let g;if(en.carrier===b.id)g=[mine.x,0,mine.z];else if(mine.st!=='home'&&(mine.st==='carry'||Math.hypot(mine.x-b.x,mine.z-b.z)<45))g=[mine.x,0,mine.z];else if(num%4===0)g=best&&bd<30?[best.x,0,best.z]:[mine.x,0,mine.z+(b.team?-6:6)];else g=[en.x,0,en.z];b.goal=g}
  const g=b.goal,dx=g[0]-b.x,dz=g[2]-b.z,d=Math.hypot(dx,dz)||1,carry=S.flags[1-b.team].carrier===b.id,sp=carry?3.8:4.5;let wx=0,wz=0;
  const t=b.tgt;let fx=dx/d,fz=dz/d;if(t&&b.bd<3.5&&!carry){const ex=t.x-b.x,ez=t.z-b.z,l=Math.hypot(ex,ez)||1;fx=ex/l;fz=ez/l}
  b.yaw=Math.atan2(-fx,-fz);if(d>1.2){wx=fx*sp;wz=fz*sp}
  const px=b.x,pz=b.z;phys(b,wx,wz,dt);if(Math.hypot(b.x-px,b.z-pz)<sp*dt*.4&&d>1.5){if(b.onGround)b.vy=8.9;b.blk=(b.blk||0)+dt;if(b.blk>.6){b.blk=0;b.kx+=-fz*7*(Math.random()<.5?1:-1);b.kz+=fx*7}}b.anim+=sp*dt;
  if(t&&b.bd<3.2&&b.cd<=0){b.cd=.85;const l=Math.hypot(t.x-b.x,t.z-b.z)||1;sendHit(t,SD*.8,(t.x-b.x)/l*6,(t.z-b.z)/l*6,b.id)}}
function stepSelf(dt){const e=ME;if(e.prot>0)e.prot-=dt;if(!e.alive){e.rt-=dt;if(e.rt<=0){respawn(e);msg('Respawned',1000)}return}
  const f=(K.KeyW?1:0)-(K.KeyS?1:0),s=(K.KeyD?1:0)-(K.KeyA?1:0),carry=S.flags[1-e.team].carrier===e.id;e.sneak=!!K.ShiftLeft;const sp=(e.sneak?1.31:K.ControlLeft?5.61:4.32)*(carry?.85:1);let wx=0,wz=0;if(f||s){const l=Math.hypot(f,s);wx=(-Math.sin(e.yaw)*f+Math.cos(e.yaw)*s)/l*sp;wz=(-Math.cos(e.yaw)*f-Math.sin(e.yaw)*s)/l*sp}
  if(K.Space&&e.onGround){e.vy=8.9;e.onGround=false;if(K.ControlLeft){e.hvx=(e.hvx||0)+wx/(sp||1)*3.2;e.hvz=(e.hvz||0)+wz/(sp||1)*3.2}}if(e.sneak&&e.onGround){const sx=e.x+wx*dt,sz=e.z+wz*dt;if(!groundAt(sx,e.y,e.z))wx=0;if(!groundAt(e.x,e.y,sz))wz=0}phys(e,wx,wz,dt);e.anim+=Math.hypot(wx,wz)*dt;e.cd-=dt;hand.rotation.x*=.85;
  if(MS&&locked&&e.cd<=0){e.cd=.5;hand.rotation.x=-1;beep(260,.06);const t=aimEnt(3.6);if(t){const l=Math.hypot(t.x-e.x,t.z-e.z)||1;sendHit(t,SD,(t.x-e.x)/l*6,(t.z-e.z)/l*6,e.id);beep(180,.08)}}}
let lastPos=0,lastB=0;
Net.on('pos',(d,from)=>{const e=S.ents.get(from);if(!e||e===ME)return;e.tx=d[0];e.ty=d[1];e.tz=d[2];e.yaw=d[3];e.pitch=d[4];e.hp=d[5]});
Net.on('bots',d=>{if(Net.isHost())return;for(const a of d){const e=S.ents.get(a[0]);if(e){e.tx=a[1];e.ty=a[2];e.tz=a[3];e.yaw=a[4];e.hp=a[5]}}});
function hud(){const t=Math.max(0,(Date.now()-S.t0)/1000|0);$('time').textContent=`RED ${S.score[0]}  —  ${S.score[1]} BLUE   ·   ${t/60|0}:${String(t%60).padStart(2,'0')}`;
  const carrying=ME&&S.flags[1-ME.team]&&S.flags[1-ME.team].carrier===ME.id;$('hp').textContent=ME?'❤'.repeat(Math.max(0,Math.ceil(ME.hp/2)))+(carrying?'   ⚑ CARRYING FLAG — RUN HOME!':''):'';
  $('feed').innerHTML=S.feed.filter(f=>performance.now()-f.at<7000).map(f=>'<div>'+f.t+'</div>').join('');$('fl').innerHTML=S.flags.map(f=>`<span style="color:#${TC8[f.t].toString(16).padStart(6,'0')}">${TN8[f.t]} flag: ${f.st==='home'?'home':f.st==='carry'?'TAKEN':'dropped'}</span>`).join(' · ')}
let lastT=performance.now(),hostT=0;
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-lastT)/1000);lastT=now;if(!renderer)return;
  if(S.state==='play'||S.state==='over'){if(ME&&!S.over)stepSelf(dt);if(Net.isHost()&&!S.over){for(const [,e] of S.ents)if(e.bot)botStep(e,dt);hostT+=dt;if(hostT>.1){hostT=0;hostFlags()}}
    for(const [,e] of S.ents){const own=e===ME||(e.bot&&Net.isHost());if(!own){const k=Math.min(1,dt*12);e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k;e.z+=(e.tz-e.z)*k}if(!e.mesh)continue;setHeld(e,'s'+e.sword);if(e===ME){e.mesh.visible=VIEW>0&&e.alive;if(!e.mesh.visible)continue}else e.mesh.visible=e.alive;e.mesh.position.set(e.x,e.y,e.z);e.mesh.rotation.y=e.yaw;if(!own&&Math.hypot(e.tx-e.x,e.tz-e.z)>.05)e.anim+=dt*1.2;animAvatar(e,dt,own)}
    for(const f of S.flags){if(f.st==='home'){const h=homeP(f.t);f.x=h[0];f.y=h[1];f.z=h[2]}f.mesh.position.set(f.x,f.y+(f.st==='carry'?1.4:-1.5),f.z);f.mesh.rotation.y+=dt*(f.st==='carry'?3:1)}
    if(ME&&now-lastPos>66){lastPos=now;Net.send('pos',[+ME.x.toFixed(2),+ME.y.toFixed(2),+ME.z.toFixed(2),+ME.yaw.toFixed(2),+ME.pitch.toFixed(2),Math.round(ME.hp)])}
    if(Net.isHost()&&now-lastB>90){lastB=now;const a=[];for(const [,e] of S.ents)if(e.bot)a.push([e.id,+e.x.toFixed(2),+e.y.toFixed(2),+e.z.toFixed(2),+e.yaw.toFixed(2),Math.round(e.hp)]);Net.send('bots',a)}
    if(ME&&ME.alive)camPlace(ME.x,ME.y+(ME.sneak?1.54:1.62),ME.z,ME.yaw,ME.pitch);else{camera.position.set(64,50,ME&&ME.team?135:-8);camera.rotation.set(-.6,ME&&ME.team?0:Math.PI,0)}hand.visible=!!(ME&&ME.alive)&&VIEW===0;if(ME)setFP('s'+ME.sword);
    scene.children.forEach(c=>{if(c.userData.cl){c.position.x+=dt*1.5;if(c.position.x>200)c.position.x=-80}});flushChunks(10);hud();renderer.render(scene,camera)}}
addEventListener('keydown',e=>{K[e.code]=1;if(e.code==='KeyV'&&S.state==='play'){VIEW=(VIEW+1)%3;msg(['First person','Third person (back)','Third person (front)'][VIEW],900)}if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>K[e.code]=0);
addEventListener('mousedown',e=>{if(S.state==='menu')return;if(!locked&&!S.over){$('c').requestPointerLock&&$('c').requestPointerLock();return}if(e.button===0)MS=1});addEventListener('mouseup',()=>MS=0);
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===$('c'));addEventListener('mousemove',e=>{if(!locked||!ME)return;ME.yaw-=e.movementX*.0022;ME.pitch=Math.max(-1.5,Math.min(1.5,ME.pitch-e.movementY*.0022))});
let inRoom=false;const rr=()=>Math.random().toString(36).slice(2,6).toUpperCase();
function joinRoom(c){Net.join(c,$('pname').value||'Player');inRoom=true;$('lobby').style.display='block';$('menu1').style.display='none';$('rcode').textContent=c;lt()}
function lt(){if(!inRoom||S.state!=='menu')return;const h=[[Net.id,Net.name],...[...Net.peers.entries()].map(([i,p])=>[i,p.n||'Player'])].sort((a,b)=>a[0]<b[0]?-1:1);$('plist').innerHTML=h.map((x,i)=>`<div>${i?'':'👑 '}${x[1]}${x[0]===Net.id?' (you)':''}</div>`).join('');const host=Net.isHost();$('hostctl').style.display=host?'block':'none';$('waitmsg').style.display=host?'none':'block';setTimeout(lt,500)}
function hostStart(){const hum=[Net.id,...Net.peers.keys()].sort(),names={[Net.id]:Net.name};for(const [i,p] of Net.peers)names[i]=p.n;const m={t0:Date.now(),order:hum,names,seed:(Math.random()*1e9)|0};Net.send('start',m);start(m)}
Net.on('start',m=>{if(S.state==='menu'||S.state==='over')start(m)});
addEventListener('DOMContentLoaded',()=>{init();$('solo').onclick=()=>{joinRoom('F'+rr()+rr());setTimeout(hostStart,300)};$('mk').onclick=()=>joinRoom(rr());$('jn').onclick=()=>{const c=($('rin').value||'').trim().toUpperCase();if(c)joinRoom(c)};$('go').onclick=hostStart;
  $('again').onclick=()=>{$('over').style.display='none';$('hud').style.display='none';$('menu').style.display='flex';S.state='menu';S.over=false;if(inRoom){$('lobby').style.display='block';lt()}};requestAnimationFrame(loop)});
window.CT={S,Net,hostStart,joinRoom,K,get ME(){return ME}};


</script></body></html>
