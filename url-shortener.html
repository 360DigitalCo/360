<h2 class="page-title"><span class="title-icon" data-octicon="link" data-octicon-label="URL Shortener" data-octicon-size="22"></span> URL Shortener</h2>
<div class="shortener-box">
<input id="shortInput" placeholder="Paste a long URL..." type="url"/>
<button id="shortBtn">Shorten</button>
</div>
<div id="shortResult"></div>
</div>
<audio id="clickSound" preload="auto" src="../click-sound.mp3"></audio>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/auth-fix.js"></script>
<script src="/assets/js/wide.js"></script>
<script src="/assets/js/gallium.js"></script>
<script src="/assets/js/cookie.js"></script>
<script src="/assets/js/cursor.js"></script>
<script>
    document.getElementById("shortBtn").onclick = async () => {
      const url    = document.getElementById("shortInput").value.trim();
      const result = document.getElementById("shortResult");
      if (!url) { result.style.display="block"; result.textContent="Please enter a URL."; return; }
      result.style.display = "block";
      result.textContent = "Shortening...";
      try {
        const res = await fetch("https://wiswfpfsjiowtrdyqpxy.supabase.co/functions/v1/smooth-endpoint", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (!data.shortUrl) {
          result.textContent = "Failed to shorten URL.";
          return;
        }
        const short = data.shortUrl;
        result.innerHTML = "Short URL: <a href=\"" + short + "\" target=\"_blank\">" + short + "</a><br><button onclick=\"navigator.clipboard.writeText('" + short + "');this.textContent='Copied!'\" style=\"margin-top:8px;padding:6px 14px;border-radius:8px;border:none;background:linear-gradient(110deg,var(--a),var(--a2));color:#050816;font-weight:700;cursor:pointer;\">Copy</button>";
      } catch { result.textContent = "Failed to shorten URL."; }
    };
    document.getElementById("shortInput").addEventListener("keydown", e => { if (e.key==="Enter") document.getElementById("shortBtn").click(); });
  </script>
<script src="/assets/js/mobile-nav.js" defer></script>
