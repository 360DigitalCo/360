<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>Welcome - 360</title>
<link href="/assets/css/main.css" rel="stylesheet"/>
<link href="/assets/css/wide.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:var(--font);}
    .ob-wrap{max-width:540px;width:90%;}
    .ob-progress{display:flex;gap:6px;margin-bottom:28px;}
    .ob-step-dot{flex:1;height:4px;border-radius:2px;background:var(--dc-sep);transition:background .3s;}
    .ob-step-dot.done{background:var(--a);}
    .ob-card{background:var(--dc-sidebar-bg);border:1.5px solid var(--dc-sep);border-radius:20px;padding:36px;box-shadow:0 24px 64px rgba(0,0,0,.4);animation:ob-in .25s ease;}
    @keyframes ob-in{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
    .ob-icon{font-size:48px;margin-bottom:14px;}
    .ob-title{font-size:22px;font-weight:800;color:var(--dc-text);margin-bottom:8px;}
    .ob-sub{font-size:14px;color:var(--dc-muted);line-height:1.6;margin-bottom:20px;}
    .ob-rules{background:var(--dc-input-bg);border-radius:10px;padding:14px;font-size:13px;color:var(--dc-text);white-space:pre-wrap;max-height:200px;overflow-y:auto;margin-bottom:20px;line-height:1.6;}
    .ob-roles{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
    .ob-role{padding:8px 14px;border-radius:10px;border:1.5px solid var(--dc-sep);background:var(--dc-input-bg);cursor:pointer;font-size:13px;color:var(--dc-text);transition:all .15s;}
    .ob-role.selected{border-color:var(--a);background:rgba(var(--a-rgb),.12);color:var(--a);}
    .ob-channels{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
    .ob-ch{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--dc-sep);background:var(--dc-input-bg);cursor:pointer;font-size:13px;color:var(--dc-text);transition:all .15s;}
    .ob-ch.selected{border-color:var(--a);}
    .ob-ch input[type=checkbox]{accent-color:var(--a);}
    .ob-btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;background:var(--a);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;margin-top:8px;}
    .ob-btn:hover{opacity:.88;}
    .ob-btn-sec{background:var(--dc-input-bg);color:var(--dc-text);border:1.5px solid var(--dc-sep);}
    .ob-agree{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--dc-muted);margin-bottom:16px;}
    .ob-agree input{margin-top:2px;accent-color:var(--a);}
  </style>
<meta content="Welcome  360 - part of the 360 web platform." name="description"/><meta content="noindex, nofollow" name="robots"/><meta content="website" property="og:type"/><meta content="Welcome - 360" property="og:title"/><meta content="Welcome  360 - part of the 360 web platform." property="og:description"/><meta content="https://360-search.com/onboarding.html" property="og:url"/><meta content="360" property="og:site_name"/><meta content="summary" name="twitter:card"/><meta content="Welcome - 360" name="twitter:title"/><meta content="Welcome  360 - part of the 360 web platform." name="twitter:description"/><link href="https://360-search.com/onboarding.html" rel="canonical"/><link rel="stylesheet" href="/assets/css/mobile-nav.css">
</head>
<body>
<div class="ob-wrap">
<div class="ob-progress" id="ob-progress"></div>
<div class="ob-card" id="ob-card"><div class="ob-sub" style="text-align:center;margin:0;">Loading...</div></div>
</div>
<script>
const SB_URL='https://wiswfpfsjiowtrdyqpxy.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpc3dmcGZzamlvd3RyZHlxcHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMzg4OTcsImV4cCI6MjA4MzkxNDg5N30.z_4FtM2c8UwgrRlafPYjolQuod4IoHQats95XHio1zM';
const sb=window.supabaseClient||supabase.createClient(SB_URL,SB_KEY);

let server=null,session=null,currentStep=0,startChannel='',channelList=[];
const selectedRoles=new Set();
const steps=[];
const card=()=>document.getElementById('ob-card');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function iconHTML(){
  if(server.icon&&/^https?:\/\//.test(server.icon))return '<img src="'+esc(server.icon)+'" alt="" style="width:64px;height:64px;border-radius:16px;object-fit:cover;">';
  return esc(server.icon||'')||'<span data-octicon="globe"></span>';
}

function chatUrl(){
  let u='/chat?s='+encodeURIComponent(server.slug||server.id);
  if(startChannel)u+='&c='+encodeURIComponent(startChannel);
  return u;
}

async function init(){
  const{data:{session:s}}=await sb.auth.getSession();
  session=s;
  const serverId=new URLSearchParams(location.search).get('server');
  if(!session){location.href='/account?from='+encodeURIComponent(location.pathname+location.search);return;}
  if(!serverId){location.href='/chat';return;}
  const{data:sv}=await sb.from('servers').select('id,name,slug,icon,description,onboarding_enabled,onboarding_rules,onboarding_roles,onboarding_welcome_text').eq('id',serverId).maybeSingle();
  server=sv;
  if(!server){location.href='/chat';return;}
  const{data:mem}=await sb.from('server_members').select('onboarding_done').eq('server_id',server.id).eq('user_id',session.user.id).maybeSingle();
  if(!mem){location.href='/discover';return;}
  if(mem.onboarding_done||!server.onboarding_enabled){location.href=chatUrl();return;}

  const{data:chs}=await sb.from('channels').select('name,description').eq('server_id',server.id).eq('is_public',true).order('position');
  channelList=chs||[];

  steps.push(renderWelcome);
  if(server.onboarding_rules)steps.push(renderRules);
  if(Array.isArray(server.onboarding_roles)&&server.onboarding_roles.length)steps.push(renderRoles);
  if(channelList.length>1)steps.push(renderChannels);
  steps.push(renderDone);
  renderProgress();
  steps[0]();
}

function renderProgress(){
  document.getElementById('ob-progress').innerHTML=steps.map((_,i)=>'<div class="ob-step-dot'+(i<=currentStep?' done':'')+'"></div>').join('');
}

function nextStep(){
  currentStep++;
  renderProgress();
  const c=card();
  c.style.animation='none';
  requestAnimationFrame(()=>{c.style.animation='';steps[currentStep]();});
}

function renderWelcome(){
  card().innerHTML=
    '<div class="ob-icon">'+iconHTML()+'</div>'+
    '<div class="ob-title">Welcome to '+esc(server.name)+'</div>'+
    '<div class="ob-sub">'+esc(server.onboarding_welcome_text||'We are glad you are here. Let us get you set up.')+'</div>'+
    (server.description?'<div class="ob-sub" style="margin-top:-8px;">'+esc(server.description)+'</div>':'')+
    '<button class="ob-btn" id="ob-next" type="button">Get Started</button>';
  document.getElementById('ob-next').onclick=nextStep;
}

function renderRules(){
  card().innerHTML=
    '<div class="ob-title">Server Rules</div>'+
    '<div class="ob-sub">Please read and agree to the rules before continuing.</div>'+
    '<div class="ob-rules">'+esc(server.onboarding_rules)+'</div>'+
    '<label class="ob-agree"><input type="checkbox" id="rules-agree"/> I have read and agree to the server rules.</label>'+
    '<button class="ob-btn" id="ob-next" type="button" disabled style="opacity:.5;">I Agree</button>';
  const cb=document.getElementById('rules-agree'),btn=document.getElementById('ob-next');
  cb.onchange=()=>{btn.disabled=!cb.checked;btn.style.opacity=cb.checked?'':'.5';};
  btn.onclick=nextStep;
}

function renderRoles(){
  const roles=server.onboarding_roles;
  card().innerHTML=
    '<div class="ob-title">Pick your roles</div>'+
    '<div class="ob-sub">Select the roles that describe you. You can change these later.</div>'+
    '<div class="ob-roles">'+roles.map((r,i)=>'<div class="ob-role'+(selectedRoles.has(r.name||r.id)?' selected':'')+'" data-i="'+i+'">'+esc(r.emoji||'')+' '+esc(r.name||r.id)+'</div>').join('')+'</div>'+
    '<button class="ob-btn" id="ob-next" type="button">Continue</button>'+
    '<button class="ob-btn ob-btn-sec" id="ob-skip" type="button">Skip</button>';
  card().querySelectorAll('.ob-role').forEach(el=>el.onclick=()=>{
    const r=roles[Number(el.dataset.i)],key=r.name||r.id;
    if(selectedRoles.has(key)){selectedRoles.delete(key);el.classList.remove('selected');}
    else{selectedRoles.add(key);el.classList.add('selected');}
  });
  document.getElementById('ob-next').onclick=nextStep;
  document.getElementById('ob-skip').onclick=()=>{selectedRoles.clear();nextStep();};
}

function renderChannels(){
  if(!startChannel)startChannel=channelList[0].name;
  card().innerHTML=
    '<div class="ob-title">Where do you want to start?</div>'+
    '<div class="ob-sub">Pick the channel you will land in first.</div>'+
    '<div class="ob-channels">'+channelList.map(c=>'<label class="ob-ch'+(c.name===startChannel?' selected':'')+'"><input type="radio" name="start" value="'+esc(c.name)+'"'+(c.name===startChannel?' checked':'')+'/># '+esc(c.name)+'<span style="color:var(--dc-muted);font-size:11px;margin-left:auto;">'+esc(c.description||'')+'</span></label>').join('')+'</div>'+
    '<button class="ob-btn" id="ob-next" type="button">Continue</button>';
  card().querySelectorAll('input[name=start]').forEach(inp=>inp.onchange=()=>{
    startChannel=inp.value;
    card().querySelectorAll('.ob-ch').forEach(l=>l.classList.toggle('selected',l.contains(inp)&&inp.checked));
  });
  document.getElementById('ob-next').onclick=nextStep;
}

async function renderDone(){
  card().innerHTML='<div class="ob-title">Finishing up</div><div class="ob-sub">Saving your choices...</div>';
  const{error}=await sb.rpc('complete_onboarding',{p_server_id:server.id,p_roles:[...selectedRoles]});
  if(error){
    card().innerHTML='<div class="ob-title">Something went wrong</div><div class="ob-sub">'+esc(error.message)+'</div><button class="ob-btn" id="ob-retry" type="button">Try again</button>';
    document.getElementById('ob-retry').onclick=renderDone;
    return;
  }
  card().innerHTML=
    '<div class="ob-title">You are all set</div>'+
    '<div class="ob-sub">Welcome to <strong>'+esc(server.name)+'</strong>.</div>'+
    '<button class="ob-btn" id="ob-go" type="button">Go to Server</button>';
  document.getElementById('ob-go').onclick=()=>{location.href=chatUrl();};
}

init();
</script>
<script src="/assets/js/mobile-nav.js" defer></script>
</body>
</html>
