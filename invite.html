<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Join Server - 360</title>
<link href="/assets/css/main.css" rel="stylesheet"/>
<link href="/assets/css/wide.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:var(--font);}
    .inv-card{background:var(--dc-sidebar-bg);border:1.5px solid var(--dc-sep);border-radius:20px;padding:40px 36px;max-width:440px;width:90%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.4);}
    .inv-icon{font-size:56px;margin-bottom:16px;line-height:1;}
    .inv-server-name{font-size:24px;font-weight:800;color:var(--dc-text);margin-bottom:6px;}
    .inv-desc{font-size:14px;color:var(--dc-muted);margin-bottom:4px;line-height:1.5;}
    .inv-meta{font-size:12px;color:var(--dc-muted);margin-bottom:24px;}
    .inv-meta span{display:inline-flex;align-items:center;gap:4px;margin:0 6px;}
    .inv-online::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;}
    .inv-btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;background:var(--a);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;margin-bottom:10px;}
    .inv-btn:hover{opacity:.88;}
    .inv-btn-sec{background:var(--dc-input-bg);color:var(--dc-text);border:1.5px solid var(--dc-sep);}
    .inv-error{color:#ef4444;font-size:14px;margin-top:12px;}
    .inv-expired{opacity:.6;}
    .inv-spinner{font-size:32px;animation:spin 1s linear infinite;margin:20px auto;display:block;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .inv-channels{text-align:left;background:var(--dc-input-bg);border-radius:10px;padding:12px 14px;margin:16px 0;font-size:13px;}
    .inv-ch{display:flex;align-items:center;gap:6px;color:var(--dc-muted);padding:3px 0;}
    .inv-rules{text-align:left;background:var(--dc-input-bg);border-radius:10px;padding:12px 14px;margin:16px 0;font-size:13px;color:var(--dc-text);white-space:pre-wrap;max-height:160px;overflow-y:auto;}
  </style>
<script src="assets/js/octicons.js"></script>
<meta content="Join Server  360 - part of the 360 web platform." name="description"/><meta content="noindex, nofollow" name="robots"/><meta content="website" property="og:type"/><meta content="Join Server - 360" property="og:title"/><meta content="Join Server  360 - part of the 360 web platform." property="og:description"/><meta content="https://360-search.com/invite.html" property="og:url"/><meta content="360" property="og:site_name"/><meta content="summary" name="twitter:card"/><meta content="Join Server - 360" name="twitter:title"/><meta content="Join Server  360 - part of the 360 web platform." name="twitter:description"/><link href="https://360-search.com/invite.html" rel="canonical"/><link rel="stylesheet" href="/assets/css/mobile-nav.css">
</head>
<body>
<div class="inv-card" id="inv-card">
<div class="inv-spinner"><span data-octicon="hourglass"></span></div>
</div>
<script>
const SB_URL = 'https://wiswfpfsjiowtrdyqpxy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpc3dmcGZzamlvd3RyZHlxcHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMzg4OTcsImV4cCI6MjA4MzkxNDg5N30.z_4FtM2c8UwgrRlafPYjolQuod4IoHQats95XHio1zM';
const sb = window.supabaseClient || supabase.createClient(SB_URL, SB_KEY);
const card = document.getElementById('inv-card');
let inviteCode = '';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function notice(title, text) {
  card.innerHTML = '<div class="inv-icon"><span data-octicon="x-circle"></span></div><div class="inv-server-name">' + esc(title) + '</div><div class="inv-desc">' + esc(text) + '</div>' +
    '<a class="inv-btn inv-btn-sec" style="text-decoration:none;margin-top:20px;" href="/discover">Browse servers</a>';
}

function serverIcon(icon) {
  if (icon && /^https?:\/\//.test(icon)) return '<img src="' + esc(icon) + '" alt="" style="width:72px;height:72px;border-radius:18px;object-fit:cover;">';
  return icon ? esc(icon) : '<span data-octicon="globe"></span>';
}

function route(info) {
  if (info.onboarding_required) location.href = '/onboarding?server=' + encodeURIComponent(info.server_id) + '&from=invite';
  else location.href = '/chat?s=' + encodeURIComponent(info.slug || info.server_id);
}

async function init() {
  const params = new URLSearchParams(location.search);
  const pathMatch = location.pathname.match(/\/invite\/([^\/]+)/);
  inviteCode = (pathMatch && decodeURIComponent(pathMatch[1])) || params.get('code') || params.get('invite') || '';
  if (!inviteCode) return notice('Invalid Link', 'This invite link is invalid.');

  const { data: pv, error } = await sb.rpc('get_invite_preview', { p_code: inviteCode });
  if (error || !pv) return notice('Invite Unavailable', 'This invite does not exist, has expired or has reached its limit.');

  const { data: { session } } = await sb.auth.getSession();
  const authed = !!session;
  const channels = (pv.channels || []).map((n) => '<div class="inv-ch"># ' + esc(n) + '</div>').join('');
  const rules = pv.rules ? '<details><summary style="cursor:pointer;font-size:13px;color:var(--dc-muted);margin-bottom:8px;"><span data-octicon="law"></span> Server Rules</summary><div class="inv-rules">' + esc(pv.rules) + '</div></details>' : '';

  let action;
  if (authed && pv.is_member) action = '<button class="inv-btn" id="go-btn" type="button">Open server</button>';
  else if (authed) action = '<button class="inv-btn" id="join-btn" type="button">Accept Invite</button>';
  else action = '<button class="inv-btn" id="login-btn" type="button">Sign in to join</button>';

  card.innerHTML =
    '<div class="inv-icon">' + serverIcon(pv.icon) + '</div>' +
    '<div class="inv-server-name">' + esc(pv.name) + '</div>' +
    (pv.description ? '<div class="inv-desc">' + esc(pv.description) + '</div>' : '') +
    '<div class="inv-meta"><span><b>' + Number(pv.member_count || 0).toLocaleString() + '</b> members</span>' +
    (pv.verified ? '<span><span data-octicon="check-circle"></span> Verified</span>' : '') + '</div>' +
    rules + (channels ? '<div class="inv-channels">' + channels + '</div>' : '') + action + '<div id="inv-msg"></div>';

  const go = document.getElementById('go-btn');
  if (go) go.onclick = () => { location.href = '/chat?s=' + encodeURIComponent(pv.slug || pv.server_id); };
  const login = document.getElementById('login-btn');
  if (login) login.onclick = () => { location.href = '/account?from=' + encodeURIComponent('/invite?code=' + inviteCode); };
  const join = document.getElementById('join-btn');
  if (join) join.onclick = async () => {
    join.disabled = true;
    join.textContent = 'Joining...';
    const { data, error: err } = await sb.rpc('join_server_by_invite', { p_code: inviteCode });
    if (err) {
      document.getElementById('inv-msg').innerHTML = '<div class="inv-error">' + esc(err.message) + '</div>';
      join.disabled = false;
      join.textContent = 'Accept Invite';
      return;
    }
    route(data);
  };
}

init();
</script>
<script src="/assets/js/mobile-nav.js" defer></script>
</body>
</html>
