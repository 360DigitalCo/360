<script>
  // Surface module/runtime failures instead of leaving an annoying blank canvas.
  const errorBox = document.getElementById('load-error');
  function showLoadError(message) {
    errorBox.textContent = 'The 3D model could not start. ' + message + '\n\nCheck that you are online so the Three.js library can load, then refresh.';
    errorBox.style.display = 'block';
  }
  window.addEventListener('error', event => {
    if (event.message) showLoadError(event.message);
    else showLoadError('A script or library failed to load.');
  });
  window.addEventListener('unhandledrejection', event => {
    showLoadError(String(event.reason || 'A module failed to load.'));
  });
