<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>360 Maps</title>
<meta name="description" content="Search places, get directions and navigate with 360 Maps."/>
<meta name="theme-color" content="#3b82f6"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" type="image/png" href="/favicon-32x32.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="canonical" href="https://360-search.com/apps/360Maps.html"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="/assets/css/apps-ui.css"/>
<link rel="stylesheet" href="/assets/css/360Maps.css?v=5"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<script>try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark');}catch(e){}</script>

<div id="map"></div>

<aside class="panel" id="panel">
  <button class="handle" id="handle" aria-label="Toggle panel"><span></span></button>
  <header class="panel-top">
    <a class="back" href="/apps" title="Back to apps" aria-label="Back to apps">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <form class="search" id="searchForm" autocomplete="off">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Search places and addresses" spellcheck="false" aria-label="Search"/>
      <button type="button" class="clear" id="qClear" hidden aria-label="Clear">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </form>
  </header>
  <ul class="suggest" id="suggest" hidden></ul>

  <div class="chips" id="chips">
    <button data-poi="restaurant">Food</button>
    <button data-poi="cafe">Cafe</button>
    <button data-poi="fuel">Fuel</button>
    <button data-poi="atm">ATM</button>
    <button data-poi="pharmacy">Pharmacy</button>
    <button data-poi="hospital">Hospital</button>
    <button data-poi="supermarket">Groceries</button>
    <button data-poi="park">Parks</button>
  </div>

  <nav class="tabs" id="tabs">
    <button class="on" data-tab="saved">Saved</button>
    <button data-tab="recent">Recent</button>
    <button data-tab="trips">Trips</button>
  </nav>

  <div class="body" id="body"></div>
</aside>


<div class="tools" id="tools">
  <button id="zIn" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="zOut" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="locate" aria-label="My location" title="My location"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
  <button id="measure" aria-label="Measure" title="Measure distance"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/></svg></button>
  <button id="report" aria-label="Report incident" title="Report an incident"><svg viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></button>
</div>

<div class="layers" id="layers">
  <button class="on" data-style="standard">Map</button>
  <button data-style="satellite">Satellite</button>
  <button data-style="terrain">Terrain</button>
</div>

<div class="navbar" id="navbar" hidden>
  <div class="nav-main">
    <div class="nav-icon" id="navIcon"></div>
    <div class="nav-text">
      <div class="nav-step" id="navStep"></div>
      <div class="nav-sub" id="navSub"></div>
    </div>
    <button class="nav-exit ui-btn" id="navExit">End</button>
  </div>
</div>

<div class="measure" id="measureBar" hidden>
  <span id="measureText">Click the map to add points</span>
  <button class="ui-btn" id="measureClear">Clear</button>
  <button class="ui-btn primary" id="measureDone">Done</button>
</div>

<div class="ui-modal-ov" id="saveModal">
  <div class="ui-modal">
    <h3>Save place</h3>
    <input class="ui-input" id="saveLabel" placeholder="Name" maxlength="80"/>
    <input class="ui-input" id="saveNote" placeholder="Note (optional)" maxlength="200"/>
    <div class="cats" id="saveCats"></div>
    <div class="modal-row">
      <button class="ui-btn" id="saveCancel">Cancel</button>
      <button class="ui-btn primary" id="saveGo">Save</button>
    </div>
  </div>
</div>

<div class="ui-modal-ov" id="incidentModal">
  <div class="ui-modal">
    <h3>Report an incident</h3>
    <div class="inc-grid" id="incGrid">
      <button data-type="accident">Accident</button>
      <button data-type="police">Police</button>
      <button data-type="hazard">Hazard</button>
      <button data-type="road_closed">Road closed</button>
      <button data-type="traffic">Heavy traffic</button>
      <button data-type="speed_trap">Speed trap</button>
    </div>
    <div class="modal-row"><button class="ui-btn" id="incCancel">Cancel</button></div>
  </div>
</div>

<div class="ui-modal-ov" id="tripModal">
  <div class="ui-modal">
    <h3>Add to trip</h3>
    <div class="trip-pick" id="tripPick"></div>
    <div class="modal-row"><button class="ui-btn" id="tripCancel">Cancel</button></div>
  </div>
</div>

<div class="ui-toast" id="toast"></div>
<script src="/assets/js/360Maps.js?v=5"></script>
</body>
</html>
