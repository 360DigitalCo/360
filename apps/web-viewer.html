<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360 Proxy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #0b1a24;
    --ink-2: #10283a;
    --aqua: #34d3c4;
    --violet: #8b6cff;
    --amber: #ffb35c;
    --rose: #ff6f91;

    --glass: rgba(255, 255, 255, 0.10);
    --glass-strong: rgba(255, 255, 255, 0.16);
    --glass-field: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.28);
    --glass-highlight: rgba(255, 255, 255, 0.45);
    --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);

    --text: #f1f6fa;
    --text-dim: rgba(241, 246, 250, 0.68);
    --focus: #9ff3ea;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    line-height: 1.55;
    background: linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 55%, #0a1620 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* Colour orbs the glass blurs against. Glass only reads as glass
     when there is something vivid behind it. */
  .orbs {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.75;
  }

  .orb.a {
    width: 46vmax; height: 46vmax;
    left: -14vmax; top: -12vmax;
    background: radial-gradient(circle, var(--violet), transparent 65%);
    animation: drift-a 26s ease-in-out infinite alternate;
  }

  .orb.b {
    width: 40vmax; height: 40vmax;
    right: -12vmax; top: 18vh;
    background: radial-gradient(circle, var(--aqua), transparent 65%);
    animation: drift-b 30s ease-in-out infinite alternate;
  }

  .orb.c {
    width: 34vmax; height: 34vmax;
    left: 18vw; bottom: -16vmax;
    background: radial-gradient(circle, var(--amber), transparent 65%);
    opacity: 0.55;
    animation: drift-c 34s ease-in-out infinite alternate;
  }

  .orb.d {
    width: 22vmax; height: 22vmax;
    right: 14vw; bottom: 6vh;
    background: radial-gradient(circle, var(--rose), transparent 65%);
    opacity: 0.4;
  }

  @keyframes drift-a { to { transform: translate(8vmax, 10vmax) scale(1.08); } }
  @keyframes drift-b { to { transform: translate(-9vmax, -6vmax) scale(1.1); } }
  @keyframes drift-c { to { transform: translate(10vmax, -8vmax) scale(0.94); } }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(28px, 6vw, 72px) 16px 72px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.25rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
  }

  .lede {
    margin: 8px 0 0;
    color: var(--text-dim);
    font-size: 1rem;
  }

  /* Main glass surface */
  .glass {
    width: min(960px, 100%);
    padding: clamp(18px, 3.5vw, 36px);
    background:
      linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    box-shadow:
      var(--glass-shadow),
      inset 0 1px 0 var(--glass-highlight),
      inset 0 -1px 0 rgba(255, 255, 255, 0.06);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    backdrop-filter: blur(22px) saturate(160%);
  }

  /* Widget mount point */
  #r4-widget-form {
    min-height: 120px;
    color: var(--text);
  }

  /* Hidden as requested */
  .col-md-8.col-md-offset-2,
  .col-md-8,
  .col-md-offset-2 {
    display: none !important;
  }

  /* Give whatever the widget renders a matching glass look */
  #r4-widget-form h1,
  #r4-widget-form h2,
  #r4-widget-form h3,
  #r4-widget-form h4 {
    color: var(--text);
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  #r4-widget-form p,
  #r4-widget-form label,
  #r4-widget-form li,
  #r4-widget-form td,
  #r4-widget-form th,
  #r4-widget-form span {
    color: inherit;
  }

  #r4-widget-form a {
    color: var(--focus);
    text-underline-offset: 3px;
  }

  #r4-widget-form input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]),
  #r4-widget-form select,
  #r4-widget-form textarea {
    width: 100%;
    padding: 12px 16px;
    font: inherit;
    color: var(--text);
    background: var(--glass-field);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    outline: none;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
  }

  #r4-widget-form input::placeholder,
  #r4-widget-form textarea::placeholder {
    color: rgba(241, 246, 250, 0.45);
  }

  #r4-widget-form select option {
    color: #10283a;
  }

  #r4-widget-form input:focus,
  #r4-widget-form select:focus,
  #r4-widget-form textarea:focus {
    background: var(--glass-strong);
    border-color: var(--focus);
    box-shadow: 0 0 0 3px rgba(159, 243, 234, 0.22);
  }

  #r4-widget-form button,
  #r4-widget-form input[type="submit"],
  #r4-widget-form input[type="button"],
  #r4-widget-form .btn {
    padding: 12px 22px;
    font: inherit;
    font-weight: 600;
    color: #06202a;
    background: linear-gradient(135deg, var(--aqua), #7ce9dc);
    border: 1px solid rgba(255, 255, 255, 0.5);
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(52, 211, 196, 0.28), inset 0 1px 0 rgba(255,255,255,0.5);
    transition: filter 0.2s, transform 0.05s;
  }

  #r4-widget-form button:hover,
  #r4-widget-form input[type="submit"]:hover,
  #r4-widget-form input[type="button"]:hover,
  #r4-widget-form .btn:hover {
    filter: brightness(1.07);
  }

  #r4-widget-form button:active,
  #r4-widget-form input[type="submit"]:active,
  #r4-widget-form .btn:active {
    transform: scale(0.98);
  }

  #r4-widget-form table {
    width: 100%;
    border-collapse: collapse;
    background: var(--glass-field);
    border-radius: 16px;
    overflow: hidden;
  }

  #r4-widget-form th,
  #r4-widget-form td {
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
  }

  #r4-widget-form th {
    background: rgba(255, 255, 255, 0.08);
    font-weight: 600;
  }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  @media (max-width: 600px) {
    .glass { border-radius: 22px; }
    .orb { filter: blur(50px); }
  }

  /* Browsers without backdrop-filter get a more opaque pane so text stays readable */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: rgba(16, 40, 58, 0.88); }
  }

  @media (prefers-reduced-motion: reduce) {
    .orb { animation: none; }
  }
</style>
</head>

<body>

<div class="orbs" aria-hidden="true">
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>
  <div class="orb d"></div>
</div>

<main>
  <section class="glass">    
    <script async src="https://www-vpn.360-search.com/widget/widget.js" data-id="r4-widget-connection"></script>
    <div id="r4-widget-form"></div>
  </section>
</main>

</body>
</html>
