<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>360 Current</title>
<link rel="icon" type="image/png" href="/favicon-32x32.png"/>
<meta name="theme-color" content="#3b82f6"/>
<link rel="stylesheet" href="/assets/css/apps-ui.css"/>
<link rel="stylesheet" href="/assets/css/mobile-nav.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
html,body{overflow:hidden}
.app{display:flex;height:100vh;height:100dvh}
.sb{width:300px;flex-shrink:0;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
.sb-head{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sb-head a{color:var(--muted);text-decoration:none;font-size:13px}
.sb-title{font-size:18px;font-weight:700;letter-spacing:-.02em;flex:1}
.sb-title span{color:var(--a)}
.round{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;transition:border-color .2s var(--ease),color .2s var(--ease)}
.round:hover{border-color:var(--a);color:var(--a)}
.round svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb-search{padding:10px 12px;border-bottom:1px solid var(--line)}
.conv-list{flex:1;overflow-y:auto;padding:6px}
.conv{display:flex;align-items:center;gap:11px;padding:9px 10px;cursor:pointer;border-radius:10px;transition:background .15s var(--ease)}
.conv:hover{background:var(--panel-hover)}
.conv.active{background:var(--a-soft)}
.conv .dot{position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--panel)}
.conv-info{flex:1;min-width:0}
.conv-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-prev{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.conv-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.conv-time{font-size:11px;color:var(--muted)}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--a);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.sb-foot{padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.me-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-st{font-size:11px;color:var(--green)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:40px}
.empty h2{font-size:20px;color:var(--text)}
.empty p{font-size:14px;line-height:1.6}
.chat-hdr{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--bg);flex-shrink:0}
.hdr-info{flex:1;min-width:0}
.hdr-name{font-size:15px;font-weight:700}
.hdr-sub{font-size:12px;color:var(--muted)}
.hdr-acts{display:flex;gap:8px}
.mob-back{display:none}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.date-div{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:11px;color:var(--muted)}
.date-div::before,.date-div::after{content:'';flex:1;height:1px;background:var(--line)}
.row{display:flex;gap:8px;padding:2px 0}
.row.me{flex-direction:row-reverse}
.col{display:flex;flex-direction:column;max-width:70%;gap:3px}
.row.me .col{align-items:flex-end}
.bubble{padding:9px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word;position:relative}
.me .bubble{background:var(--me);color:var(--me-text);border-bottom-right-radius:4px}
.them .bubble{background:var(--them);border-bottom-left-radius:4px}
.bubble img.pic{max-width:240px;max-height:240px;border-radius:10px;display:block;cursor:zoom-in}
.bubble a.file{display:flex;align-items:center;gap:8px;font-size:13px;color:inherit;text-decoration:none}
.react-bar{position:absolute;top:-34px;right:6px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 8px;display:flex;gap:4px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5;white-space:nowrap}
.me .react-bar{right:auto;left:6px}
.bubble:hover .react-bar{opacity:1;pointer-events:auto}
.rq{font-size:17px;cursor:pointer;border:none;background:none;line-height:1}
.rq:hover{transform:scale(1.2)}
.quote{background:rgba(127,127,127,.15);border-left:3px solid var(--a);border-radius:6px;padding:4px 9px;margin-bottom:6px;font-size:12px;opacity:.85}
.reactions{display:flex;flex-wrap:wrap;gap:4px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1px 7px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px}
.rc.mine{background:var(--a-soft);border-color:var(--a)}
.rc small{font-size:11px;color:var(--muted)}
.meta{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);padding:0 4px}
.meta .read{color:var(--a)}
.typing{display:flex;gap:4px;padding:8px 14px;background:var(--them);border-radius:16px;border-bottom-left-radius:4px;width:fit-content;margin-top:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1.2s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.35}40%{opacity:1}}
.inp-area{padding:12px 16px;border-top:1px solid var(--line);background:var(--bg);flex-shrink:0}
.strip{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:12px;color:var(--muted)}
.strip button{margin-left:auto;border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px}
.inp-row{display:flex;align-items:flex-end;gap:8px}
textarea.msg-in{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:9px 16px;font-size:14px;outline:none;resize:none;line-height:1.4;max-height:120px;overflow-y:auto;transition:border-color .2s var(--ease)}
textarea.msg-in:focus{border-color:var(--a)}
textarea.msg-in::placeholder{color:var(--muted)}
.send{background:var(--a);border-color:var(--a);color:#fff}
.send:hover{color:#fff;filter:brightness(1.08)}
.send:disabled{opacity:.4;cursor:default}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:950;display:none;align-items:center;justify-content:center}
.lightbox.show{display:flex}
.lightbox img{max-width:92vw;max-height:92vh;border-radius:8px}
.res{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.res:hover{background:var(--panel-hover)}
.err{font-size:12px;color:var(--danger);min-height:16px}
@media(max-width:700px){
  .sb{position:fixed;left:0;top:0;bottom:0;z-index:100;width:min(320px,88vw);transform:translateX(-100%);transition:transform .25s var(--ease)}
  .sb.open{transform:translateX(0)}
  .mob-back{display:flex}
  .col{max-width:82%}
}
</style>
</head>
<body>
<script>try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark');}catch(e){}</script>
<div class="app" id="app">
  <aside class="sb" id="sb">
    <div class="sb-head">
      <a href="/apps" title="Apps">←</a>
      <div class="sb-title">Cur<span>rent</span></div>
      <button class="round" id="newBtn" title="New message">+</button>
    </div>
    <div class="sb-search"><input class="ui-input" id="searchIn" placeholder="Search" autocomplete="off"/></div>
    <div class="conv-list" id="convList"></div>
    <div class="sb-foot">
      <div class="ui-avatar" id="meAv" style="width:34px;height:34px;font-size:13px">?</div>
      <div style="flex:1;min-width:0"><div class="me-name" id="meName">Signed out</div><div class="me-st">Online</div></div>
      <a class="round" href="/apps/WebCell" title="WebCell" style="text-decoration:none"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92Z"/></svg></a>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="empty" id="emptyState">
      <h2>Current</h2>
      <p>Messages, photos, voice and video calls.<br/>Press + to start a conversation.</p>
    </div>
  </main>
</div>

<div class="ui-modal-ov" id="newModal">
  <div class="ui-modal">
    <h3>New message</h3>
    <input class="ui-input" id="newSearch" placeholder="Search by username" autocomplete="off"/>
    <div id="userResults" style="max-height:230px;overflow-y:auto"></div>
    <div class="err" id="newErr"></div>
    <div style="display:flex;justify-content:flex-end"><button class="ui-btn" id="newCancel">Close</button></div>
  </div>
</div>
<div class="lightbox" id="lb"><img id="lbImg" src="" alt=""/></div>
<input type="file" id="fileIn" style="display:none" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt"/>
<div class="ui-toast" id="toast"></div>

<script src="/assets/js/webcall.js"></script>
<script>
const SB_URL='https://wiswfpfsjiowtrdyqpxy.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpc3dmcGZzamlvd3RyZHlxcHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMzg4OTcsImV4cCI6MjA4MzkxNDg5N30.z_4FtM2c8UwgrRlafPYjolQuod4IoHQats95XHio1zM';
const sb=supabase.createClient(SB_URL,SB_ANON);
const BUCKET='chat-uploads';

let me=null,myProfile=null,convs=[],msgs=[],activeId=null,replyTo=null,pendingFile=null;
let msgCh=null,presCh=null,online=new Set(),q='',typingT=null,lastTypingSent=0;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const ICON={
  phone:'<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92Z"/></svg>',
  video:'<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',
  clip:'<svg viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>',
  send:'<svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>'
};
function toast(m,d=3000){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),d);}
window.toast=toast;
function timeAgo(iso){
  if(!iso)return'';const d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60)return'now';if(d<3600)return Math.floor(d/60)+'m';if(d<86400)return Math.floor(d/3600)+'h';
  return new Date(iso).toLocaleDateString([],{month:'short',day:'numeric'});
}
const fmtTime=iso=>iso?new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  me=session?.user||null;
  if(!me){location.replace('/accounts?from='+encodeURIComponent(location.href));return;}
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT')location.replace('/accounts?from='+encodeURIComponent(location.href));});
  const {data}=await sb.from('profiles').select('id,username,avatar_url').eq('id',me.id).maybeSingle();
  myProfile=data||{id:me.id,username:(me.email||'user').split('@')[0]};
  $('meName').textContent=myProfile.username;
  $('meAv').textContent=ini(myProfile.username);
  WebCall.init({sb,userId:me.id,name:myProfile.username});
  await loadConvs();
  subscribePresence();
  const u=new URLSearchParams(location.search).get('user')||new URLSearchParams(location.search).get('call');
  if(u)openWith(u);
}

async function openWith(key){
  const isId=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(key);
  const {data}=isId
    ?await sb.from('profiles').select('id,username').eq('id',key).maybeSingle()
    :await sb.from('profiles').select('id,username').ilike('username',key).limit(1).maybeSingle();
  if(data&&data.id!==me.id)startDM(data.id);
  else toast('User not found');
}

async function loadConvs(){
  const {data:rows}=await sb.from('msg_conversations').select('*').contains('participant_ids',[me.id]).order('updated_at',{ascending:false});
  if(!rows?.length){convs=[];renderConvList();return;}
  const otherIds=[...new Set(rows.flatMap(c=>c.participant_ids.filter(i=>i!==me.id)))];
  const {data:profs}=otherIds.length?await sb.from('profiles').select('id,username,avatar_url').in('id',otherIds):{data:[]};
  const pm=Object.fromEntries((profs||[]).map(p=>[p.id,p]));
  const ids=rows.map(c=>c.id);
  const {data:last}=await sb.from('msg_messages').select('conv_id,body,image_url,file_name,sender_id,created_at').in('conv_id',ids).order('created_at',{ascending:false}).limit(400);
  const lm={};(last||[]).forEach(m=>{if(!lm[m.conv_id])lm[m.conv_id]=m;});
  const {data:unread}=await sb.from('msg_messages').select('conv_id').in('conv_id',ids).neq('sender_id',me.id).not('read_by','cs',`{${me.id}}`);
  const um={};(unread||[]).forEach(m=>{um[m.conv_id]=(um[m.conv_id]||0)+1;});
  convs=rows.map(c=>{
    const oid=c.participant_ids.find(i=>i!==me.id)||c.participant_ids[0];
    const p=pm[oid]||{};const l=lm[c.id];
    return{id:c.id,oid,name:c.name||p.username||'User',avatar:p.avatar_url,
      lastMsg:l?(l.image_url?'Photo':l.file_name?l.file_name:l.body||''):'',lastTime:l?.created_at||c.updated_at,unread:um[c.id]||0};
  });
  renderConvList();
}

function renderConvList(){
  const el=$('convList');
  const list=q?convs.filter(c=>c.name.toLowerCase().includes(q)):convs;
  if(!list.length){el.innerHTML=`<div style="padding:22px;text-align:center;font-size:13px;color:var(--muted)">${convs.length?'No matches.':'No conversations yet.'}</div>`;return;}
  el.innerHTML=list.map(c=>`<div class="conv${c.id===activeId?' active':''}" data-id="${c.id}">
    <div class="ui-avatar" style="width:42px;height:42px;font-size:15px">${esc(ini(c.name))}${c.avatar?`<img src="${esc(c.avatar)}" alt="">`:''}${online.has(c.oid)?'<span class="dot"></span>':''}</div>
    <div class="conv-info"><div class="conv-name">${esc(c.name)}</div><div class="conv-prev">${esc(c.lastMsg)}</div></div>
    <div class="conv-meta"><div class="conv-time">${timeAgo(c.lastTime)}</div>${c.unread?`<div class="badge">${c.unread}</div>`:''}</div>
  </div>`).join('');
  el.querySelectorAll('.conv').forEach(n=>n.onclick=()=>openConv(n.dataset.id));
}

function clearChat(){
  ['chatHdr','msgsList','inpArea'].forEach(id=>{const e=$(id);if(e)e.remove();});
  if(msgCh){sb.removeChannel(msgCh);msgCh=null;}
}
function showEmpty(){clearChat();$('emptyState').style.display='flex';}

async function callPeer(conv,video){
  WebCall.call({id:conv.oid,name:conv.name},video);
}

async function openConv(id){
  const conv=convs.find(c=>c.id===id);if(!conv)return;
  activeId=id;replyTo=null;pendingFile=null;
  $('sb').classList.remove('open');
  $('emptyState').style.display='none';
  clearChat();
  const hdr=document.createElement('div');hdr.className='chat-hdr';hdr.id='chatHdr';
  hdr.innerHTML=`<button class="round mob-back" id="mobBack">←</button>
    <div class="ui-avatar" style="width:38px;height:38px;font-size:14px">${esc(ini(conv.name))}${conv.avatar?`<img src="${esc(conv.avatar)}" alt="">`:''}</div>
    <div class="hdr-info"><div class="hdr-name">${esc(conv.name)}</div><div class="hdr-sub" id="hdrSub">${online.has(conv.oid)?'Active now':''}</div></div>
    <div class="hdr-acts">
      <button class="round" id="callBtn" title="Voice call">${ICON.phone}</button>
      <button class="round" id="vidBtn" title="Video call">${ICON.video}</button>
    </div>`;
  $('main').appendChild(hdr);
  const mw=document.createElement('div');mw.className='msgs';mw.id='msgsList';$('main').appendChild(mw);
  const ia=document.createElement('div');ia.className='inp-area';ia.id='inpArea';
  ia.innerHTML=`<div class="strip" id="replyBar" style="display:none"><span id="replyTxt"></span><button id="replyX">✕</button></div>
    <div class="strip" id="upPrev" style="display:none"><span id="upName"></span><button id="upX">✕</button></div>
    <div class="inp-row">
      <button class="round" id="attBtn" title="Attach">${ICON.clip}</button>
      <textarea class="msg-in" id="msgIn" rows="1" placeholder="Message" maxlength="4000"></textarea>
      <button class="round send" id="sendBtn" title="Send">${ICON.send}</button>
    </div>`;
  $('main').appendChild(ia);

  $('mobBack').onclick=()=>{$('sb').classList.add('open');};
  $('callBtn').onclick=()=>callPeer(conv,false);
  $('vidBtn').onclick=()=>callPeer(conv,true);
  $('sendBtn').onclick=send;
  $('msgIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  $('msgIn').addEventListener('input',()=>{const t=$('msgIn');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';sendTyping();});
  $('msgIn').addEventListener('paste',e=>{
    const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith('image/'));
    if(f){e.preventDefault();stage(f);}
  });
  $('attBtn').onclick=()=>$('fileIn').click();
  $('upX').onclick=()=>{pendingFile=null;$('upPrev').style.display='none';};
  $('replyX').onclick=()=>{replyTo=null;$('replyBar').style.display='none';};

  await loadMsgs(id);
  markRead(id);
  subscribeMessages(id);
  renderConvList();
  $('msgIn').focus();
}

async function loadMsgs(id){
  const {data}=await sb.from('msg_messages').select('*').eq('conv_id',id).order('created_at',{ascending:true}).limit(150);
  msgs=data||[];renderMsgs();scrollBot(false);
}

function renderMsgs(){
  const el=$('msgsList');if(!el)return;
  const stick=el.scrollHeight-el.scrollTop-el.clientHeight<80;
  if(!msgs.length){el.innerHTML='<div style="text-align:center;color:var(--muted);font-size:13px;padding:24px">No messages yet. Say hello.</div>';return;}
  let html='',lastDate='';
  const quick=['❤️','😂','👍','😮','😢'];
  msgs.forEach((m,i)=>{
    const mine=m.sender_id===me.id;
    const day=new Date(m.created_at).toDateString();
    if(day!==lastDate){
      html+=`<div class="date-div">${day===new Date().toDateString()?'Today':new Date(m.created_at).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</div>`;
      lastDate=day;
    }
    const next=msgs[i+1];
    const lastInGroup=!next||next.sender_id!==m.sender_id||new Date(next.created_at).toDateString()!==day;
    let content='';
    if(m.reply_to){const p=msgs.find(x=>x.id===m.reply_to);if(p)content+=`<div class="quote">${esc((p.body||p.file_name||'Photo').slice(0,70))}</div>`;}
    if(m.image_url)content+=`<img class="pic" src="${esc(m.image_url)}" alt="" data-lb="${esc(m.image_url)}"/>`;
    else if(m.file_url)content+=`<a class="file" href="${esc(m.file_url)}" target="_blank" rel="noopener">${ICON.clip.replace('<svg','<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"')}${esc(m.file_name||'File')}</a>`;
    if(m.body)content+=(content?'<div style="margin-top:6px"></div>':'')+esc(m.body).replace(/\n/g,'<br>');
    const rmap=m.reactions||{};
    const reacts=Object.keys(rmap).length?`<div class="reactions">${Object.entries(rmap).map(([e,u])=>`<div class="rc${u.includes(me.id)?' mine':''}" data-msg="${m.id}" data-e="${e}">${e}<small>${u.length}</small></div>`).join('')}</div>`:'';
    const read=Array.isArray(m.read_by)&&m.read_by.some(x=>x!==me.id);
    html+=`<div class="row ${mine?'me':'them'}">
      <div class="col">
        <div class="bubble" data-id="${m.id}"><div class="react-bar">${quick.map(e=>`<button class="rq" data-msg="${m.id}" data-e="${e}">${e}</button>`).join('')}</div>${content}</div>
        ${reacts}
        ${lastInGroup?`<div class="meta">${fmtTime(m.created_at)}${mine?`<span class="${read?'read':''}">${read?'Seen':'Sent'}</span>`:''}</div>`:''}
      </div></div>`;
  });
  el.innerHTML=html;
  el.querySelectorAll('.rq').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleReact(b.dataset.msg,b.dataset.e);});
  el.querySelectorAll('.rc').forEach(c=>c.onclick=()=>toggleReact(c.dataset.msg,c.dataset.e));
  el.querySelectorAll('.bubble').forEach(b=>b.addEventListener('dblclick',()=>setReply(b.dataset.id)));
  el.querySelectorAll('[data-lb]').forEach(img=>img.onclick=()=>{$('lbImg').src=img.dataset.lb;$('lb').classList.add('show');});
  if(stick)scrollBot(false);
}
function scrollBot(smooth=true){const el=$('msgsList');if(el)el.scrollTo({top:el.scrollHeight,behavior:smooth?'smooth':'auto'});}

function stage(f){
  if(f.size>25*1024*1024){toast('Max file size is 25 MB');return;}
  pendingFile=f;
  $('upName').textContent=f.name;
  $('upPrev').style.display='flex';
}
$('fileIn').onchange=e=>{const f=e.target.files[0];if(f)stage(f);e.target.value='';};

async function upload(file){
  const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=`${me.id}/current-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext||'bin'}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});
  if(error)throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

async function send(){
  if(!activeId)return;
  const ta=$('msgIn');const body=ta.value.trim();
  if(!body&&!pendingFile)return;
  const btn=$('sendBtn');btn.disabled=true;
  let image_url=null,file_url=null,file_name=null;
  if(pendingFile){
    try{
      const url=await upload(pendingFile);
      if(pendingFile.type.startsWith('image/'))image_url=url;else{file_url=url;file_name=pendingFile.name;}
    }catch(e){toast('Upload failed: '+(e.message||'error'));btn.disabled=false;return;}
  }
  const {data,error}=await sb.from('msg_messages').insert({conv_id:activeId,sender_id:me.id,body:body||null,image_url,file_url,file_name,reply_to:replyTo||null,read_by:[me.id]}).select().single();
  btn.disabled=false;
  if(error){toast('Could not send: '+error.message);return;}
  ta.value='';ta.style.height='auto';
  pendingFile=null;$('upPrev').style.display='none';
  replyTo=null;$('replyBar').style.display='none';
  if(!msgs.find(x=>x.id===data.id))msgs.push(data);
  renderMsgs();scrollBot();
  await sb.from('msg_conversations').update({updated_at:new Date().toISOString()}).eq('id',activeId);
  loadConvs();
}

function setReply(id){
  const m=msgs.find(x=>x.id===id);if(!m||!$('replyBar'))return;
  replyTo=id;
  $('replyTxt').textContent='Replying to: '+(m.body||m.file_name||'Photo').slice(0,60);
  $('replyBar').style.display='flex';$('msgIn').focus();
}

async function toggleReact(id,emoji){
  const m=msgs.find(x=>x.id===id);if(!m)return;
  const map={...(m.reactions||{})};const u=[...(map[emoji]||[])];
  const i=u.indexOf(me.id);if(i>=0)u.splice(i,1);else u.push(me.id);
  if(u.length)map[emoji]=u;else delete map[emoji];
  m.reactions=map;renderMsgs();
  const {error}=await sb.rpc('msg_toggle_reaction',{p_msg_id:id,p_emoji:emoji});
  if(error){toast('Could not react');loadMsgs(activeId);}
}

function sendTyping(){
  if(!msgCh||Date.now()-lastTypingSent<1500)return;
  lastTypingSent=Date.now();
  msgCh.send({type:'broadcast',event:'typing',payload:{uid:me.id}});
}
function showTyping(uid){
  if(uid===me.id)return;
  const el=$('msgsList');if(!el)return;
  let t=el.querySelector('.typing');
  if(!t){t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';el.appendChild(t);scrollBot();}
  clearTimeout(typingT);typingT=setTimeout(()=>t.remove(),2500);
}

function subscribeMessages(id){
  if(msgCh)sb.removeChannel(msgCh);
  msgCh=sb.channel('current-conv-'+id);
  msgCh
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'msg_messages',filter:`conv_id=eq.${id}`},p=>{
      const m=p.new;if(msgs.find(x=>x.id===m.id))return;
      msgs.push(m);renderMsgs();scrollBot();
      if(m.sender_id!==me.id)markRead(id);
      loadConvs();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'msg_messages',filter:`conv_id=eq.${id}`},p=>{
      const i=msgs.findIndex(x=>x.id===p.new.id);if(i>=0){msgs[i]={...msgs[i],...p.new};renderMsgs();}
    })
    .on('broadcast',{event:'typing'},({payload})=>showTyping(payload.uid))
    .subscribe();
}

function subscribePresence(){
  if(presCh)sb.removeChannel(presCh);
  presCh=sb.channel('current-presence',{config:{presence:{key:me.id}}});
  presCh.on('presence',{event:'sync'},()=>{
    online=new Set(Object.keys(presCh.presenceState()));renderConvList();
    const c=convs.find(x=>x.id===activeId),sub=$('hdrSub');
    if(c&&sub)sub.textContent=online.has(c.oid)?'Active now':'';
  }).subscribe(async s=>{if(s==='SUBSCRIBED')await presCh.track({uid:me.id});});
}

async function markRead(id){
  await sb.rpc('mark_msg_read',{p_conv_id:id,p_user_id:me.id});
  const c=convs.find(x=>x.id===id);if(c){c.unread=0;renderConvList();}
}

$('newBtn').onclick=()=>{
  $('newModal').classList.add('show');$('newSearch').value='';$('userResults').innerHTML='';$('newErr').textContent='';
  setTimeout(()=>$('newSearch').focus(),40);
};
$('newCancel').onclick=()=>$('newModal').classList.remove('show');
$('newModal').addEventListener('click',e=>{if(e.target===$('newModal'))$('newModal').classList.remove('show');});
let sd=null;
$('newSearch').addEventListener('input',()=>{clearTimeout(sd);sd=setTimeout(async()=>{
  const s=$('newSearch').value.trim().replace(/[%_,()]/g,'');
  if(s.length<2){$('userResults').innerHTML='';return;}
  const {data}=await sb.from('profiles').select('id,username,avatar_url').ilike('username','%'+s+'%').neq('id',me.id).limit(10);
  $('userResults').innerHTML=(data||[]).map(u=>`<div class="res" data-id="${u.id}">
    <div class="ui-avatar" style="width:30px;height:30px;font-size:12px">${esc(ini(u.username))}</div><span>${esc(u.username)}</span></div>`).join('')||'<div style="font-size:13px;color:var(--muted);padding:8px">No users found.</div>';
  $('userResults').querySelectorAll('.res').forEach(r=>r.onclick=()=>startDM(r.dataset.id));
},280);});

async function startDM(oid){
  $('newModal').classList.remove('show');
  let ex=convs.find(c=>c.oid===oid&&true);
  if(ex){openConv(ex.id);return;}
  const {data,error}=await sb.from('msg_conversations').insert({participant_ids:[me.id,oid],updated_at:new Date().toISOString()}).select().single();
  if(error){toast('Could not start conversation: '+error.message);return;}
  await sb.from('msg_contacts').upsert({user_id:me.id,contact_id:oid},{onConflict:'user_id,contact_id'});
  await loadConvs();openConv(data.id);
}

$('searchIn').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();renderConvList();});
$('lb').addEventListener('click',()=>$('lb').classList.remove('show'));

let tx=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx;
  if(dx>70&&tx<40)$('sb').classList.add('open');
  if(dx<-70)$('sb').classList.remove('open');
},{passive:true});

init();
</script>
<script src="/assets/js/mobile-nav.js" defer></script>
</body>
</html>
