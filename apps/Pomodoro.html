  <style>

    *, *::before, *::after { box-sizing: border-box; }

    /* ── shell tokens — light/dark, same pattern as ai.css ── */
    .pm-shell {
      --pm-bg:      var(--bg);
      --pm-txt:     var(--txt);
      --pm-mut:     var(--mut);
      --pm-br:      var(--br);
      --pm-surface: rgba(255,255,255,.7);
      --pm-soft:    rgba(17,24,39,.04);
      --pm-hover:   rgba(17,24,39,.06);
      --pm-panel:   rgba(255,255,255,.78);
      --pm-line:    rgba(15,23,42,.09);
      --pm-shadow:  0 20px 60px rgba(15,23,42,.12);
    }
    body.dark .pm-shell {
      --pm-bg:      var(--bgd);
      --pm-txt:     var(--txtd);
      --pm-mut:     var(--mutd);
      --pm-br:      rgba(255,255,255,.09);
      --pm-surface: rgba(20,22,32,.7);
      --pm-soft:    rgba(255,255,255,.055);
      --pm-hover:   rgba(255,255,255,.08);
      --pm-panel:   rgba(12,14,22,.72);
      --pm-line:    rgba(255,255,255,.09);
      --pm-shadow:  0 20px 60px rgba(0,0,0,.28);
    }

    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
    }

    .pm-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: var(--pm-bg);
      color: var(--pm-txt);
      font-size: 14px;
    }
    .pm-shell svg { display: block; }

    /* ── topbar — mirrors ai-topbar ── */
    .pm-topbar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px 0 80px;
      border-bottom: 1px solid var(--pm-line);
      background: var(--pm-panel);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .pm-topbar-left  { display:flex; align-items:center; gap:8px; flex:1; }
    .pm-topbar-right { display:flex; align-items:center; gap:8px; justify-content:flex-end; }

    .pm-brand {
      display: flex; align-items: center; gap: 9px; flex-shrink: 0;
    }
    .pm-brand-mark {
      width: 28px; height: 28px; border-radius: 9px;
      background: linear-gradient(135deg, var(--a), var(--a2));
      box-shadow: 0 8px 24px rgba(var(--a-rgb, 59,130,246),.24);
      display: flex; align-items: center; justify-content: center;
      color: #fff; flex-shrink: 0;
    }
    .pm-brand-text { font-size: 15px; font-weight: 700; letter-spacing: .01em; }

    .pm-topbar-link {
      display: flex; align-items: center; gap: 5px;
      text-decoration: none; color: var(--pm-txt);
      font-size: 12px; font-weight: 500;
      padding: 6px 12px; border-radius: 10px;
      border: 1px solid var(--pm-line);
      background: var(--pm-soft);
      opacity: .85; transition: background .15s;
    }
    .pm-topbar-link:hover { background: var(--pm-hover); opacity: 1; }

    /* ── main ── */
    .pm-main { flex: 1; display: flex; min-height: 0; }

    /* ── sidebar — mirrors #ai-sidebar ── */
    .pm-sidebar {
      width: 234px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--pm-panel);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border-right: 1px solid var(--pm-line);
      box-shadow: 8px 0 35px rgba(0,0,0,.06);
      overflow: hidden;
      padding-top: 46px; /* clear global ☰ button */
    }
    .pm-sidebar-inner {
      flex: 1; overflow-y: auto;
      padding: 12px 9px;
      display: flex; flex-direction: column; gap: 18px;
    }

    .pm-section-title {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: .08em; opacity: .5;
      margin-bottom: 6px;
    }

    /* mode buttons */
    .pm-mode-btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 9px 10px;
      border-radius: 10px; border: 1px solid transparent;
      background: transparent; color: var(--pm-txt);
      font-size: 13px; font-family: inherit;
      cursor: pointer; text-align: left; opacity: .75;
      transition: background .15s, opacity .15s;
    }
    .pm-mode-btn:hover { background: var(--pm-hover); opacity: 1; }
    .pm-mode-btn.active {
      background: linear-gradient(90deg, rgba(var(--a-rgb,59,130,246),.14), rgba(var(--a-rgb,59,130,246),.05));
      border-color: rgba(var(--a-rgb,59,130,246),.28);
      box-shadow: inset 2px 0 0 var(--a);
      color: var(--a); opacity: 1;
    }
    .pm-mode-dur { font-size: 11px; opacity: .6; }
    .pm-mode-btn.active .pm-mode-dur { opacity: .85; }

    /* settings inputs */
    .pm-setting {
      display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
      padding: 3px 2px;
    }
    .pm-setting label { font-size: 12px; opacity: .7; }
    .pm-setting input[type=number] {
      width: 52px; padding: 4px 8px;
      border-radius: 7px;
      border: 1px solid var(--pm-line);
      background: var(--pm-soft);
      color: var(--pm-txt);
      font-size: 12px; text-align: center;
      font-family: inherit;
    }
    .pm-setting input[type=number]:focus {
      outline: none; border-color: var(--a);
    }

    .pm-toggle {
      display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
      padding: 3px 2px;
    }
    .pm-toggle label { font-size: 12px; opacity: .7; cursor: pointer; }
    .pm-toggle input[type=checkbox] { accent-color: var(--a); cursor: pointer; }

    /* session log */
    .pm-log { display: flex; flex-direction: column; gap: 3px; }
    .pm-log-item {
      font-size: 11px; padding: 5px 7px;
      border-radius: 7px;
      background: var(--pm-soft);
      color: var(--pm-mut);
      display: flex; justify-content: space-between; gap: 6px;
    }
    .pm-log-item.focus { color: var(--a); }
    .pm-log-item.break { opacity: .7; }
    .pm-log-empty { font-size: 11px; opacity: .4; padding: 4px 7px; }

    /* ── center content ── */
    .pm-content {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      position: relative; padding: 24px;
      /* subtle radial gradient same as ai page bg */
      background: transparent;
    }
    body.dark .pm-content {
      background: radial-gradient(circle at 50% 0%, rgba(var(--a-rgb,59,130,246),.04), transparent 60%);
    }

    .pm-mode-label {
      font-size: 12px; letter-spacing: .12em;
      text-transform: uppercase; opacity: .45;
      margin-bottom: 30px;
    }

    /* ring */
    .pm-ring-wrap {
      position: relative; width: 256px; height: 256px; flex-shrink: 0;
    }
    .pm-ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .pm-ring-bg  { fill: none; stroke: var(--pm-line); stroke-width: 8; }
    .pm-ring-fg  {
      fill: none; stroke: var(--a); stroke-width: 8; stroke-linecap: round;
      transition: stroke-dashoffset .6s linear, stroke .4s;
    }
    .pm-ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
    }
    .pm-time {
      font-size: 56px; font-weight: 300;
      letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1;
      color: var(--pm-txt);
    }
    .pm-rounds { font-size: 11px; opacity: .4; letter-spacing: .07em; text-transform: uppercase; }

    /* controls */
    .pm-controls { display: flex; align-items: center; gap: 12px; margin-top: 30px; }
    .pm-ctrl {
      width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid var(--pm-line);
      background: var(--pm-soft);
      color: var(--pm-txt);
      font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, border-color .15s;
    }
    .pm-ctrl:hover { background: var(--pm-hover); border-color: var(--pm-br); }
    .pm-ctrl-primary {
      width: 62px; height: 62px; font-size: 20px;
      background: linear-gradient(135deg, var(--a), var(--a2));
      border: none; color: #fff;
      box-shadow: 0 7px 20px rgba(var(--a-rgb,59,130,246),.3);
      transition: transform .15s, opacity .15s, box-shadow .15s;
    }
    .pm-ctrl-primary:hover {
      opacity: .92; transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(var(--a-rgb,59,130,246),.4);
    }

    /* task input */
    .pm-task-wrap { margin-top: 34px; width: 100%; max-width: 380px; }
    .pm-task-input {
      width: 100%; padding: 11px 16px;
      border-radius: 16px;
      border: 1px solid var(--pm-line);
      background: var(--pm-panel);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      box-shadow: var(--pm-shadow);
      color: var(--pm-txt); font-size: 13.5px;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .pm-task-input:focus {
      outline: none;
      border-color: rgba(var(--a-rgb,59,130,246),.5);
      box-shadow: 0 0 0 3px rgba(var(--a-rgb,59,130,246),.1), var(--pm-shadow);
    }
    .pm-task-input::placeholder { color: var(--pm-mut); opacity: .7; }

    /* stats */
    .pm-stats {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 28px; pointer-events: none;
    }
    .pm-stat { text-align: center; }
    .pm-stat-val { font-size: 19px; font-weight: 500; color: var(--pm-txt); }
    .pm-stat-lbl {
      font-size: 10px; opacity: .38;
      text-transform: uppercase; letter-spacing: .08em; margin-top: 2px;
    }

    /* toast — same as ai.css */
    .pm-toast {
      position: fixed; bottom: 84px; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(17,24,39,.94); color: #f5f5f5;
      padding: 8px 18px; border-radius: 999px;
      font-size: 13px; border: 1px solid rgba(255,255,255,.1);
      pointer-events: none; opacity: 0;
      transition: opacity .2s, transform .2s;
      z-index: 999;
    }
    .pm-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 760px) {
      .pm-sidebar { display: none; }
      .pm-topbar  { padding-left: 60px; }
      .pm-time    { font-size: 44px; }
      .pm-ring-wrap { width: 210px; height: 210px; }
    }
  \
  </style>
</head>

<body class="dark">
  <div class="cursor-dot"></div>

  <div class="pm-shell">
    <div class="pm-topbar">

        <div class="pm-brand">

            <svg fill="currentColor" height="14" viewBox="0 0 24 24" width="14">
              <path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"></path>

          </div>
          <span class="pm-brand-text">Pomodoro</span>

    <div class="pm-main">
      <aside class="pm-sidebar" aria-label="Pomodoro settings">

      <main class="pm-content">
        <div class="pm-mode-label" id="pm-mode-label">Focus</div>

        <div class="pm-ring-wrap" aria-label="Pomodoro timer">
          <svg class="pm-ring-svg" viewBox="0 0 256 256" aria-hidden="true">
            <circle class="pm-ring-bg" cx="128" cy="128" r="112"></circle>
            <circle class="pm-ring-fg" cx="128" cy="128" id="pm-ring" r="112"></circle>

          <div class="pm-ring-center">

        <div class="pm-controls">
          <button class="pm-ctrl" id="btn-restart" type="button" title="Restart timer" aria-label="Restart timer">↺</button>
          <button class="pm-ctrl pm-ctrl-primary" id="btn-play" type="button" title="Start timer" aria-label="Start timer">▶</button>

            id="pm-task"

        <div class="pm-stats" aria-label="Today's statistics">

            <div class="pm-stat-val" id="stat-focus">0m</div>

  <script src="https://360-search.com/assets/js/cursor.js"></script>
  <script>

(() => {
  'use strict';

  const STORAGE_KEYS = {
    settings: 'pm_settings',
    sessions: 'pm_sessions_v2',
    stats: 'pm_stats_v2',
    streak: 'pm_streak_v2',
    lastFocusDate: 'pm_last_focus_date_v2',
    cycleCount: 'pm_cycle_count_v2'
  };

  const defaults = {
    focus: 25,
    short: 5,
    long: 15,
    interval: 4,
    auto: false,
    sound: true
  };

  const bounds = {
    focus: [1, 90],
    short: [1, 30],
    long: [1, 60],
    interval: [2, 10]
  };

  const setFocus = document.getElementById('set-focus');
  const setShort = document.getElementById('set-short');
  const setLong = document.getElementById('set-long');
  const setIntervalInput = document.getElementById('set-interval');
  const togAuto = document.getElementById('tog-auto');
  const togSound = document.getElementById('tog-sound');

  const timeEl = document.getElementById('pm-time');
  const roundsEl = document.getElementById('pm-rounds');
  const ringEl = document.getElementById('pm-ring');
  const modeLabel = document.getElementById('pm-mode-label');
  const btnPlay = document.getElementById('btn-play');
  const btnRestart = document.getElementById('btn-restart');
  const btnSkip = document.getElementById('btn-skip');
  const taskEl = document.getElementById('pm-task');
  const logEl = document.getElementById('pm-log');
  const toastEl = document.getElementById('pm-toast');

  const labelFocus = document.getElementById('lbl-focus');
  const labelShort = document.getElementById('lbl-short');
  const labelLong = document.getElementById('lbl-long');
  const statSessions = document.getElementById('stat-sessions');
  const statFocus = document.getElementById('stat-focus');
  const statStreak = document.getElementById('stat-streak');

  const MODE_NAME = {
    focus: 'Focus',
    short: 'Short Break',
    long: 'Long Break'
  };

  const CIRC = 2 * Math.PI * 112;
  ringEl.style.strokeDasharray = String(CIRC);

  let mode = 'focus';
  let running = false;
  let remaining = 0;
  let total = 0;
  let deadline = 0;
  let timerId = null;
  let cycleFocusCount = loadNumber(STORAGE_KEYS.cycleCount, 0);
  let streak = loadNumber(STORAGE_KEYS.streak, 0);
  let lastFocusDate = localStorage.getItem(STORAGE_KEYS.lastFocusDate) || '';
  let stats = loadStats();
  let sessions = loadSessions();
  let audioContext = null;
  let toastTimer = null;

  function loadNumber(key, fallback) {
    try {
      const value = Number(localStorage.getItem(key));
      return Number.isFinite(value) ? value : fallback;
    } catch {
      return fallback;
    }
  }

  function safeJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      const value = JSON.parse(raw);
      return value ?? fallback;
    } catch {
      return fallback;
    }
  }

  function clampInt(value, min, max, fallback) {
    const n = Number.parseInt(value, 10);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function todayKey(date = new Date()) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function yesterdayKey() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return todayKey(d);
  }

  function loadStats() {
    const saved = safeJSON(STORAGE_KEYS.stats, {});
    return {
      date: saved.date === todayKey() ? saved.date : todayKey(),
      sessions: saved.date === todayKey() ? Math.max(0, Number(saved.sessions) || 0) : 0,
      focusMinutes: saved.date === todayKey() ? Math.max(0, Number(saved.focusMinutes) || 0) : 0
    };
  }

  function loadSessions() {
    const saved = safeJSON(STORAGE_KEYS.sessions, []);
    if (!Array.isArray(saved)) return [];
    return saved
      .filter(item => item && typeof item === 'object')
      .slice(0, 60);
  }

  function cfg() {
    return {
      focus: clampInt(setFocus.value, ...bounds.focus, defaults.focus) * 60,
      short: clampInt(setShort.value, ...bounds.short, defaults.short) * 60,
      long: clampInt(setLong.value, ...bounds.long, defaults.long) * 60,
      interval: clampInt(setIntervalInput.value, ...bounds.interval, defaults.interval)
    };
  }

  function saveSettings() {
    const c = cfg();

    const values = {
      focus: Math.round(c.focus / 60),
      short: Math.round(c.short / 60),
      long: Math.round(c.long / 60),
      interval: c.interval,
      auto: Boolean(togAuto.checked),
      sound: Boolean(togSound.checked)
    };

    setFocus.value = values.focus;
    setShort.value = values.short;
    setLong.value = values.long;
    setIntervalInput.value = values.interval;

    localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(values));
    updateDurationLabels();
  }

  function saveStats() {
    localStorage.setItem(STORAGE_KEYS.stats, JSON.stringify(stats));
  }

  function saveSessions() {
    localStorage.setItem(STORAGE_KEYS.sessions, JSON.stringify(sessions.slice(0, 60)));
  }

  function saveCycle() {
    localStorage.setItem(STORAGE_KEYS.cycleCount, String(cycleFocusCount));
  }

  function applySavedSettings() {
    const saved = safeJSON(STORAGE_KEYS.settings, null);
    if (!saved || typeof saved !== 'object') return;

    if (saved.focus != null) setFocus.value = clampInt(saved.focus, ...bounds.focus, defaults.focus);
    if (saved.short != null) setShort.value = clampInt(saved.short, ...bounds.short, defaults.short);
    if (saved.long != null) setLong.value = clampInt(saved.long, ...bounds.long, defaults.long);
    if (saved.interval != null) setIntervalInput.value = clampInt(saved.interval, ...bounds.interval, defaults.interval);
    if (saved.auto != null) togAuto.checked = Boolean(saved.auto);
    if (saved.sound != null) togSound.checked = Boolean(saved.sound);
  }

  function rolloverStatsIfNeeded() {
    const today = todayKey();
    if (stats.date !== today) {
      stats = { date: today, sessions: 0, focusMinutes: 0 };
      saveStats();
      updateStats();
    }

    const current = todayKey();
    if (lastFocusDate && lastFocusDate !== current && lastFocusDate !== yesterdayKey()) {
      streak = 0;
      localStorage.setItem(STORAGE_KEYS.streak, '0');
    }
  }

  function formatTime(seconds) {
    const safe = Math.max(0, Math.ceil(Number(seconds) || 0));
    const minutes = Math.floor(safe / 60);
    const secs = safe % 60;
    return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }

  function setControls(runningState) {
    running = runningState;
    btnPlay.textContent = running ? '⏸' : '▶';
    btnPlay.title = running ? 'Pause timer' : 'Start timer';
    btnPlay.setAttribute('aria-label', running ? 'Pause timer' : 'Start timer');
  }

  function updateDurationLabels() {
    labelFocus.textContent = `${clampInt(setFocus.value, ...bounds.focus, defaults.focus)}m`;
    labelShort.textContent = `${clampInt(setShort.value, ...bounds.short, defaults.short)}m`;
    labelLong.textContent = `${clampInt(setLong.value, ...bounds.long, defaults.long)}m`;
  }

  function updateStats() {
    rolloverStatsIfNeeded();
    statSessions.textContent = String(stats.sessions);
    statFocus.textContent = `${stats.focusMinutes}m`;
    statStreak.textContent = String(streak);
  }

  function updateRing() {
    const fraction = total > 0 ? Math.max(0, Math.min(1, remaining / total)) : 0;
    ringEl.style.strokeDashoffset = String(CIRC * fraction);
  }

  function render() {
    timeEl.textContent = formatTime(remaining);
    roundsEl.textContent = `Session ${cycleFocusCount + 1}`;
    modeLabel.textContent = MODE_NAME[mode];
    updateRing();
    document.title = `${formatTime(remaining)} · ${MODE_NAME[mode]} — Pomodoro`;
  }

  function stopTimer() {
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
    setControls(false);
  }

  function initMode(nextMode, preserveTask = true) {
    if (!MODE_NAME[nextMode]) return;

    stopTimer();
    mode = nextMode;
    const durations = cfg();
    total = durations[nextMode];
    remaining = total;
    deadline = 0;
    render();

    if (!preserveTask && mode !== 'focus') {
      // Breaks do not need a task, but retaining it during navigation is less surprising.
      taskEl.value = taskEl.value.trim();
    }

    document.querySelectorAll('.pm-mode-btn').forEach(button => {
      button.classList.toggle('active', button.dataset.mode === mode);
    });
  }

  function syncClock() {
    if (!running) return;

    const nextRemaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    if (nextRemaining !== remaining) {
      remaining = nextRemaining;
      render();
    }

    if (remaining <= 0) {
      completeMode();
    }
  }

  function startTimer() {
    if (running) return;

    rolloverStatsIfNeeded();

    if (remaining <= 0) {
      initMode(mode);
    }

    deadline = Date.now() + remaining * 1000;
    setControls(true);

    if (timerId !== null) clearInterval(timerId);
    timerId = window.setInterval(syncClock, 250);
    render();
  }

  function pauseTimer() {
    if (!running) return;

    syncClock();
    stopTimer();
    deadline = 0;
    render();
  }

  function restartTimer() {
    initMode(mode);
    showToast(`${MODE_NAME[mode]} restarted.`);
  }

  function chooseNextAfterFocus() {
    const interval = cfg().interval;
    return cycleFocusCount > 0 && cycleFocusCount % interval === 0 ? 'long' : 'short';
  }

  function chooseNextAfterBreak() {
    return 'focus';
  }

  function updateStreakForToday() {
    const today = todayKey();

    if (lastFocusDate === today) {
      return;
    }

    if (lastFocusDate !== yesterdayKey()) {
      streak = 0;
    }

    streak += 1;
    lastFocusDate = today;

    localStorage.setItem(STORAGE_KEYS.streak, String(streak));
    localStorage.setItem(STORAGE_KEYS.lastFocusDate, lastFocusDate);
  }

  function completeMode() {
    if (!running && remaining > 0) return;

    stopTimer();
    remaining = 0;
    render();

    beep();

    if (mode === 'focus') {
      cycleFocusCount += 1;
      saveCycle();

      stats.sessions += 1;
      stats.focusMinutes += Math.round(cfg().focus / 60);
      updateStreakForToday();
      saveStats();

      logSession('focus', taskEl.value.trim());
      updateStats();

      const nextMode = chooseNextAfterFocus();
      showToast(`Nice work! Time for a ${nextMode === 'long' ? 'long' : 'short'} break.`);

      initMode(nextMode);

      if (togAuto.checked) {
        startTimer();
      }
      return;
    }

    logSession(mode, '');
    showToast('Break over. Ready to focus?');

    initMode(chooseNextAfterBreak());

    if (togAuto.checked) {
      startTimer();
    }
  }

  function skipMode() {
    const previousMode = mode;
    stopTimer();

    if (previousMode === 'focus') {
      const nextMode = chooseNextAfterFocus();
      initMode(nextMode);
      showToast(`${MODE_NAME[nextMode]} started.`);
    } else {
      initMode('focus');
      showToast('Focus mode ready.');
    }
  }

  function handleDurationChange(input) {
    const keyMap = new Map([
      [setFocus, ['focus', bounds.focus, defaults.focus]],
      [setShort, ['short', bounds.short, defaults.short]],
      [setLong, ['long', bounds.long, defaults.long]],
      [setIntervalInput, ['interval', bounds.interval, defaults.interval]]
    ]);

    const entry = keyMap.get(input);
    if (!entry) return;

    const [, [min, max], fallback] = entry;
    input.value = clampInt(input.value, min, max, fallback);

    const currentTime = remaining;
    const wasIdle = !running;
    const currentTotal = total;

    saveSettings();
    updateDurationLabels();

    if (wasIdle) {
      initMode(mode);
      return;
    }

    // Do not unexpectedly alter a running timer. New values take effect next time.
    remaining = Math.max(0, currentTime);
    total = Math.max(1, currentTotal);
    render();
    showToast('Saved. New duration applies next session.');
  }

  function logSession(type, task) {
    const label = type === 'focus'
      ? (task || 'Focus session')
      : type === 'short'
        ? 'Short break'
        : 'Long break';

    const icon = type === 'focus' ? '🍅' : type === 'short' ? '☕' : '🛋️';

    sessions.unshift({
      type,
      label: String(label).slice(0, 80),
      icon,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      date: todayKey()
    });

    sessions = sessions.slice(0, 60);
    saveSessions();
    renderLog();
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char]));
  }

  function renderLog() {
    if (!sessions.length) {
      logEl.innerHTML = '<div class="pm-log-empty">No sessions yet.</div>';
      return;
    }

    logEl.innerHTML = sessions.slice(0, 30).map(session => {
      const typeClass = session.type === 'focus' ? 'focus' : 'break';
      return `
        <div class="pm-log-item ${typeClass}">
          <span>${escapeHTML(session.icon)} ${escapeHTML(session.label)}</span>
          <span style="opacity:.45;flex-shrink:0">${escapeHTML(session.time || '')}</span>
        </div>
      `;
    }).join('');
  }

  async function getAudioContext() {
    if (!audioContext) {
      const Context = window.AudioContext || window.webkitAudioContext;
      if (!Context) return null;
      audioContext = new Context();
    }

    if (audioContext.state === 'suspended') {
      try {
        await audioContext.resume();
      } catch {
        return null;
      }
    }

    return audioContext;
  }

  function beep() {
    if (!togSound.checked) return;

    getAudioContext().then(ctx => {
      if (!ctx) return;

      [0, 180, 360].forEach(delay => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.value = 880;

        osc.connect(gain);
        gain.connect(ctx.destination);

        const start = ctx.currentTime + delay / 1000;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.15, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.22);

        osc.start(start);
        osc.stop(start + 0.24);
      });
    });
  }

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);

    toastTimer = window.setTimeout(() => {
      toastEl.classList.remove('show');
    }, 2800);
  }

  btnPlay.addEventListener('click', () => {
    if (running) {
      pauseTimer();
    } else {
      startTimer();
    }
  });

  btnRestart.addEventListener('click', restartTimer);
  btnSkip.addEventListener('click', skipMode);

  document.querySelectorAll('.pm-mode-btn').forEach(button => {
    button.addEventListener('click', () => {
      const nextMode = button.dataset.mode;

      if (running) {
        pauseTimer();
      }

      initMode(nextMode);
      showToast(`${MODE_NAME[nextMode]} ready.`);
    });
  });

  [setFocus, setShort, setLong, setIntervalInput].forEach(input => {
    input.addEventListener('change', () => handleDurationChange(input));
    input.addEventListener('blur', () => handleDurationChange(input));

    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.currentTarget.blur();
      }
    });
  });

  togAuto.addEventListener('change', saveSettings);
  togSound.addEventListener('change', saveSettings);

  taskEl.addEventListener('input', () => {
    // Task is intentionally not persisted while typing. It is captured when a focus
    // session completes, avoiding stale text surviving unrelated future sessions.
  });

  document.addEventListener('keydown', event => {
    const tag = event.target?.tagName;
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

    if (typing && event.code !== 'Space') return;

    if (event.code === 'Space') {
      event.preventDefault();
      if (running) pauseTimer();
      else startTimer();
    }

    if (!typing && event.key.toLowerCase() === 'r') restartTimer();
    if (!typing && event.key.toLowerCase() === 's') skipMode();
  });

  document.addEventListener('visibilitychange', () => {
    if (running) syncClock();
  });

  window.addEventListener('pagehide', () => {
    if (running) {
      syncClock();
      clearInterval(timerId);
      timerId = null;
    }
  });

  // Initialize.
  applySavedSettings();
  rolloverStatsIfNeeded();
  updateDurationLabels();
  updateStats();
  renderLog();
  initMode('focus');
})();

  </script>
</body>
</html>
