<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>360 WebCell</title>
<link rel="icon" type="image/png" href="/favicon-32x32.png"/>
<meta name="theme-color" content="#3b82f6"/>
<link rel="stylesheet" href="/assets/css/apps-ui.css"/>
<link rel="stylesheet" href="/assets/css/mobile-nav.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;background:var(--bg)}
.topbar a.back{color:var(--muted);font-size:13px;text-decoration:none}
.topbar a.back:hover{color:var(--text)}
.logo{font-size:17px;font-weight:700;letter-spacing:-.02em}
.logo span{color:var(--a)}
.grow{flex:1}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.on i{background:var(--green)}
.shell{max-width:960px;margin:0 auto;padding:28px 20px 80px}
.hero{margin-bottom:24px}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
.hero p{font-size:14px;color:var(--muted);line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.dial{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.dial .at{color:var(--muted);font-size:17px}
.circle{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .2s var(--ease),background .2s var(--ease)}
.circle:hover{border-color:var(--a);color:var(--a)}
.circle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.circle.sm{width:32px;height:32px}
.circle.sm svg{width:15px;height:15px}
.hint{font-size:12px;color:var(--muted)}
.idbig{font-size:17px;font-weight:700;margin-bottom:14px;word-break:break-all}
.span2{grid-column:1/-1}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.head .lbl{margin:0}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .info{flex:1;min-width:0;font-size:14px}
.row .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 6px;border-radius:6px}
.row .x:hover{color:var(--danger);background:var(--danger-soft)}
.empty{font-size:13px;color:var(--muted);padding:6px 0}
.gate{max-width:420px;margin:40px auto;text-align:center}
.gate h2{font-size:18px;margin-bottom:8px}
.gate p{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.res{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.res:hover{background:var(--panel-hover)}
.err{font-size:12px;color:var(--danger);min-height:16px}
</style>
</head>
<body>
<script>try{if(localStorage.getItem('darkMode')==='true')document.body.classList.add('dark');}catch(e){}</script>
<div class="topbar">
  <a class="back" href="/apps">Apps</a>
  <div class="logo">Web<span>Cell</span></div>
  <div class="grow"></div>
  <div class="status" id="status"><i></i><span id="statusLbl">Offline</span></div>
</div>

<div class="shell">
  <div class="hero">
    <h1>WebCell</h1>
    <p>Voice and video calls between 360 accounts, right in your browser. Keep this page open to receive calls.</p>
  </div>
  <div id="root"></div>
</div>

<div class="ui-modal-ov" id="addModal">
  <div class="ui-modal">
    <h3>Add contact</h3>
    <input class="ui-input" id="addSearch" placeholder="Search by username" autocomplete="off"/>
    <div id="addResults" style="max-height:220px;overflow-y:auto"></div>
    <div class="err" id="addErr"></div>
    <div style="display:flex;justify-content:flex-end"><button class="ui-btn" id="addCancel">Close</button></div>
  </div>
</div>
<div class="ui-toast" id="toast"></div>

<script src="/assets/js/webcall.js"></script>
<script>
const SB_URL='https://wiswfpfsjiowtrdyqpxy.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpc3dmcGZzamlvd3RyZHlxcHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMzg4OTcsImV4cCI6MjA4MzkxNDg5N30.z_4FtM2c8UwgrRlafPYjolQuod4IoHQats95XHio1zM';
const sb=supabase.createClient(SB_URL,SB_ANON);

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const ICON={
  phone:'<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92Z"/></svg>',
  video:'<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
};
function toast(m,d=3000){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),d);}
window.toast=toast;
function ago(ts){const d=(Date.now()-ts)/1000;if(d<60)return'just now';if(d<3600)return Math.floor(d/60)+'m ago';if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago';}
function dur(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

let me=null,profile=null,contacts=[],recent=[];

function setStatus(on){$('status').classList.toggle('on',on);$('statusLbl').textContent=on?'Online':'Offline';}
function loadRecent(){try{recent=JSON.parse(localStorage.getItem('wc_recent_'+me.id)||'[]');}catch(e){recent=[];}}
function saveRecent(){try{localStorage.setItem('wc_recent_'+me.id,JSON.stringify(recent.slice(0,30)));}catch(e){}}

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  me=session?.user||null;
  sb.auth.onAuthStateChange((ev,s)=>{const u=s?.user||null;if((u&&u.id)!==(me&&me.id)){me=u;onAuth();}});
  await onAuth();
  const target=new URLSearchParams(location.search).get('call');
  if(target&&me)setTimeout(()=>dialName(target,new URLSearchParams(location.search).get('video')==='1'),600);
}

async function onAuth(){
  if(!me){profile=null;contacts=[];setStatus(false);render();return;}
  const {data}=await sb.from('profiles').select('id,username,avatar_url').eq('id',me.id).maybeSingle();
  profile=data||{id:me.id,username:(me.email||'user').split('@')[0]};
  loadRecent();
  await loadContacts();
  WebCall.init({sb,userId:me.id,name:profile.username,onEnd:({peer,seconds})=>{
    const r=recent.find(x=>x.pid===peer.id&&!x.dur&&Date.now()-x.ts<6*3600*1000);
    if(r&&seconds)r.dur=seconds;saveRecent();paintRecent();
  }});
  setStatus(true);
  render();
}

async function loadContacts(){
  const {data:rows}=await sb.from('msg_contacts').select('contact_id').eq('user_id',me.id);
  let ids=(rows||[]).map(r=>r.contact_id);
  if(!ids.length){
    const {data:convs}=await sb.from('msg_conversations').select('participant_ids').contains('participant_ids',[me.id]);
    ids=[...new Set((convs||[]).flatMap(c=>c.participant_ids.filter(i=>i!==me.id)))];
  }
  if(!ids.length){contacts=[];return;}
  const {data:profs}=await sb.from('profiles').select('id,username,avatar_url').in('id',ids);
  contacts=(profs||[]).map(p=>({id:p.id,name:p.username||'User',avatar:p.avatar_url}));
}

function contactRow(c,i){
  return `<div class="row">
    <div class="ui-avatar" style="width:34px;height:34px;font-size:13px">${esc(ini(c.name))}${c.avatar?`<img src="${esc(c.avatar)}" alt="">`:''}</div>
    <div class="info"><div>${esc(c.name)}</div></div>
    <button class="circle sm" data-voice="${i}" title="Voice call">${ICON.phone}</button>
    <button class="circle sm" data-video="${i}" title="Video call">${ICON.video}</button>
    <a class="circle sm" href="/apps/Current?user=${encodeURIComponent(c.id)}" title="Message" style="text-decoration:none">${ICON.chat}</a>
    <button class="x" data-del="${i}" title="Remove">✕</button>
  </div>`;
}
function paintContacts(){
  $('contactsList').innerHTML=contacts.length?contacts.map(contactRow).join(''):'<div class="empty">No contacts yet. Use + to add someone.</div>';
}
function paintRecent(){
  const el=$('recentList');if(!el)return;
  el.innerHTML=recent.length?recent.slice(0,10).map(r=>`<div class="row">
    <span style="width:18px;text-align:center;color:var(--muted)">${r.dir==='in'?'↙':'↗'}</span>
    <div class="info"><div>${esc(r.name)}</div><div class="sub">${r.video?'Video':'Voice'}${r.dur?' · '+dur(r.dur):''} · ${ago(r.ts)}</div></div>
  </div>`).join(''):'<div class="empty">No calls yet.</div>';
}

function render(){
  const root=$('root');
  if(!me){
    root.innerHTML=`<div class="ui-card gate"><h2>Sign in to use WebCell</h2><p>WebCell uses your 360 account. Contacts are shared with Current.</p><button class="ui-btn primary" id="signIn">Sign in</button></div>`;
    $('signIn').onclick=()=>location.href='/accounts?from='+encodeURIComponent(location.href);
    return;
  }
  root.innerHTML=`<div class="grid">
    <div class="ui-card">
      <div class="lbl">Call someone</div>
      <div class="dial">
        <span class="at">@</span>
        <input class="ui-input" id="dialIn" placeholder="username" autocomplete="off" spellcheck="false" maxlength="80"/>
        <button class="circle" id="dialVoice" title="Voice call">${ICON.phone}</button>
        <button class="circle" id="dialVideo" title="Video call">${ICON.video}</button>
      </div>
      <div class="hint">Type a 360 username, or pick a contact below.</div>
    </div>
    <div class="ui-card">
      <div class="lbl">Signed in as</div>
      <div class="idbig">@${esc(profile.username)}</div>
      <button class="ui-btn" id="copyBtn">Copy username</button>
    </div>
    <div class="ui-card">
      <div class="head"><div class="lbl">Contacts</div><button class="circle sm" id="addBtn" title="Add contact">+</button></div>
      <div id="contactsList"></div>
    </div>
    <div class="ui-card">
      <div class="lbl">Recent calls</div>
      <div id="recentList"></div>
    </div>
  </div>`;
  paintContacts();paintRecent();
  $('dialVoice').onclick=()=>dialName($('dialIn').value,false);
  $('dialVideo').onclick=()=>dialName($('dialIn').value,true);
  $('dialIn').addEventListener('keydown',e=>{if(e.key==='Enter')dialName($('dialIn').value,false);});
  $('copyBtn').onclick=()=>navigator.clipboard.writeText(profile.username).then(()=>toast('Copied'));
  $('addBtn').onclick=openAdd;
  $('contactsList').addEventListener('click',e=>{
    const v=e.target.closest('[data-voice]'),vd=e.target.closest('[data-video]'),d=e.target.closest('[data-del]');
    if(v)startCall(contacts[+v.dataset.voice],false);
    else if(vd)startCall(contacts[+vd.dataset.video],true);
    else if(d){
      const c=contacts[+d.dataset.del];
      sb.from('msg_contacts').delete().eq('user_id',me.id).eq('contact_id',c.id).then(()=>{contacts.splice(+d.dataset.del,1);paintContacts();});
    }
  });
}

async function startCall(c,video){
  if(!c)return;
  const ok=await WebCall.call({id:c.id,name:c.name},video);
  if(ok){recent.unshift({pid:c.id,name:c.name,dir:'out',video:!!video,ts:Date.now()});saveRecent();paintRecent();}
}

async function dialName(raw,video){
  const name=String(raw||'').trim().replace(/^@/,'');
  if(!name){toast('Enter a username');return;}
  const {data}=await sb.from('profiles').select('id,username,avatar_url').ilike('username',name.replace(/[%_]/g,m=>'\\'+m)).limit(5);
  const exact=(data||[]).filter(p=>(p.username||'').toLowerCase()===name.toLowerCase());
  if(!exact.length){toast('No user named @'+name);return;}
  if(exact.length>1){toast('Several users share that name, call them from your contacts');return;}
  startCall({id:exact[0].id,name:exact[0].username},video);
}

function openAdd(){
  $('addSearch').value='';$('addResults').innerHTML='';$('addErr').textContent='';
  $('addModal').classList.add('show');setTimeout(()=>$('addSearch').focus(),40);
}
$('addCancel').onclick=()=>$('addModal').classList.remove('show');
$('addModal').addEventListener('click',e=>{if(e.target===$('addModal'))$('addModal').classList.remove('show');});
let deb=null;
$('addSearch').addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(async()=>{
  const q=$('addSearch').value.trim().replace(/[%_,()]/g,'');
  if(q.length<2){$('addResults').innerHTML='';return;}
  const {data}=await sb.from('profiles').select('id,username,avatar_url').ilike('username','%'+q+'%').neq('id',me.id).limit(8);
  const list=data||[];
  $('addResults').innerHTML=list.map(u=>`<div class="res" data-id="${u.id}" data-name="${esc(u.username)}">
    <div class="ui-avatar" style="width:30px;height:30px;font-size:12px">${esc(ini(u.username))}</div><span>${esc(u.username)}</span></div>`).join('')||'<div class="empty">No users found.</div>';
  $('addResults').querySelectorAll('.res').forEach(r=>r.onclick=async()=>{
    if(contacts.some(c=>c.id===r.dataset.id)){toast('Already a contact');return;}
    const {error}=await sb.from('msg_contacts').upsert({user_id:me.id,contact_id:r.dataset.id},{onConflict:'user_id,contact_id'});
    if(error){$('addErr').textContent=error.message;return;}
    contacts.push({id:r.dataset.id,name:r.dataset.name});
    paintContacts();$('addModal').classList.remove('show');toast('Contact added');
  });
},280);});

init();
</script>
<script src="/assets/js/mobile-nav.js" defer></script>
</body>
</html>
