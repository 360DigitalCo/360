<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>360 — WebCell</title>
<link rel="icon" type="image/png" href="/favicon-32x32.png"/>
<meta name="theme-color" content="#3b82f6"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#05060a;--surface:#0f1119;--br:rgba(255,255,255,.08);
  --txt:#f1f5f9;--mut:#64748b;--a:#3b82f6;--a2:#6366f1;
  --good:#10b981;--red:#ef4444;
}
html,body{height:100%;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;
  border-bottom:1px solid var(--br);position:sticky;top:0;z-index:10;
  background:rgba(5,6,10,.9);backdrop-filter:blur(14px);}
.logo{font-size:17px;font-weight:800;letter-spacing:-.02em;}
.logo span{background:linear-gradient(120deg,var(--a),var(--a2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.topbar-space{flex:1;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--mut);transition:.3s;}
.status-dot.online{background:var(--good);}
.status-dot.busy{background:var(--red);}
.status-lbl{font-size:12px;color:var(--mut);}
.av-btn{width:32px;height:32px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--a),var(--a2));
  color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
.shell{max-width:940px;margin:0 auto;padding:28px 20px 60px;}
.hero{margin-bottom:28px;}
.hero h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;}
.hero h1 span{background:linear-gradient(120deg,var(--a),var(--a2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{font-size:14px;color:var(--mut);}
.gate{background:var(--surface);border:1px solid var(--br);border-radius:16px;
  padding:32px;text-align:center;max-width:420px;margin:0 auto;}
.gate h2{font-size:18px;margin-bottom:8px;}
.gate p{font-size:13px;color:var(--mut);margin-bottom:20px;line-height:1.6;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.grid{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--br);border-radius:14px;padding:18px;}
.card-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mut);margin-bottom:12px;}
.dial-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.dial-at{font-size:18px;color:var(--mut);}
.dial-in{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--br);
  border-radius:10px;padding:10px 12px;font-size:14px;color:var(--txt);
  font-family:inherit;outline:none;}
.dial-in:focus{border-color:var(--a);}
.call-btn{width:44px;height:44px;border-radius:50%;border:none;flex-shrink:0;
  background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.call-btn:hover{opacity:.88;}
.call-btn:disabled{opacity:.35;cursor:default;}
.call-btn svg,.hdr-btn svg,.round-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.hint{font-size:12px;color:var(--mut);}
.id-big{font-size:15px;font-weight:700;margin-bottom:4px;}
.id-sub{font-size:12px;color:var(--mut);margin-bottom:14px;}
.copy-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--br);
  background:transparent;color:var(--txt);font-size:12px;font-family:inherit;cursor:pointer;}
.copy-btn:hover{background:rgba(255,255,255,.06);}
.contacts-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.contacts-head h2{font-size:15px;font-weight:600;}
.plus-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--br);
  background:transparent;color:var(--txt);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.plus-btn:hover{background:rgba(255,255,255,.06);}
.c-row{display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--br);}
.c-row:last-child{border-bottom:none;}
.c-av{width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--a),var(--a2));
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.c-info{flex:1;min-width:0;font-size:13px;}
.c-sub{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.c-call{width:30px;height:30px;border-radius:50%;border:none;flex-shrink:0;
  background:rgba(59,130,246,.15);color:var(--a);cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.c-call:hover{background:rgba(59,130,246,.28);}
.c-call svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.c-msg{width:30px;height:30px;border-radius:50%;border:none;flex-shrink:0;
  background:rgba(99,102,241,.15);color:var(--a2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;text-decoration:none;}
.c-msg:hover{background:rgba(99,102,241,.28);}
.c-msg svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.c-del{width:26px;height:26px;border-radius:6px;border:none;
  background:transparent;color:var(--mut);font-size:13px;cursor:pointer;}
.c-del:hover{color:var(--red);}
.r-row{display:flex;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--br);font-size:13px;}
.r-row:last-child{border-bottom:none;}
.r-peer{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.r-meta{font-size:11px;color:var(--mut);flex-shrink:0;}
.empty{font-size:13px;color:var(--mut);padding:8px 0;}

/* Incoming */
.incoming-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;z-index:100;}
.incoming-ov.show{display:flex;}
.incoming-panel{background:var(--surface);border:1px solid var(--br);
  border-radius:20px;padding:32px 28px;text-align:center;width:min(340px,90vw);}
.inc-orb{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;
  background:linear-gradient(135deg,var(--a),var(--a2));animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.5);}50%{box-shadow:0 0 0 18px rgba(59,130,246,0);}}
.inc-lbl{font-size:12px;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;}
.inc-peer{font-size:20px;font-weight:700;margin-bottom:24px;}
.inc-btns{display:flex;gap:16px;justify-content:center;}
.btn-ans{width:56px;height:56px;border-radius:50%;border:none;background:var(--good);color:#fff;font-size:22px;cursor:pointer;}
.btn-dec{width:56px;height:56px;border-radius:50%;border:none;background:var(--red);color:#fff;font-size:22px;cursor:pointer;}

/* Active call */
.call-ov{position:fixed;inset:0;background:var(--bg);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:100;}
.call-ov.show{display:flex;}
.call-orb{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));}
.call-orb.ring{animation:pulse 1.4s ease-in-out infinite;}
.call-state{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;}
.call-peer{font-size:22px;font-weight:700;}
.call-timer{font-size:28px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.04em;}
.call-acts{display:flex;gap:20px;margin-top:8px;}
.round-btn{width:56px;height:56px;border-radius:50%;border:none;
  background:rgba(255,255,255,.1);color:var(--txt);cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.round-btn:hover{background:rgba(255,255,255,.18);}
.round-btn.active{background:rgba(59,130,246,.25);color:var(--a);}
.round-btn.hangup{background:var(--red);color:#fff;}
.round-btn.hangup:hover{background:#dc2626;}
.round-btn svg{width:22px;height:22px;}

/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-ov.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--br);border-radius:16px;
  padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;}
.modal h3{font-size:16px;font-weight:700;}
.modal label{font-size:12px;color:var(--mut);display:block;margin-bottom:5px;}
.modal input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--br);
  border-radius:10px;padding:9px 12px;font-size:13px;color:var(--txt);
  font-family:inherit;outline:none;}
.modal input:focus{border-color:var(--a);}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.modal-btns button{padding:8px 16px;border-radius:9px;border:none;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn-sec{background:rgba(255,255,255,.07);color:var(--txt);}
.btn-pri{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;}
.user-results{display:flex;flex-direction:column;gap:2px;margin-top:4px;max-height:200px;overflow-y:auto;}
.ures{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;}
.ures:hover{background:rgba(255,255,255,.06);}
.modal-err{font-size:12px;color:var(--red);min-height:16px;}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);
  background:#1e293b;color:var(--txt);border:1px solid var(--br);border-radius:10px;
  padding:9px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;
  z-index:300;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="topbar">
  <a href="/apps" style="color:var(--mut);font-size:13px;text-decoration:none;">← Apps</a>
  <div class="logo">Web<span>Cell</span></div>
  <div class="topbar-space"></div>
  <div class="status-dot" id="sDot"></div>
  <div class="status-lbl" id="sLbl">Offline</div>
  <button class="av-btn" id="avBtn" style="display:none">?</button>
</div>

<div class="shell">
  <div class="hero">
    <h1>Web<span>Cell</span></h1>
    <p>Browser-to-browser audio calls using your 360 account.</p>
  </div>
  <div id="root"></div>
</div>

<!-- Incoming -->
<div class="incoming-ov" id="incOv">
  <div class="incoming-panel">
    <div class="inc-orb"></div>
    <div class="inc-lbl">Incoming call</div>
    <div class="inc-peer" id="incPeer">—</div>
    <div class="inc-btns">
      <button class="btn-ans" id="ansBtn">📞</button>
      <button class="btn-dec" id="decBtn">✕</button>
    </div>
  </div>
</div>

<!-- Active call -->
<div class="call-ov" id="callOv">
  <div class="call-orb" id="callOrb"></div>
  <div class="call-state" id="callState">Connecting</div>
  <div class="call-peer" id="callPeer">—</div>
  <div class="call-timer" id="callTimer">0:00</div>
  <div class="call-acts">
    <button class="round-btn" id="muteBtn" title="Mute">
      <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v5M8 23h8"/></svg>
    </button>
    <button class="round-btn hangup" id="hangupBtn" title="Hang up">
      <svg viewBox="0 0 24 24"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-3-2.31M2 2l20 20"/></svg>
    </button>
    <button class="round-btn" id="spkBtn" title="Speaker">
      <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
  </div>
</div>

<!-- Add contact modal -->
<div class="modal-ov" id="addModal">
  <div class="modal">
    <h3>Add contact</h3>
    <div>
      <label>Search 360 users</label>
      <input id="addSearch" placeholder="name or email…" autocomplete="off"/>
    </div>
    <div class="user-results" id="addResults"></div>
    <div class="modal-err" id="addErr"></div>
    <div class="modal-btns">
      <button class="btn-sec" id="addCancel">Cancel</button>
    </div>
  </div>
</div>

<audio id="remAudio" autoplay playsinline></audio>
<div class="toast" id="wcToast"></div>

<script>
const SB_URL  = 'https://wiswfpfsjiowtrdyqpxy.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpc3dmcGZzamlvd3RyZHlxcHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMzg4OTcsImV4cCI6MjA4MzkxNDg5N30.z_4FtM2c8UwgrRlafPYjolQuod4IoHQats95XHio1zM';
const sb = supabase.createClient(SB_URL, SB_ANON);
const ICE = [{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];

/* ── State ── */
let me = null, myId = null; // myId = username (= webcell id)
let contacts = [];          // loaded from Supabase profiles via msg_contacts table
let recent = [];            // localStorage
let pc = null, localStream = null;
let sigCh = null;
let state = 'idle'; // idle | calling | ringing | active
let remotePeer = null, lastOffer = null;
let timerInterval = null, timerSecs = 0;
let muted = false;

/* ── Utils ── */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini = n => (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
function toast(msg,dur=3000){
  const el=$('wcToast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),dur);
}
function fmtTimer(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function timeAgo(ts){
  const d=(Date.now()-ts)/1000;
  if(d<60)return 'just now';if(d<3600)return Math.floor(d/60)+'m ago';
  if(d<86400)return Math.floor(d/3600)+'h ago';return Math.floor(d/86400)+'d ago';
}
function setStatus(s){
  const dot=$('sDot'),lbl=$('sLbl');
  if(s==='online'){dot.className='status-dot online';lbl.textContent='Online';}
  else if(s==='busy'){dot.className='status-dot busy';lbl.textContent='In a call';}
  else{dot.className='status-dot';lbl.textContent='Offline';}
}
function saveRecent(){if(myId)localStorage.setItem('wc_recent_'+myId,JSON.stringify(recent.slice(0,30)));}
function loadRecent(){recent=JSON.parse(localStorage.getItem('wc_recent_'+myId)||'[]');}

/* ── Auth ── */
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  me=session?.user??null;
  sb.auth.onAuthStateChange((_,s)=>{me=s?.user??null;onAuth();});
  onAuth();
}

async function onAuth(){
  if(me){
    // Ensure profile exists and get username
    const {data}=await sb.from('profiles').select('id,username').eq('id',me.id).single();
    if(data){myId=data.username||me.email.split('@')[0];}
    else{
      myId=me.email.split('@')[0];
      await sb.from('profiles').upsert({id:me.id,username:myId,email:me.email});
    }
    $('avBtn').style.display='';
    $('avBtn').textContent=(me.email||'U')[0].toUpperCase();
    $('avBtn').title=me.email+' — click to sign out';
    loadRecent();
    await loadContacts();
    subscribeSig();
  } else {
    myId=null;contacts=[];recent=[];
    $('avBtn').style.display='none';
    if(sigCh){sb.removeChannel(sigCh);sigCh=null;}
    setStatus('offline');
  }
  render();
}

$('avBtn').addEventListener('click',()=>sb.auth.signOut());

/* ── Contacts — from Supabase (shared with Current) ── */
async function loadContacts(){
  // Load from msg_contacts table which Current also uses
  // Falls back to profiles the user has DMed
  const {data:rows}=await sb.from('msg_contacts')
    .select('contact_id, profiles!msg_contacts_contact_id_fkey(id,username,email,avatar_url)')
    .eq('user_id',me.id);
  if(rows?.length){
    contacts=(rows||[]).map(r=>({
      id:r.contact_id,
      name:r.profiles?.username||r.profiles?.email?.split('@')[0]||'User',
      webcellId:r.profiles?.username||r.profiles?.email?.split('@')[0],
      email:r.profiles?.email,
    }));
    return;
  }
  // Fallback: people they've messaged
  const {data:convs}=await sb.from('msg_conversations')
    .select('participant_ids').contains('participant_ids',[me.id]);
  const otherIds=[...new Set((convs||[]).flatMap(c=>c.participant_ids.filter(i=>i!==me.id)))];
  if(!otherIds.length){contacts=[];return;}
  const {data:profs}=await sb.from('profiles').select('id,username,email').in('id',otherIds);
  contacts=(profs||[]).map(p=>({
    id:p.id,name:p.username||p.email?.split('@')[0],
    webcellId:p.username||p.email?.split('@')[0],email:p.email,
  }));
}

async function addContact(profileId,profile){
  // Add to msg_contacts (shared table)
  await sb.from('msg_contacts').upsert({user_id:me.id,contact_id:profileId},{onConflict:'user_id,contact_id'});
  contacts.push({id:profileId,name:profile.username||profile.email?.split('@')[0],
    webcellId:profile.username||profile.email?.split('@')[0],email:profile.email});
  render();
  toast('✓ Contact added');
}

/* ── Render ── */
function render(){
  const root=$('root');
  if(!me){
    root.innerHTML=`
      <div class="gate">
        <h2>Sign in to use WebCell</h2>
        <p>WebCell uses your 360 account. Contacts are shared with Current.</p>
        <button class="btn-pri" id="signInBtn" style="padding:10px 22px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;">Sign in with 360</button>
      </div>`;
    $('signInBtn').onclick=()=>location.href='/accounts?from='+encodeURIComponent(location.href);
    return;
  }
  root.innerHTML=`
    <div class="grid">
      <div class="card">
        <div class="card-lbl">Call someone</div>
        <div class="dial-row">
          <span class="dial-at">@</span>
          <input class="dial-in" id="dialIn" placeholder="username" autocomplete="off" spellcheck="false" maxlength="80"/>
          <button class="call-btn" id="dialBtn">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92Z"/></svg>
          </button>
        </div>
        <div class="hint">Enter a 360 username and call.</div>
      </div>

      <div class="card">
        <div class="card-lbl">Your WebCell ID</div>
        <div class="id-big">@${esc(myId)}</div>
        <div class="id-sub">${esc(me.email)}</div>
        <button class="copy-btn" id="copyBtn">Copy ID</button>
      </div>

      <div class="card">
        <div class="contacts-head">
          <div><div class="card-lbl">Contacts</div><h2 style="font-size:15px;font-weight:600;">Your people</h2></div>
          <button class="plus-btn" id="addContactBtn" title="Add contact">+</button>
        </div>
        <div id="contactsList">${renderContacts()}</div>
      </div>

      <div class="card">
        <div class="card-lbl">Recent calls</div>
        <div id="recentList">${renderRecent()}</div>
      </div>
    </div>`;

  $('dialBtn').onclick=()=>call($('dialIn').value.trim());
  $('dialIn').addEventListener('keydown',e=>{if(e.key==='Enter')call($('dialIn').value.trim());});
  $('copyBtn').onclick=()=>navigator.clipboard.writeText(myId).then(()=>toast('✓ Copied'));
  $('addContactBtn').onclick=openAddModal;
  $('contactsList').addEventListener('click',onContactClick);
}

function renderContacts(){
  if(!contacts.length)return'<div class="empty">No contacts yet. Press + to add.</div>';
  return contacts.map((c,i)=>`
    <div class="c-row">
      <div class="c-av">${ini(c.name)}</div>
      <div class="c-info">
        <div>${esc(c.name)}</div>
        <div class="c-sub">@${esc(c.webcellId)}</div>
      </div>
      <button class="c-call" data-call="${i}" title="Call">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92Z"/></svg>
      </button>
      <a class="c-msg" href="/apps/Current?user=${encodeURIComponent(c.webcellId)}" title="Message">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </a>
      <button class="c-del" data-del="${i}" title="Remove">✕</button>
    </div>`).join('');
}

function renderRecent(){
  if(!recent.length)return'<div class="empty">No calls yet.</div>';
  return recent.slice(0,10).map(r=>`
    <div class="r-row">
      <span>${r.dir==='in'?'📥':'📤'}</span>
      <span class="r-peer">@${esc(r.peer)}</span>
      <span class="r-meta">${r.dur?fmtTimer(r.dur)+' · ':''}${timeAgo(r.ts)}</span>
    </div>`).join('');
}

function onContactClick(e){
  const ci=e.target.closest('[data-call]')?.dataset.call;
  const di=e.target.closest('[data-del]')?.dataset.del;
  if(ci!==undefined) call(contacts[+ci].webcellId);
  else if(di!==undefined){
    const c=contacts[+di];
    sb.from('msg_contacts').delete().eq('user_id',me.id).eq('contact_id',c.id).then(()=>{
      contacts.splice(+di,1);
      $('contactsList').innerHTML=renderContacts();
      $('contactsList').addEventListener('click',onContactClick);
    });
  }
}

/* ── Add contact modal — searches 360 profiles ── */
function openAddModal(){
  $('addSearch').value='';$('addResults').innerHTML='';$('addErr').textContent='';
  $('addModal').classList.add('show');
  setTimeout(()=>$('addSearch').focus(),50);
}
$('addCancel').onclick=()=>$('addModal').classList.remove('show');
$('addModal').addEventListener('click',e=>{if(e.target===$('addModal'))$('addModal').classList.remove('show');});

let addDebounce=null;
$('addSearch').addEventListener('input',()=>{
  clearTimeout(addDebounce);addDebounce=setTimeout(searchProfiles,300);
});

async function searchProfiles(){
  const q=$('addSearch').value.trim();if(q.length<2){$('addResults').innerHTML='';return;}
  const {data}=await sb.from('profiles').select('id,username,email,avatar_url')
    .or(`username.ilike.%${q}%,email.ilike.%${q}%`).neq('id',me.id).limit(8);
  $('addResults').innerHTML=(data||[]).map(u=>`
    <div class="ures" data-pid="${u.id}" data-uname="${esc(u.username||u.email.split('@')[0])}" data-email="${esc(u.email)}">
      <div class="c-av" style="width:32px;height:32px;font-size:12px;">${ini(u.username||u.email)}</div>
      <div><div style="font-weight:600;">${esc(u.username||u.email.split('@')[0])}</div><div style="font-size:11px;color:var(--mut);">${esc(u.email)}</div></div>
    </div>`).join('')||'<div style="font-size:13px;color:var(--mut);padding:8px;">No users found.</div>';
  $('addResults').querySelectorAll('.ures').forEach(row=>{
    row.addEventListener('click',()=>{
      $('addModal').classList.remove('show');
      addContact(row.dataset.pid,{username:row.dataset.uname,email:row.dataset.email});
    });
  });
}

/* ── Signaling ── */
/* Key fix: use a persistent broadcast channel per user for signaling.
   Caller sends to recipient's channel. Both sides subscribe on login. */
function subscribeSig(){
  if(sigCh){sb.removeChannel(sigCh);sigCh=null;}
  if(!myId)return;
  sigCh=sb.channel('wc:'+myId,{config:{broadcast:{self:false}}});
  sigCh
    .on('broadcast',{event:'offer'},({payload})=>{lastOffer=payload.sdp;onOffer(payload);})
    .on('broadcast',{event:'answer'},({payload})=>onAnswer(payload))
    .on('broadcast',{event:'ice'},({payload})=>onIce(payload))
    .on('broadcast',{event:'hangup'},()=>endCall(false))
    .on('broadcast',{event:'decline'},()=>{toast('Call declined.');endCall(false);})
    .subscribe(s=>{if(s==='SUBSCRIBED')setStatus('online');});
}

/* Send a signal to a peer by broadcasting on their channel.
   We create a temporary send-only channel to their ID. */
function signal(toId,event,data){
  return new Promise(resolve=>{
    const ch=sb.channel('wc:'+toId,{config:{broadcast:{self:false}}});
    ch.subscribe(s=>{
      if(s==='SUBSCRIBED'){
        ch.send({type:'broadcast',event,payload:{from:myId,...data}})
          .then(()=>{setTimeout(()=>sb.removeChannel(ch),1500);resolve();});
      }
    });
  });
}

/* ── WebRTC ── */
function makePc(peerId){
  pc=new RTCPeerConnection({iceServers:ICE});
  pc.onicecandidate=e=>{if(e.candidate)signal(peerId,'ice',{candidate:e.candidate});};
  pc.ontrack=e=>{$('remAudio').srcObject=e.streams[0];};
  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==='connected'){
      $('callOrb').classList.remove('ring');
      $('callState').textContent='Connected';
      startTimer();setStatus('busy');
    } else if(['disconnected','failed','closed'].includes(pc.connectionState)){
      endCall(false);
    }
  };
}

async function getMic(){
  if(localStream)return;
  localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
}

async function call(peerId){
  if(!peerId){toast('Enter a username.');return;}
  if(!me){toast('Sign in first.');return;}
  if(peerId===myId){toast("You can't call yourself.");return;}
  if(state!=='idle'){toast('Already in a call.');return;}
  try{await getMic();}catch{toast('Mic access denied.');return;}
  state='calling';remotePeer=peerId;
  showCallOv(peerId,'Calling…',true);
  makePc(peerId);
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  await signal(peerId,'offer',{sdp:offer});
  pushRecent(peerId,'out');
}

async function onOffer({sdp,from}){
  if(state!=='idle'){await signal(from,'decline',{reason:'busy'});return;}
  state='ringing';remotePeer=from;
  $('incPeer').textContent='@'+from;
  $('incOv').classList.add('show');
}

$('ansBtn').addEventListener('click',async()=>{
  if(state!=='ringing')return;
  $('incOv').classList.remove('show');
  try{await getMic();}catch{toast('Mic denied.');await signal(remotePeer,'decline',{});state='idle';return;}
  state='active';
  makePc(remotePeer);
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  await pc.setRemoteDescription(new RTCSessionDescription(lastOffer));
  const ans=await pc.createAnswer();
  await pc.setLocalDescription(ans);
  await signal(remotePeer,'answer',{sdp:ans});
  pushRecent(remotePeer,'in');
  showCallOv(remotePeer,'Connecting…',false);
});

$('decBtn').addEventListener('click',async()=>{
  if(state!=='ringing')return;
  await signal(remotePeer,'decline',{});
  $('incOv').classList.remove('show');
  state='idle';remotePeer=null;
});

async function onAnswer({sdp}){
  if(!pc)return;
  await pc.setRemoteDescription(new RTCSessionDescription(sdp));
  state='active';
}

async function onIce({candidate}){
  if(pc&&candidate){try{await pc.addIceCandidate(new RTCIceCandidate(candidate));}catch{}}
}

function endCall(sendHangup=true){
  clearInterval(timerInterval);timerInterval=null;
  if(sendHangup&&remotePeer)signal(remotePeer,'hangup',{});
  if(pc){pc.close();pc=null;}
  if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}
  $('remAudio').srcObject=null;
  if(recent[0]&&!recent[0].dur&&timerSecs>0){recent[0].dur=timerSecs;saveRecent();}
  timerSecs=0;
  $('callOv').classList.remove('show');
  $('incOv').classList.remove('show');
  state='idle';remotePeer=null;lastOffer=null;
  setStatus('online');
  if($('recentList'))$('recentList').innerHTML=renderRecent();
}

function showCallOv(peer,st,ring){
  $('callPeer').textContent='@'+peer;
  $('callState').textContent=st;
  $('callTimer').textContent='0:00';
  $('callOrb').className='call-orb'+(ring?' ring':'');
  $('callOv').classList.add('show');
}

function startTimer(){
  timerSecs=0;clearInterval(timerInterval);
  timerInterval=setInterval(()=>{timerSecs++;$('callTimer').textContent=fmtTimer(timerSecs);},1000);
}

$('hangupBtn').addEventListener('click',()=>endCall(true));

$('muteBtn').addEventListener('click',()=>{
  if(!localStream)return;
  muted=!muted;
  localStream.getAudioTracks().forEach(t=>t.enabled=!muted);
  $('muteBtn').classList.toggle('active',muted);
  $('muteBtn').title=muted?'Unmute':'Mute';
});

$('spkBtn').addEventListener('click',()=>{$('spkBtn').classList.toggle('active');toast('Speaker toggled.');});

function pushRecent(peer,dir){recent.unshift({peer,dir,ts:Date.now()});saveRecent();}

/* ── Deep link ?call=username ── */
function checkDeepLink(){
  const u=new URLSearchParams(location.search).get('call');
  if(u&&me)setTimeout(()=>call(u),800);
}

init().then(checkDeepLink);
</script>
