<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Stack — 360</title>
<link href="/favicon-32x32.png" rel="icon" type="image/png"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    html, body { margin:0; padding:0; height:100%; width:100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#05060a; color:#f5f5f5; overflow:hidden; }
    .do-shell { display:flex; flex-direction:column; height:100vh; width:100vw; }
    .do-topbar { height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; background:rgba(10,12,20,.9); border-bottom:1px solid rgba(255,255,255,.06); backdrop-filter: blur(18px); flex-shrink:0; }
    .do-topbar-left { display:flex; align-items:center; gap:10px; }
    .do-logo { width:22px; height:22px; border-radius:6px; background: radial-gradient(circle at 20% 20%, #ffb347, #ff5c7b); }
    .do-title { font-size:14px; opacity:.9; }
    .do-topbar-right { display:flex; align-items:center; gap:8px; font-size:12px; opacity:.85; }
    .do-btn { padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.04); color:#f5f5f5; font-size:12px; cursor:pointer; }
    .do-btn:hover { background:rgba(255,255,255,.08); }
    .do-main { flex:1; display:flex; min-height:0; }

    .do-sidebar { width:220px; background:rgba(10,12,20,.96); border-right:1px solid rgba(255,255,255,.06); padding:10px; display:flex; flex-direction:column; gap:10px; font-size:13px; overflow-y:auto; flex-shrink:0; }
    .do-sidebar-title { font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.6; margin-bottom:4px; }
    .do-list-item { padding:6px 8px; border-radius:8px; background:rgba(255,255,255,.02); cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:6px; }
    .do-list-item:hover { background:rgba(255,255,255,.05); }
    .do-list-item.active { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); }
    .do-list-item span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    .do-list-badge { font-size:11px; opacity:.7; flex-shrink:0; }
    .do-list-del { opacity:0; font-size:11px; color:#ef4444; background:none; border:none; cursor:pointer; flex-shrink:0; }
    .do-list-item:hover .do-list-del { opacity:.7; }
    .do-list-del:hover { opacity:1 !important; }
    .do-new-list { margin-top:4px; font-size:12px; opacity:.8; cursor:pointer; }
    .do-new-list:hover { opacity:1; }

    .do-content { flex:1; display:flex; flex-direction:column; background: radial-gradient(circle at top, #151827, #05060a); padding:16px; gap:12px; overflow:hidden; min-width:0; }
    .do-list-header { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .do-list-title { font-size:20px; font-weight:600; background:transparent; border:none; color:#f5f5f5; font-family:inherit; width:100%; }
    .do-list-title:focus { outline:1px solid rgba(255,255,255,.2); border-radius:4px; }
    .do-list-meta { font-size:12px; opacity:.7; }

    .do-items { flex:1; overflow-y:auto; padding-right:4px; margin-top:8px; }
    .do-item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.02); margin-bottom:6px; }
    .do-item input[type="checkbox"] { width:16px; height:16px; cursor:pointer; flex-shrink:0; }
    .do-item-text { flex:1; font-size:14px; background:transparent; border:none; color:#f5f5f5; font-family:inherit; }
    .do-item-text.completed { text-decoration:line-through; opacity:.5; }
    .do-item-due { font-size:11px; opacity:.6; background:transparent; border:none; color:#f5f5f5; font-family:inherit; }
    .do-item-del { background:none; border:none; color:#ef4444; opacity:.5; cursor:pointer; font-size:13px; }
    .do-item-del:hover { opacity:1; }

    .do-new-item { margin-top:8px; display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.04); }
    .do-new-item input[type=text] { flex:1; border:none; outline:none; background:transparent; color:#f5f5f5; font-size:14px; }
    .do-new-item input[type=date] { background:transparent; border:none; color:#f5f5f5; font-size:12px; opacity:.8; }
    .do-new-item button { border:none; background:rgba(255,255,255,.12); color:#f5f5f5; border-radius:999px; padding:4px 10px; font-size:12px; cursor:pointer; }

    .do-bottom-bar { height:32px; font-size:11px; display:flex; align-items:center; justify-content:space-between; opacity:.7; flex-shrink:0; }
    .do-empty { opacity:.5; font-size:13px; padding:20px 0; text-align:center; }
    .do-gate { display:flex; align-items:center; justify-content:center; flex:1; flex-direction:column; gap:8px; }
    .do-gate p { opacity:.7; font-size:13px; }
    .do-toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:#fff; color:#0a0a0a; padding:10px 18px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:400; font-weight:600; }
    .do-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .do-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:500; display:none; align-items:center; justify-content:center; }
    .do-modal-overlay.show { display:flex; }
    .do-modal { background:#12151f; border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:20px; width:min(320px,90vw); display:flex; flex-direction:column; gap:12px; }
    .do-modal label { font-size:13px; opacity:.8; }
    .do-modal input { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:8px 10px; color:#f5f5f5; font-size:14px; font-family:inherit; outline:none; width:100%; box-sizing:border-box; }
    .do-modal input:focus { border-color:rgba(255,255,255,.3); }
    .do-modal-btns { display:flex; gap:8px; justify-content:flex-end; }
    .do-modal-btns button { padding:7px 14px; border-radius:8px; border:none; font-size:13px; cursor:pointer; font-family:inherit; font-weight:600; }
    .do-modal-btns .dm-ok { background:linear-gradient(135deg,#ffb347,#ff5c7b); color:#fff; }
    .do-modal-btns .dm-cancel { background:rgba(255,255,255,.08); color:#f5f5f5; }
  </style>

<body>
<div class="do-shell">
<div class="do-topbar">
<div class="do-topbar-left">
<div class="do-logo"></div>
<div class="do-title">Stack · Lists &amp; Tasks</div>
</div>
<div class="do-topbar-right">
<button class="do-btn" onclick="window.location.href='/apps.html'">← Apps</button>
<span id="do-presence">Private</span>
</div>
</div>
<div class="do-main">
<div class="do-sidebar">
<div>
<div class="do-sidebar-title">Lists</div>
<div id="do-list-container"></div>
</div>
<div class="do-new-list" id="do-new-list">+ New list</div>
</div>
<div class="do-content" id="do-content">
<div class="do-gate" id="do-gate">
<p>Sign in to create lists and tasks.</p>
</div>
</div>
</div>
</div>
<div class="do-toast" id="do-toast"></div>
<div class="do-modal-overlay" id="do-modal-overlay">
  <div class="do-modal">
    <label id="do-modal-label">List name</label>
    <input id="do-modal-input" maxlength="60" type="text"/>
    <div class="do-modal-btns">
      <button class="dm-cancel" id="do-modal-cancel">Cancel</button>
      <button class="dm-ok" id="do-modal-ok">Create</button>
    </div>
  </div>
</div>
<script>
    const SUPABASE_URL  = 'https://wiswfpfsjiowtrdyqpxy.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpc3dmcGZzamlvd3RyZHlxcHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMzg4OTcsImV4cCI6MjA4MzkxNDg5N30.z_4FtM2c8UwgrRlafPYjolQuod4IoHQats95XHio1zM';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    let currentUser = null;
    let lists = [];
    let items = [];
    let currentListId = null;

    const listContainer = document.getElementById('do-list-container');
    const contentEl = document.getElementById('do-content');
    const toast = document.getElementById('do-toast');

    function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2200); }

    let modalResolve = null;
    const modalOverlay = document.getElementById('do-modal-overlay');
    const modalInput   = document.getElementById('do-modal-input');
    const modalLabel   = document.getElementById('do-modal-label');
    const modalOk      = document.getElementById('do-modal-ok');
    const modalCancel  = document.getElementById('do-modal-cancel');
    function showModal(label, placeholder, initial, okText) {
      const confirmMode = placeholder === '' && initial === '';
      modalLabel.textContent = label;
      modalInput.placeholder = placeholder;
      modalInput.value = initial;
      modalInput.style.display = confirmMode ? 'none' : '';
      modalOk.textContent = okText || 'OK';
      modalOverlay.classList.add('show');
      if (!confirmMode) setTimeout(() => modalInput.focus(), 50);
      return new Promise(res => { modalResolve = res; });
    }
    function closeModal(val) { modalOverlay.classList.remove('show'); if (modalResolve) { modalResolve(val); modalResolve = null; } }
    modalOk.addEventListener('click', () => {
      const confirmMode = modalInput.style.display === 'none';
      closeModal(confirmMode ? true : (modalInput.value.trim() || null));
    });
    modalCancel.addEventListener('click', () => closeModal(null));
    modalInput.addEventListener('keydown', e => { if (e.key === 'Enter') closeModal(modalInput.value.trim() || null); if (e.key === 'Escape') closeModal(null); });
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(null); });
    function escHtml(s) { return (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function initAuth() {
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session?.user ?? null;
      await boot();
    }
    sb.auth.onAuthStateChange((_e, session) => { currentUser = session?.user ?? null; boot(); });

    async function boot() {
      if (!currentUser) {
        listContainer.innerHTML = '';
        contentEl.innerHTML = '<div class="do-gate"><p>Sign in to create lists and tasks.</p></div>';
        return;
      }
      await loadLists();
    }

    async function loadLists() {
      const { data, error } = await sb.from('todo_lists').select('*').eq('user_id', currentUser.id).order('position').order('created_at');
      if (error) { showToast('⚠️ Could not load lists.'); return; }
      lists = data;

      if (!lists.length) {
        const { data: created } = await sb.from('todo_lists').insert({ user_id: currentUser.id, name: 'Inbox' }).select().single();
        if (created) lists = [created];
      }

      if (!currentListId || !lists.find(l => l.id === currentListId)) currentListId = lists[0]?.id ?? null;
      renderSidebar();
      if (currentListId) await loadItems();
    }

    function renderSidebar() {
      listContainer.innerHTML = lists.map(l => `
        <div class="do-list-item ${l.id === currentListId ? 'active' : ''}" data-id="${l.id}">
          <span>${escHtml(l.name)}</span>
          <span class="do-list-badge" data-badge="${l.id}">…</span>
          <button class="do-list-del" data-del="${l.id}">✕</button>
        </div>`).join('');
      lists.forEach(async l => {
        const { count } = await sb.from('todo_items').select('*', { count: 'exact', head: true }).eq('list_id', l.id).eq('done', false);
        const el = listContainer.querySelector(`[data-badge="${l.id}"]`);
        if (el) el.textContent = count ?? 0;
      });
    }

    listContainer.addEventListener('click', async (e) => {
      const del = e.target.dataset.del;
      if (del) {
        e.stopPropagation();
        if (lists.length <= 1) { showToast("Can't delete your only list."); return; }
        if (!await showModal('Delete this list and all its tasks?', '', '', 'Delete')) return;
        await sb.from('todo_lists').delete().eq('id', del).eq('user_id', currentUser.id);
        if (currentListId === del) currentListId = null;
        await loadLists();
        return;
      }
      const item = e.target.closest('.do-list-item');
      if (!item) return;
      currentListId = item.dataset.id;
      renderSidebar();
      await loadItems();
    });

    document.getElementById('do-new-list').addEventListener('click', async () => {
      const name = await showModal('New list', 'List name', 'New list', 'Create');
      if (!name) return;
      const { data, error } = await sb.from('todo_lists').insert({ user_id: currentUser.id, name: name.trim() }).select().single();
      if (error) { showToast('⚠️ Could not create list.'); return; }
      currentListId = data.id;
      await loadLists();
    });

    async function loadItems() {
      const list = lists.find(l => l.id === currentListId);
      if (!list) return;
      const { data, error } = await sb.from('todo_items').select('*').eq('list_id', currentListId).order('done').order('position').order('created_at');
      if (error) { showToast('⚠️ Could not load tasks.'); return; }
      items = data;
      renderContent(list);
    }

    function renderContent(list) {
      const openCount = items.filter(i => !i.done).length;
      contentEl.innerHTML = `
        <div class="do-list-header">
          <input class="do-list-title" id="do-list-title-input" value="${escHtml(list.name)}" maxlength="60" />
        </div>
        <div class="do-list-meta">${openCount} open · ${items.length} total</div>
        <div class="do-items" id="do-items"></div>
        <div class="do-new-item">
          <input type="text" id="do-new-item-input" placeholder="Add a task..." />
          <input type="date" id="do-new-item-due" />
          <button id="do-add-item-btn">Add</button>
        </div>
        <div class="do-bottom-bar"><span>${items.length} item${items.length === 1 ? '' : 's'}</span><span></span></div>
      `;

      document.getElementById('do-list-title-input').addEventListener('change', async (e) => {
        const name = e.target.value.trim() || 'Untitled list';
        await sb.from('todo_lists').update({ name }).eq('id', list.id).eq('user_id', currentUser.id);
        const l = lists.find(x => x.id === list.id); if (l) l.name = name;
        renderSidebar();
      });

      const itemsEl = document.getElementById('do-items');
      if (!items.length) {
        itemsEl.innerHTML = '<div class="do-empty">No tasks yet — add one below.</div>';
      } else {
        itemsEl.innerHTML = items.map(i => `
          <div class="do-item" data-id="${i.id}">
            <input type="checkbox" ${i.done ? 'checked' : ''} data-toggle="${i.id}" />
            <input class="do-item-text ${i.done ? 'completed' : ''}" value="${escHtml(i.text)}" data-edit="${i.id}" />
            <input type="date" class="do-item-due" value="${i.due_date || ''}" data-due="${i.id}" />
            <button class="do-item-del" data-del="${i.id}">✕</button>
          </div>`).join('');
      }

      itemsEl.addEventListener('change', async (e) => {
        const toggleId = e.target.dataset.toggle;
        const editId = e.target.dataset.edit;
        const dueId = e.target.dataset.due;
        if (toggleId) {
          await sb.from('todo_items').update({ done: e.target.checked }).eq('id', toggleId).eq('user_id', currentUser.id);
          await loadItems(); renderSidebar();
        } else if (editId) {
          const text = e.target.value.trim();
          if (!text) { e.target.value = items.find(i => i.id === editId)?.text || ''; return; }
          await sb.from('todo_items').update({ text }).eq('id', editId).eq('user_id', currentUser.id);
        } else if (dueId) {
          await sb.from('todo_items').update({ due_date: e.target.value || null }).eq('id', dueId).eq('user_id', currentUser.id);
        }
      });
      itemsEl.addEventListener('click', async (e) => {
        const delId = e.target.dataset.del;
        if (!delId) return;
        await sb.from('todo_items').delete().eq('id', delId).eq('user_id', currentUser.id);
        await loadItems(); renderSidebar();
      });

      const addBtn = document.getElementById('do-add-item-btn');
      const newInput = document.getElementById('do-new-item-input');
      const dueInput = document.getElementById('do-new-item-due');
      async function addItem() {
        const text = newInput.value.trim();
        if (!text) return;
        const { error } = await sb.from('todo_items').insert({
          list_id: list.id, user_id: currentUser.id, text, due_date: dueInput.value || null
        });
        if (error) { showToast('⚠️ Could not add task.'); return; }
        newInput.value = ''; dueInput.value = '';
        await loadItems(); renderSidebar();
      }
      addBtn.addEventListener('click', addItem);
      newInput.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
    }

    initAuth();
  </script>
</body>
</html>
