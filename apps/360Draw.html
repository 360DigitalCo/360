<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>360Draw</title>
<link href="/favicon-32x32.png" rel="icon" type="image/png"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    html, body { margin:0; padding:0; height:100%; width:100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#05060a; color:#f5f5f5; overflow:hidden; }
    .draw-shell { display:flex; flex-direction:column; height:100vh; width:100vw; }

    .draw-topbar { height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; background:rgba(10,12,20,.9); border-bottom:1px solid rgba(255,255,255,.06); backdrop-filter: blur(18px); flex-shrink:0; }
    .draw-topbar-left { display:flex; align-items:center; gap:10px; }
    .draw-logo { width:22px; height:22px; border-radius:6px; background: radial-gradient(circle at 20% 20%, #4f9cff, #7b5cff); }
    .draw-title { font-size:14px; opacity:.9; background:transparent; border:none; color:#f5f5f5; font-family:inherit; }
    .draw-title:focus { outline: 1px solid rgba(79,156,255,.6); border-radius:4px; }
    .draw-topbar-right { display:flex; align-items:center; gap:8px; font-size:12px; opacity:.9; }
    .draw-btn { padding:6px 10px; border-radius:999px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.04); color:#f5f5f5; font-size:12px; cursor:pointer; }
    .draw-btn:hover { background: rgba(255,255,255,.08); }
    .draw-btn:disabled { opacity:.35; cursor:default; }
    .draw-btn.primary { background: linear-gradient(135deg,#4f9cff,#7b5cff); border-color:transparent; font-weight:700; }

    .draw-main { flex:1; display:flex; min-height:0; }

    .draw-toolbar { width:64px; background:rgba(10,12,20,.95); border-right:1px solid rgba(255,255,255,.06); display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:8px; flex-shrink:0; }
    .tool-btn { width:40px; height:40px; border-radius:12px; border:1px solid transparent; background:rgba(255,255,255,.02); display:flex; align-items:center; justify-content:center; cursor:pointer; color:#f5f5f5; font-size:18px; }
    .tool-btn.active { border-color: rgba(79,156,255,.9); background: rgba(79,156,255,.12); }
    .tool-sep { width:32px; height:1px; background: rgba(255,255,255,.08); margin:4px 0; }

    .draw-center { flex:1; display:flex; flex-direction:column; background: radial-gradient(circle at top, #151827, #05060a); min-width:0; }
    .draw-canvas-wrapper { flex:1; display:flex; align-items:center; justify-content:center; padding:16px; overflow:auto; }
    #draw-canvas { background:#ffffff; border-radius:16px; box-shadow: 0 18px 40px rgba(0,0,0,.6); cursor:crosshair; touch-action:none; }
    .draw-bottom-bar { height:40px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:11px; background:rgba(10,12,20,.9); border-top:1px solid rgba(255,255,255,.06); flex-shrink:0; }

    .draw-right { width:260px; background:rgba(10,12,20,.96); border-left:1px solid rgba(255,255,255,.06); display:flex; flex-direction:column; padding:10px; gap:12px; font-size:12px; overflow-y:auto; flex-shrink:0; }
    .draw-panel-title { font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.6; margin-bottom:6px; }
    .draw-panel { background:rgba(255,255,255,.02); border-radius:12px; padding:10px; border:1px solid rgba(255,255,255,.04); }

    .swatches { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .swatch { width:22px; height:22px; border-radius:6px; cursor:pointer; border:2px solid transparent; }
    .swatch.active { border-color:#fff; }
    .draw-panel input[type=color] { width:100%; height:30px; border:none; border-radius:8px; background:transparent; cursor:pointer; }
    .draw-panel input[type=range] { width:100%; }
    .size-label { display:flex; justify-content:space-between; opacity:.7; margin-top:4px; }

    .canvas-item { padding:6px 8px; border-radius:8px; background:rgba(255,255,255,.02); margin-bottom:4px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
    .canvas-item:hover { background: rgba(255,255,255,.06); }
    .canvas-item span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
    .canvas-item button { background:transparent; border:none; color:#ef4444; cursor:pointer; font-size:12px; opacity:.7; }
    .canvas-item button:hover { opacity:1; }
    .empty-note { opacity:.5; font-size:11px; padding:4px 0; }

    .draw-toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:#fff; color:#0a0a0a; padding:10px 18px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:400; font-weight:600; }
    .draw-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .draw-confirm { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:#1e2433; color:#f1f5f9; padding:12px 16px; border-radius:12px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:401; border:1px solid rgba(255,255,255,.12); display:flex; align-items:center; gap:10px; white-space:nowrap; }
    .draw-confirm.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
    .draw-confirm button { padding:5px 12px; border-radius:8px; border:none; font-size:12px; cursor:pointer; font-family:inherit; font-weight:600; }
    .draw-confirm .dc-ok { background:#ef4444; color:#fff; }
    .draw-confirm .dc-cancel { background:rgba(255,255,255,.1); color:#f1f5f9; }
  </style>

<body>
<div class="draw-shell">
<div class="draw-topbar">
<div class="draw-topbar-left">
<div class="draw-logo"></div>
<input class="draw-title" id="draw-title" maxlength="80" value="Untitled canvas"/>
</div>
<div class="draw-topbar-right">
<button class="draw-btn" onclick="window.location.href='/apps.html'">← Apps</button>
<button class="draw-btn" disabled="" id="undo-btn">↶ Undo</button>
<button class="draw-btn" disabled="" id="redo-btn">↷ Redo</button>
<button class="draw-btn" id="export-btn">⬇ Export PNG</button>
<button class="draw-btn primary" id="save-btn">Save</button>
</div>
</div>
<div class="draw-main">
<div class="draw-toolbar">
<button class="tool-btn active" data-tool="brush" title="Brush">✏️</button>
<button class="tool-btn" data-tool="eraser" title="Eraser">🩹</button>
<div class="tool-sep"></div>
<button class="tool-btn" data-tool="line" title="Line">／</button>
<button class="tool-btn" data-tool="rect" title="Rectangle">▢</button>
<button class="tool-btn" data-tool="circle" title="Circle">◯</button>
<div class="tool-sep"></div>
<button class="tool-btn" id="clear-btn" title="Clear canvas">🗑️</button>
</div>
<div class="draw-center">
<div class="draw-canvas-wrapper">
<canvas height="700" id="draw-canvas" width="1200"></canvas>
</div>
<div class="draw-bottom-bar">
<span id="draw-status">Brush · 4px · #111111</span>
<span id="draw-savestate">Not signed in — sign in to save drawings</span>
</div>
</div>
<div class="draw-right">
<div class="draw-panel">
<div class="draw-panel-title">Color</div>
<div class="swatches" id="swatches"></div>
<input id="color-picker" type="color" value="#111111"/>
</div>
<div class="draw-panel">
<div class="draw-panel-title">Brush size</div>
<input id="size-slider" max="60" min="1" type="range" value="4"/>
<div class="size-label"><span>1px</span><span id="size-val">4px</span><span>60px</span></div>
</div>
<div class="draw-panel">
<div class="draw-panel-title">My drawings</div>
<div id="canvas-list"><div class="empty-note">Sign in to see saved drawings.</div></div>
</div>
</div>
</div>
</div>
<div class="draw-toast" id="draw-toast"></div>
<div class="draw-confirm" id="draw-confirm">
  <span id="draw-confirm-msg"></span>
  <button class="dc-ok" id="draw-confirm-ok">Yes</button>
  <button class="dc-cancel" id="draw-confirm-cancel">Cancel</button>
</div>
<script>
    const SUPABASE_URL  = 'https://wiswfpfsjiowtrdyqpxy.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpc3dmcGZzamlvd3RyZHlxcHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgzMzg4OTcsImV4cCI6MjA4MzkxNDg5N30.z_4FtM2c8UwgrRlafPYjolQuod4IoHQats95XHio1zM';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    const canvas = document.getElementById('draw-canvas');
    const ctx = canvas.getContext('2d');
    const tools = document.querySelectorAll('.tool-btn[data-tool]');
    const statusEl = document.getElementById('draw-status');
    const toast = document.getElementById('draw-toast');
    const titleInput = document.getElementById('draw-title');
    const saveStateEl = document.getElementById('draw-savestate');
    const canvasListEl = document.getElementById('canvas-list');

    let currentUser = null;
    let currentDrawingId = null;

    let drawing = false;
    let tool = 'brush';
    let startX = 0, startY = 0, lastX = 0, lastY = 0;
    let color = '#111111';
    let size = 4;
    let snapshot = null;

    // Undo/redo + persistence works off an action list, replayed onto the canvas.
    let actions = [];       // committed strokes/shapes
    let currentStroke = null;
    let undone = [];

    function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2200); }

    const confirmEl = document.getElementById('draw-confirm');
    const confirmMsg = document.getElementById('draw-confirm-msg');
    let confirmResolve = null;
    document.getElementById('draw-confirm-ok').addEventListener('click', () => { confirmEl.classList.remove('show'); if (confirmResolve) { confirmResolve(true); confirmResolve = null; } });
    document.getElementById('draw-confirm-cancel').addEventListener('click', () => { confirmEl.classList.remove('show'); if (confirmResolve) { confirmResolve(false); confirmResolve = null; } });
    function drawConfirm(msg) { confirmMsg.textContent = msg; confirmEl.classList.add('show'); return new Promise(res => { confirmResolve = res; }); }

    // ── Color swatches ──
    const PALETTE = ['#111111', '#ffffff', '#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#7b5cff', '#ec4899'];
    const swatchesEl = document.getElementById('swatches');
    PALETTE.forEach(c => {
      const s = document.createElement('div');
      s.className = 'swatch' + (c === color ? ' active' : '');
      s.style.background = c;
      s.dataset.color = c;
      s.addEventListener('click', () => setColor(c));
      swatchesEl.appendChild(s);
    });
    function setColor(c) {
      color = c;
      document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.color === c));
      document.getElementById('color-picker').value = c;
      updateStatus();
    }
    document.getElementById('color-picker').addEventListener('input', e => setColor(e.target.value));

    document.getElementById('size-slider').addEventListener('input', e => {
      size = +e.target.value;
      document.getElementById('size-val').textContent = size + 'px';
      updateStatus();
    });

    function updateStatus() { statusEl.textContent = `${tool.charAt(0).toUpperCase()+tool.slice(1)} · ${size}px · ${color}`; }

    tools.forEach(btn => {
      btn.addEventListener('click', () => {
        tools.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        tool = btn.dataset.tool;
        updateStatus();
      });
    });

    // ── Drawing engine ──
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const p = e.touches ? e.touches[0] : e;
      return { x: (p.clientX - rect.left) * scaleX, y: (p.clientY - rect.top) * scaleY };
    }

    function drawAction(a) {
      ctx.strokeStyle = a.color;
      ctx.fillStyle = a.color;
      ctx.lineWidth = a.size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (a.type === 'brush') {
        ctx.beginPath();
        a.points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.stroke();
      } else if (a.type === 'eraser') {
        a.points.forEach(p => ctx.clearRect(p.x - a.size, p.y - a.size, a.size * 2, a.size * 2));
      } else if (a.type === 'line') {
        ctx.beginPath(); ctx.moveTo(a.x1, a.y1); ctx.lineTo(a.x2, a.y2); ctx.stroke();
      } else if (a.type === 'rect') {
        ctx.strokeRect(a.x1, a.y1, a.x2 - a.x1, a.y2 - a.y1);
      } else if (a.type === 'circle') {
        const r = Math.hypot(a.x2 - a.x1, a.y2 - a.y1);
        ctx.beginPath(); ctx.arc(a.x1, a.y1, r, 0, Math.PI * 2); ctx.stroke();
      }
    }

    function redrawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      actions.forEach(drawAction);
      updateUndoRedoButtons();
    }

    function updateUndoRedoButtons() {
      document.getElementById('undo-btn').disabled = actions.length === 0;
      document.getElementById('redo-btn').disabled = undone.length === 0;
    }

    function startDraw(e) {
      e.preventDefault();
      drawing = true;
      const pos = getPos(e);
      startX = lastX = pos.x; startY = lastY = pos.y;
      undone = []; // new action invalidates redo stack

      if (tool === 'brush' || tool === 'eraser') {
        currentStroke = { type: tool, color, size, points: [{ x: pos.x, y: pos.y }] };
      } else {
        snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      }
    }

    function moveDraw(e) {
      if (!drawing) return;
      e.preventDefault();
      const pos = getPos(e);

      if (tool === 'brush' || tool === 'eraser') {
        currentStroke.points.push({ x: pos.x, y: pos.y });
        drawAction({ type: tool, color, size, points: [{ x: lastX, y: lastY }, { x: pos.x, y: pos.y }] });
      } else {
        ctx.putImageData(snapshot, 0, 0);
        drawAction({ type: tool, color, size, x1: startX, y1: startY, x2: pos.x, y2: pos.y });
      }
      lastX = pos.x; lastY = pos.y;
    }

    function endDraw(e) {
      if (!drawing) return;
      drawing = false;
      const pos = e ? getPos(e) : { x: lastX, y: lastY };

      if (tool === 'brush' || tool === 'eraser') {
        actions.push(currentStroke);
        currentStroke = null;
      } else {
        actions.push({ type: tool, color, size, x1: startX, y1: startY, x2: pos.x, y2: pos.y });
      }
      updateUndoRedoButtons();
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', () => { if (drawing) endDraw(); });
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', moveDraw, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    document.getElementById('undo-btn').addEventListener('click', () => {
      if (!actions.length) return;
      undone.push(actions.pop());
      redrawAll();
    });
    document.getElementById('redo-btn').addEventListener('click', () => {
      if (!undone.length) return;
      actions.push(undone.pop());
      redrawAll();
    });
    document.getElementById('clear-btn').addEventListener('click', async () => {
      if (!actions.length) return;
      if (!await drawConfirm('Clear canvas? You can still undo.')) return;
      undone = [];
      actions = [];
      redrawAll();
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = (titleInput.value.trim() || 'drawing') + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });

    // ── Init blank canvas ──
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    updateStatus();

    // ── Auth + persistence ──
    async function initAuth() {
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session?.user ?? null;
      onAuthChanged();
    }
    sb.auth.onAuthStateChange((_e, session) => { currentUser = session?.user ?? null; onAuthChanged(); });

    function onAuthChanged() {
      saveStateEl.textContent = currentUser ? `Signed in as ${currentUser.email}` : 'Not signed in — sign in to save drawings';
      if (currentUser) loadDrawingsList(); else canvasListEl.innerHTML = '<div class="empty-note">Sign in to see saved drawings.</div>';
    }

    async function loadDrawingsList() {
      const { data, error } = await sb.from('drawings').select('id,title,updated_at,thumbnail_url')
        .eq('user_id', currentUser.id).order('updated_at', { ascending: false });
      if (error) { canvasListEl.innerHTML = '<div class="empty-note">Could not load drawings.</div>'; return; }
      if (!data.length) { canvasListEl.innerHTML = '<div class="empty-note">No saved drawings yet.</div>'; return; }
      canvasListEl.innerHTML = data.map(d => `
        <div class="canvas-item" data-id="${d.id}">
          <span style="display:flex;align-items:center;gap:6px;">
            ${d.thumbnail_url ? `<img src="${d.thumbnail_url}" style="width:28px;height:18px;object-fit:cover;border-radius:3px;" />` : ''}
            ${(d.title || 'Untitled').replace(/</g,'&lt;')}
          </span>
          <button data-del="${d.id}">✕</button>
        </div>`).join('');
    }

    canvasListEl.addEventListener('click', async (e) => {
      const delId = e.target.dataset.del;
      if (delId) {
        e.stopPropagation();
        if (!await drawConfirm('Delete this drawing?')) return;
        await sb.from('drawings').delete().eq('id', delId).eq('user_id', currentUser.id);
        if (currentDrawingId === delId) { currentDrawingId = null; }
        loadDrawingsList();
        return;
      }
      const item = e.target.closest('.canvas-item');
      if (!item) return;
      const { data, error } = await sb.from('drawings').select('*').eq('id', item.dataset.id).single();
      if (error || !data) { showToast('⚠️ Could not load drawing.'); return; }
      currentDrawingId = data.id;
      titleInput.value = data.title;
      actions = Array.isArray(data.data) ? data.data : [];
      undone = [];
      redrawAll();
      showToast('Loaded "' + data.title + '"');
    });

    document.getElementById('save-btn').addEventListener('click', async () => {
      if (!currentUser) {
        const popup = document.getElementById('auth-popup');
        if (popup) popup.classList.remove('hidden'); else showToast('Sign in to save.');
        return;
      }
      const title = titleInput.value.trim() || 'Untitled canvas';
      const thumbnail_url = canvas.toDataURL('image/png', 0.5); // small inline preview, not stored in a bucket
      const payload = { user_id: currentUser.id, title, data: actions, thumbnail_url, updated_at: new Date().toISOString() };

      let error;
      if (currentDrawingId) {
        ({ error } = await sb.from('drawings').update(payload).eq('id', currentDrawingId).eq('user_id', currentUser.id));
      } else {
        const { data, error: insErr } = await sb.from('drawings').insert(payload).select('id').single();
        error = insErr;
        if (data) currentDrawingId = data.id;
      }
      if (error) { showToast('⚠️ Save failed: ' + error.message); return; }
      showToast('✅ Saved.');
      loadDrawingsList();
    });

    initAuth();
  </script>
</body>
</html>
