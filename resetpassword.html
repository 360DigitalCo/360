<script>window.SKIP_AUTH_CHIP = true;</script>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/wide.js"></script>

<script src="/assets/js/cursor.js"></script>
<script>
    const sb = supabaseClient; // provided by main.js

    const rpContent = document.getElementById('rpContent');
    let pendingMfaFactor = null; // set if the account needs a 2FA step-up before password change

    function setMsg(el, text, type) {
      if (!el) return;
      el.textContent = text;
      el.className = "ac-msg" + (type ? " " + type : "");
    }

    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    /* ─── password strength (same behavior as sign-up) ─── */
    function initStrengthMeter(passEl, wrapId){
      const wrap = document.getElementById(wrapId); if(!wrap) return;
      const bar  = wrap.querySelector('.pw-bar-fill');
      const lbl  = wrap.querySelector('.pw-strength-label');
      const hint = wrap.querySelector('.pw-strength-hint');
      const pills = {len:document.getElementById('pw-c-len'),up:document.getElementById('pw-c-up'),num:document.getElementById('pw-c-num'),sym:document.getElementById('pw-c-sym')};
      passEl.addEventListener('input',()=>{
        const v=passEl.value;
        const checks={len:v.length>=8,up:/[A-Z]/.test(v),num:/[0-9]/.test(v),sym:/[^a-zA-Z0-9]/.test(v)};
        Object.keys(pills).forEach(k=>{ if(pills[k]) pills[k].classList.toggle('pass',checks[k]); });
        const score=Object.values(checks).filter(Boolean).length;
        const pct=[0,25,50,75,100][score];
        const colors=['','#ef4444','#f59e0b','#10b981','#3b82f6'];
        const labels=['','Weak','Fair','Good','Strong'];
        const hints=['','Add uppercase, numbers & symbols','Add numbers & symbols','Add a symbol','Great password!'];
        bar.style.width=pct+'%'; bar.style.background=colors[score]||'';
        if(lbl) lbl.textContent=labels[score]||'';
        if(hint) hint.textContent=hints[score]||'';
      });
    }

    // Checks whether the current (recovery) session already satisfies aal2.
    // Accounts with 2FA enabled need a step-up before Supabase will allow
    // updateUser({password}) — otherwise it fails with "requires reauthentication".
    async function needsMfaStepUp(){
      const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if(!aal || aal.nextLevel !== 'aal2' || aal.nextLevel === aal.currentLevel) return null;
      const { data: factors } = await sb.auth.mfa.listFactors();
      return (factors?.totp || []).find(f => f.status === 'verified') || null;
    }

    async function routeAfterRecovery(){
      const factor = await needsMfaStepUp();
      if(factor){
        pendingMfaFactor = factor;
        renderMfaChallenge();
      } else {
        renderForm();
      }
    }

    function renderMfaChallenge(){
      document.getElementById('rpTitle').textContent = 'Verify it\'s you';
      rpContent.innerHTML = `
        <p class="pw-hint">This account has two-factor authentication on. Enter the 6-digit code from your authenticator app to continue.</p>
        <div class="ac-field">
          <label>Code</label>
          <input id="mfaCode" type="text" inputmode="numeric" maxlength="6" placeholder="123456" />
        </div>
        <p class="ac-msg" id="mfaMsg"></p>
        <button class="ac-btn" id="mfaBtn">Verify</button>
      `;
      const code = document.getElementById('mfaCode');
      const msg = document.getElementById('mfaMsg');
      const btn = document.getElementById('mfaBtn');
      code.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
      btn.onclick = async () => {
        const val = code.value.trim();
        if(!val){ setMsg(msg, 'Enter your 6-digit code.', 'err'); return; }
        btn.disabled = true; btn.textContent = 'Verifying…'; setMsg(msg, '', '');
        const { data: challenge, error: chErr } = await sb.auth.mfa.challenge({ factorId: pendingMfaFactor.id });
        if(chErr){ setMsg(msg, chErr.message, 'err'); btn.disabled=false; btn.textContent='Verify'; return; }
        const { error: verErr } = await sb.auth.mfa.verify({ factorId: pendingMfaFactor.id, challengeId: challenge.id, code: val });
        if(verErr){ setMsg(msg, verErr.message, 'err'); btn.disabled=false; btn.textContent='Verify'; return; }
        document.getElementById('rpTitle').textContent = 'Set a new password';
        renderForm();
      };
    }

    function renderForm() {
      rpContent.innerHTML = `
        <div class="ac-field">
          <label>Current Password</label>
          <input id="rpCurrentPass" type="password" placeholder="Your current password" autocomplete="current-password" />
        </div>
        <div class="ac-field">
          <label>New Password</label>
          <input id="rpPass" type="password" placeholder="Min. 6 characters" autocomplete="new-password" />
          <div class="pw-strength-wrap" id="pwStrengthWrap">
            <div class="pw-bar-track"><div class="pw-bar-fill"></div></div>
            <div class="pw-meta"><span class="pw-strength-label"></span><span class="pw-strength-hint"></span></div>
            <div class="pw-checks">
              <div class="pw-pill" id="pw-c-len"><span class="pw-pip"></span>8+ chars</div>
              <div class="pw-pill" id="pw-c-up"><span class="pw-pip"></span>uppercase</div>
              <div class="pw-pill" id="pw-c-num"><span class="pw-pip"></span>number</div>
              <div class="pw-pill" id="pw-c-sym"><span class="pw-pip"></span>symbol</div>
            </div>
          </div>
        </div>
        <div class="ac-field">
          <label>Confirm Password</label>
          <input id="rpPass2" type="password" placeholder="Repeat password" autocomplete="new-password" />
        </div>
        <p class="ac-msg" id="rpMsg"></p>
        <button class="ac-btn" id="rpBtn">Update Password</button>
      `;
      const currentPass = document.getElementById('rpCurrentPass');
      const pass = document.getElementById('rpPass');
      const pass2 = document.getElementById('rpPass2');
      const msg = document.getElementById('rpMsg');
      const btn = document.getElementById('rpBtn');
      pass2.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
      initStrengthMeter(pass, 'pwStrengthWrap');

      btn.onclick = async () => {
        const cp = currentPass.value;
        const p1 = pass.value, p2 = pass2.value;
        if (!cp) { setMsg(msg, 'Enter your current password.', 'err'); return; }
        if (!p1 || p1.length < 6) { setMsg(msg, 'New password must be at least 6 characters.', 'err'); return; }
        if (p1 !== p2) { setMsg(msg, 'Passwords do not match.', 'err'); return; }
        btn.disabled = true; btn.textContent = 'Updating…'; setMsg(msg, '', '');

        // This project has Supabase's "require current password" setting on.
        // The correct way to satisfy it is passing current_password directly
        // in the updateUser payload (supabase-js v2.102.0+) — not a fresh
        // sign-in, and not a nonce.
        const { error } = await sb.auth.updateUser({ password: p1, current_password: cp });
        if (error) {
          if (error.code === 'current_password_required' || /current password/i.test(error.message)) {
            setMsg(msg, 'Current password is incorrect.', 'err');
          } else {
            setMsg(msg, error.message, 'err');
          }
          btn.disabled = false; btn.textContent = 'Update Password';
          return;
        }
        setMsg(msg, 'Password updated! Redirecting to sign in…', 'ok');
        await sb.auth.signOut();
        setTimeout(() => window.location.replace('/signin'), 1200);
      };
    }

    function renderInvalid() {
      document.getElementById('rpTitle').textContent = 'Link expired or invalid';
      rpContent.innerHTML = `
        <p class="pw-hint">This password reset link is invalid or has expired. Request a new one from the sign-in page.</p>
        <p class="ac-switch"><a href="/account?forgot">Request a new reset link</a></p>
      `;
    }

    (async () => {
      // Supabase's client picks up the recovery token from the URL (hash or
      // PKCE "code" param) automatically and, once processed, fires this
      // event with a valid session — that's our signal the link was good.
      let handled = false;
      sb.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' && session) {
          handled = true;
          routeAfterRecovery();
        }
      });

      // Fallback: some flows already have the session by the time we check.
      setTimeout(async () => {
        if (handled) return;
        const { data: { session } } = await sb.auth.getSession();
        if (session) { handled = true; routeAfterRecovery(); }
        else renderInvalid();
      }, 1200);
    })();
  </script>
